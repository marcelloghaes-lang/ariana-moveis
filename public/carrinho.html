<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meu carrinho | Ariana Móveis</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="css/tailwind.min.css">
  <link rel="stylesheet" href="checkout-ariana.css">

<style id="ariana-brand-consistency">
  :root{
    --ariana-blue:#2E6DA4;
    --ariana-blue-dark:#245A88;
    --ariana-blue-light:#56B5FF;
    --ariana-blue-soft:#EEF7FF;
    --ariana-yellow:#FFD400;
  }
  body{background:#f6f8fc;color:#172033;}
  .ar-header{background:var(--ariana-blue)!important;color:#fff!important;}
  .ar-logo,.ar-secure{color:#fff!important;}
  .ar-primary,.btn-primary{background:var(--ariana-blue)!important;color:#fff!important;border-color:var(--ariana-blue)!important;}
  .ar-primary:hover,.btn-primary:hover{background:var(--ariana-blue-dark)!important;}
  .ar-secondary{background:#fff!important;color:var(--ariana-blue)!important;border:2px solid var(--ariana-blue)!important;}
  .ar-secondary:hover{background:var(--ariana-blue-soft)!important;}
  .ar-title,.ar-card-title,.text-primary-blue{color:var(--ariana-blue)!important;}
  .ar-step.is-active .ar-step-dot,.ar-step-dot.is-active{background:var(--ariana-blue)!important;color:#fff!important;}
  .ar-field:focus,.mp-input:focus{border-color:var(--ariana-blue-light)!important;box-shadow:0 0 0 3px rgba(119,208,255,.24)!important;}
  .pay-method.active,.ar-action-row.is-selected,.btn-choice.active{border-color:var(--ariana-blue)!important;background:var(--ariana-blue-soft)!important;}
</style>
</head>
<body>
<header class="ar-header">
  <div class="ar-header-inner">
    <a class="ar-logo" href="index.html">ARIANA MÓVEIS</a>
    <div class="ar-secure"><i class="fas fa-lock"></i> ambiente seguro</div>
  </div>
</header>
<main class="ar-page">
  <a class="ar-back" href="index.html"><i class="fas fa-chevron-left"></i> Voltar para a loja</a>
  <h1 class="ar-title">Meu carrinho</h1>
  <div id="message-box" class="hidden"></div>
  <div class="ar-layout">
    <section class="ar-main">
      <div id="cart-items-container">
        <div id="loading-message" class="ar-card">Carregando itens do carrinho...</div>
      </div>
      <div class="ar-card">
        <h2 class="ar-card-title">Calcule a entrega</h2>
        <div class="ar-freight-row">
          <input id="frete-cep" class="ar-field" placeholder="Digite o CEP" maxlength="9">
          <button id="btn-calcular-frete" class="ar-secondary">Calcular</button>
        </div>
        <div id="frete" style="margin-top:13px;font-size:14px">
          <span id="frete-text">A calcular</span>
          <div id="frete-options" style="margin-top:12px;display:none"></div>
        </div>
      </div>
    </section>
    <aside class="ar-summary">
      <h2>Resumo</h2>
      <div class="ar-summary-line"><span>Subtotal</span><strong id="subtotal">R$ 0,00</strong></div>
      <div class="ar-summary-line"><span>Frete</span><strong id="frete-summary">A calcular</strong></div>
      <div class="ar-summary-line"><span>Desconto</span><strong id="desconto" style="color:var(--ariana-red)">- R$ 0,00</strong></div>
      <div class="ar-card" style="box-shadow:none;margin:18px 0 0;padding:15px">
        <div style="font-size:12px;font-weight:800;color:var(--ariana-muted);text-transform:uppercase;margin-bottom:9px">Cupom</div>
        <div class="ar-coupon">
          <input id="coupon-code" class="ar-field" placeholder="Digite seu cupom" autocomplete="off">
          <button id="btn-aplicar-cupom">Aplicar</button>
        </div>
        <div id="coupon-message" style="font-size:12px;color:var(--ariana-muted);margin-top:8px"></div>
      </div>
      <div class="ar-summary-total"><span>Total</span><strong id="total-price">R$ 0,00</strong></div>
      <div id="pix-incentive"></div>
      <button id="finalizar-compra-btn" class="ar-primary">Continuar</button>
    </aside>
  </div>
</main>
<script src="js/api-config.js"></script>
    <script src="marketplace-core.js"></script>
  <script src="marketplace-core_global_payments.js"></script>
  <script src="js/layout-fit.js" defer></script>
  <script src="js/header_auth_fix.js" defer></script>

  <script>
    const API_BASE =
      window.API_BASE ||
      localStorage.getItem("API_BASE") ||
      "https://ariana-backend.onrender.com/api";

    const API_ORIGIN =
      window.API_ORIGIN ||
      String(API_BASE).replace(/\/api\/?$/i, "");

    let cartItems = [];
    let shippingSettings = null;
    let paymentSettings = null;
    let shippingState = { status: 'idle', price: 0, service: null, raw: null, cep: null, name: null, effectivePrice: 0 };

    const DISCOUNT_VALUE = 0.00;

    const COST_SAFE_FLAGS = {
      enableRemoteShippingApi: localStorage.getItem('ENABLE_REMOTE_SHIPPING_API') === 'true',
      enableFirestoreSettings: false,
      enableProductRecommendations: false,
      enableProductShippingFetch: false,
    };

    function resolveCartProductId(it) {
      if (!it) return null;
      return it.id || it.productId || it.produtoId || it.docId || it.firestoreId || it.productDocId || it.pid || it.sku || it.codigo || it.code || null;
    }

    function normalizeItemShippingFields(it) {
      const dims = (it && (it.dimensions || it.dimension || it.medidas || it.dimensoes)) || {};
      const pesoKg = it && (it.pesoKg ?? it.weightKg ?? it.peso ?? it.weight ?? it.shippingWeightKg);
      const alturaCm = it && (it.alturaCm ?? it.heightCm ?? it.altura ?? dims.altura ?? dims.height);
      const larguraCm = it && (it.larguraCm ?? it.widthCm ?? it.largura ?? dims.largura ?? dims.width);
      const comprimentoCm = it && (it.comprimentoCm ?? it.lengthCm ?? it.comprimento ?? dims.comprimento ?? dims.length);

      let normalizedWeight = pesoKg != null ? Number(pesoKg) : null;
      let normalizedHeight = alturaCm != null ? Number(alturaCm) : null;
      let normalizedWidth = larguraCm != null ? Number(larguraCm) : null;
      let normalizedLength = comprimentoCm != null ? Number(comprimentoCm) : null;

      // Corrige automaticamente o pacote fictício antigo gravado pelo produto.html:
      // 5 kg / 11 x 11 x 20 cm. Esses valores eram defaults do frontend,
      // não medidas reais do produto.
      const isLegacyPlaceholder =
        Number(normalizedWeight) === 5 &&
        Number(normalizedHeight) === 20 &&
        Number(normalizedWidth) === 11 &&
        Number(normalizedLength) === 11;

      if (isLegacyPlaceholder) {
        normalizedWeight = 1;
        normalizedHeight = 10;
        normalizedWidth = 15;
        normalizedLength = 20;
      }

      return {
        pesoKg: Number.isFinite(normalizedWeight) && normalizedWeight > 0 ? normalizedWeight : null,
        alturaCm: Number.isFinite(normalizedHeight) && normalizedHeight > 0 ? normalizedHeight : null,
        larguraCm: Number.isFinite(normalizedWidth) && normalizedWidth > 0 ? normalizedWidth : null,
        comprimentoCm: Number.isFinite(normalizedLength) && normalizedLength > 0 ? normalizedLength : null
      };
    }

    function maskCep(v) {
      return String(v || '').replace(/\D/g, '').replace(/^(\d{5})(\d)/, '$1-$2').slice(0, 9);
    }

    function normalizeShippingDefaults(s = {}) {
      return {
        originCep: (s.originCep || s.cepOrigem || '39740-000'),
        services: Array.isArray(s.services) ? s.services : (Array.isArray(s.servicos) ? s.servicos : ['03328','03298','03220','03212']),
        defaultWeightKg: Number(s.defaultWeightKg ?? s.pesoKgPadrao ?? 1) || 1,
        defaultHeightCm: Number(s.defaultHeightCm ?? s.alturaCmPadrao ?? 10) || 10,
        defaultWidthCm: Number(s.defaultWidthCm ?? s.larguraCmPadrao ?? 15) || 15,
        defaultLengthCm: Number(s.defaultLengthCm ?? s.comprimentoCmPadrao ?? 20) || 20,
        defaultDeclaredValue: Number(s.defaultDeclaredValue ?? s.valorDeclaradoPadrao ?? 0) || 0,
        freeShippingAbove: Number(s.freeShippingAbove ?? s.freteGratisAcima ?? 0) || 0,
      };
    }

    async function loadSettingsOnce() {
      if (shippingSettings && paymentSettings) return;

      shippingSettings = normalizeShippingDefaults({});
      paymentSettings = (window.__PAYMENT_SETTINGS && typeof window.__PAYMENT_SETTINGS === 'object')
        ? window.__PAYMENT_SETTINGS
        : {};

      try {
        if (typeof window.getPaymentSettings === 'function') {
          paymentSettings = await window.getPaymentSettings(false);
        }
      } catch (_) {}
    }

    async function enrichCartWithShippingDefaults() {
      await loadSettingsOnce();
      const defs = shippingSettings || normalizeShippingDefaults({});

      const cepInput = document.getElementById('frete-cep');
      if (cepInput) {
        const saved = localStorage.getItem('shipping_cep') || '';
        if (!cepInput.value && saved) cepInput.value = maskCep(saved);
        cepInput.addEventListener('input', (e) => {
          e.target.value = maskCep(e.target.value);
        });
      }

      cartItems = cartItems.map((it) => {
        const normalized = normalizeItemShippingFields(it);
        const pesoKg = Number(normalized.pesoKg ?? it.pesoKg ?? it.weightKg ?? it.weight) || defs.defaultWeightKg;
        const alturaCm = Number(normalized.alturaCm ?? it.alturaCm ?? it.heightCm ?? it.altura ?? it.height) || defs.defaultHeightCm;
        const larguraCm = Number(normalized.larguraCm ?? it.larguraCm ?? it.widthCm ?? it.largura ?? it.width) || defs.defaultWidthCm;
        const comprimentoCm = Number(normalized.comprimentoCm ?? it.comprimentoCm ?? it.lengthCm ?? it.comprimento ?? it.length) || defs.defaultLengthCm;
        return {
          ...it,
          pesoKg, weightKg: pesoKg, weight: pesoKg,
          altura: alturaCm, alturaCm, heightCm: alturaCm, height: alturaCm,
          largura: larguraCm, larguraCm, widthCm: larguraCm, width: larguraCm,
          comprimento: comprimentoCm, comprimentoCm, lengthCm: comprimentoCm, length: comprimentoCm,
        };
      });

      // Salva a migração para que o checkout receba os mesmos dados corrigidos.
      try {
        localStorage.setItem('ariana_moveis_cart', JSON.stringify(cartItems));
        localStorage.setItem('arianaMoveisCart', JSON.stringify(cartItems));
      } catch (_) {}
    }

    function computePackageFromCart() {
      const defs = shippingSettings || normalizeShippingDefaults({});
      let weight = 0;
      let height = 0, width = 0, length = 0;

      for (const it of cartItems) {
        const qty = parseInt(it.quantity || 1, 10) || 1;
        weight += (Number(it.pesoKg) || defs.defaultWeightKg) * qty;
        height = Math.max(height, Number(it.alturaCm ?? it.heightCm ?? it.altura ?? it.height) || defs.defaultHeightCm);
        width = Math.max(width, Number(it.larguraCm ?? it.widthCm ?? it.largura ?? it.width) || defs.defaultWidthCm);
        length = Math.max(length, Number(it.comprimentoCm ?? it.lengthCm ?? it.comprimento ?? it.length) || defs.defaultLengthCm);
      }

      return {
        pesoKg: Math.max(0.3, Number(weight.toFixed(3)) || defs.defaultWeightKg),
        alturaCm: Math.max(2, Math.ceil(height || defs.defaultHeightCm)),
        larguraCm: Math.max(11, Math.ceil(width || defs.defaultWidthCm)),
        comprimentoCm: Math.max(16, Math.ceil(length || defs.defaultLengthCm)),
      };
    }

    function isArianaSeller(item) {
      const sid = String(item?.sellerId || item?.seller_id || '').toLowerCase().trim();
      const sname = String(item?.sellerName || item?.soldBy || item?.storeName || item?.vendorName || '').toLowerCase().trim();
      // Produtos antigos da própria loja nem sempre possuem sellerId gravado.
      if (!sid && !sname) return true;
      return sid === 'admin' || sid === 'ariana' || sid.includes('ariana') || sname.includes('ariana');
    }

    function isArianaOrderFromCartItems(items) {
      if (!Array.isArray(items) || items.length === 0) return false;
      for (let i = 0; i < items.length; i++) {
        if (!isArianaSeller(items[i])) return false;
      }
      return true;
    }

    function buildShippingItemsPayload() {
      return (Array.isArray(cartItems) ? cartItems : []).map((it) => {
        const qty = parseInt(it.quantity || 1, 10) || 1;
        return {
          id: resolveCartProductId(it) || it.id || null,
          productId: resolveCartProductId(it) || it.id || null,
          name: it.name || 'Produto',
          sellerId: it.sellerId || 'admin',
          sellerName: it.sellerName || 'Ariana Móveis',
          quantity: qty,
          qty,
          // O cálculo do frete usa o mesmo valor declarado da tela do produto:
          // preço-base/PIX do item, e não o preço cheio do cartão.
          unitPrice: arianaSellerBasePrice(it),
          totalPrice: arianaSellerBasePrice(it) * qty,
          pesoKg: Number(it.pesoKg || it.weightKg || it.weight || 0) || 0,
          weightKg: Number(it.pesoKg || it.weightKg || it.weight || 0) || 0,
          weight: Number(it.pesoKg || it.weightKg || it.weight || 0) || 0,
          alturaCm: Number(it.alturaCm || it.heightCm || it.height || 0) || 0,
          heightCm: Number(it.alturaCm || it.heightCm || it.height || 0) || 0,
          height: Number(it.alturaCm || it.heightCm || it.height || 0) || 0,
          larguraCm: Number(it.larguraCm || it.widthCm || it.width || 0) || 0,
          widthCm: Number(it.larguraCm || it.widthCm || it.width || 0) || 0,
          width: Number(it.larguraCm || it.widthCm || it.width || 0) || 0,
          comprimentoCm: Number(it.comprimentoCm || it.lengthCm || it.length || 0) || 0,
          lengthCm: Number(it.comprimentoCm || it.lengthCm || it.length || 0) || 0,
          length: Number(it.comprimentoCm || it.lengthCm || it.length || 0) || 0,
          dimensions: {
            altura: Number(it.alturaCm || 0) || 0,
            largura: Number(it.larguraCm || 0) || 0,
            comprimento: Number(it.comprimentoCm || 0) || 0
          }
        };
      });
    }

    function getCartSubtotalValue() {
      // IMPORTANTE: este total é usado somente como valor declarado da cotação.
      // A tela do produto envia productData.price (preço-base/PIX). Para o carrinho
      // devolver exatamente a mesma tarifa, usamos a mesma base aqui.
      return (Array.isArray(cartItems) ? cartItems : []).reduce((sum, item) => {
        return sum + (arianaSellerBasePrice(item) * (parseInt(item.quantity || 1, 10) || 1));
      }, 0);
    }

    function isExplicitFreeShipping(q = {}) {
      const flags = [
        q.isFree, q.free, q.freeShipping, q.freteGratis, q.gratis,
        q.isRegionalFree, q.regionalFree, q.arianaRegionalFree
      ];
      if (flags.some((v) => v === true || String(v).toLowerCase() === 'true')) return true;

      const reason = String(
        q.freeReason || q.reason || q.rule || q.ruleType || q.type || q.name || q.label || q.service || ''
      ).toLowerCase();

      return /frete\s*gr[aá]tis|gr[aá]tis|regional\s*free|ariana\s*regional/.test(reason);
    }

    function parseShippingMoney(value) {
      if (typeof value === 'number') return Number.isFinite(value) ? value : NaN;
      let text = String(value ?? '').trim();
      if (!text) return NaN;
      text = text.replace(/R\$|\s/g, '');
      if (text.includes(',') && text.includes('.')) {
        text = text.replace(/\./g, '').replace(',', '.');
      } else if (text.includes(',')) {
        text = text.replace(',', '.');
      }
      text = text.replace(/[^0-9.-]/g, '');
      const parsed = Number(text);
      return Number.isFinite(parsed) ? parsed : NaN;
    }

    function normalizeShippingOption(q, fallbackRaw = null) {
      if (!q || typeof q !== 'object' || q.unavailable === true || q.available === false) return null;

      const rawPrice = q.effectivePrice ?? q.price ?? q.valor ?? q.cost ?? q.amount ??
        q.value ?? q.finalPrice ?? q.totalPrice ?? q.shippingPrice ?? q.freightPrice ?? q.frete;
      if (rawPrice === undefined || rawPrice === null || rawPrice === '') return null;

      const price = parseShippingMoney(rawPrice);
      if (!Number.isFinite(price) || price < 0) return null;

      // A rota unificada pode devolver R$ 0,00 para a regra regional/gratuita
      // mesmo sem uma flag específica. O checkout já aceita esse retorno.
      const explicitFree = price === 0 || isExplicitFreeShipping(q);

      return {
        price,
        effectivePrice: price,
        explicitFree,
        name: q.name || q.label || q.carrier || q.provider || q.service || 'Frete',
        service: q.service || q.code || q.codigo || q.name || q.label || 'Frete',
        carrier: q.carrier || q.provider || q.transportadora || q.name || 'Transportadora',
        deadline: q.deadline || q.prazo || q.deliveryDays || q.days || q.estimatedDays || null,
        raw: q,
        responseRaw: fallbackRaw || q
      };
    }

    function extractShippingOptionsFromResponse(data) {
      if (!data || typeof data !== 'object') throw new Error('Resposta de frete inválida.');

      const candidates = [];
      if (Array.isArray(data.options)) candidates.push(...data.options);
      if (Array.isArray(data.quotes)) candidates.push(...data.quotes);
      if (Array.isArray(data.services)) candidates.push(...data.services);
      if (Array.isArray(data.data?.options)) candidates.push(...data.data.options);
      if (Array.isArray(data.data?.quotes)) candidates.push(...data.data.quotes);
      if (Array.isArray(data.results)) candidates.push(...data.results);
      if (Array.isArray(data.data?.results)) candidates.push(...data.data.results);
      if (Array.isArray(data.shipments)) candidates.push(...data.shipments);
      if (Array.isArray(data.data?.shipments)) candidates.push(...data.data.shipments);
      if (Array.isArray(data.fretes)) candidates.push(...data.fretes);
      if (Array.isArray(data.data?.fretes)) candidates.push(...data.data.fretes);
      if (data.cheapest && typeof data.cheapest === 'object') candidates.push(data.cheapest);
      if (data.quote && typeof data.quote === 'object') candidates.push(data.quote);
      if (data.ok && (data.price != null || data.effectivePrice != null || data.valor != null)) candidates.push(data);

      const seen = new Set();
      const options = candidates
        .map((opt) => normalizeShippingOption(opt, data))
        .filter(Boolean)
        .filter((opt) => {
          const key = `${String(opt.service).toLowerCase()}|${opt.price}|${String(opt.carrier).toLowerCase()}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .sort((a, b) => a.price - b.price);

      if (!options.length) {
        throw new Error(data?.detail || data?.error || data?.message || 'Nenhuma opção de frete válida foi encontrada para este CEP.');
      }
      return options;
    }

    function formatShippingDeadline(option) {
      const value = option?.deadline;
      if (value === undefined || value === null || value === '') return '';
      if (typeof value === 'number' || /^\d+$/.test(String(value))) return ` • até ${value} dias úteis`;
      return ` • ${String(value)}`;
    }

    function renderShippingOptions(options, selectedService = '') {
      const box = document.getElementById('frete-options');
      if (!box) return;

      const list = Array.isArray(options) ? options : [];
      if (!list.length) {
        box.style.display = 'none';
        box.innerHTML = '';
        return;
      }

      box.style.display = 'grid';
      box.style.gap = '8px';
      box.innerHTML = list.map((option, index) => {
        const checked = String(option.service) === String(selectedService) || (!selectedService && index === 0);
        const priceLabel = option.explicitFree ? 'Grátis' : window.formatPrice(option.price);
        return `
          <label style="display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid ${checked ? '#2E6DA4' : '#d7dee8'};padding:12px 14px;background:${checked ? '#eef5ff' : '#fff'};cursor:pointer">
            <span style="display:flex;align-items:flex-start;gap:10px;min-width:0">
              <input type="radio" name="shipping-option" value="${String(option.service).replace(/"/g, '&quot;')}" ${checked ? 'checked' : ''} style="margin-top:3px">
              <span>
                <strong style="display:block;color:#172033">${option.name}</strong>
                <small style="color:#667085">${option.carrier || ''}${formatShippingDeadline(option)}</small>
              </span>
            </span>
            <strong style="white-space:nowrap;color:#2E6DA4">${priceLabel}</strong>
          </label>`;
      }).join('');

      box.querySelectorAll('input[name="shipping-option"]').forEach((radio) => {
        radio.addEventListener('change', async () => {
          const chosen = list.find((opt) => String(opt.service) === String(radio.value));
          if (!chosen) return;

          shippingState = {
            ...shippingState,
            status: 'quoted',
            price: Number(chosen.price),
            effectivePrice: Number(chosen.price),
            explicitFree: !!chosen.explicitFree,
            service: chosen.service,
            name: chosen.name,
            carrier: chosen.carrier,
            selectedOption: chosen,
            options: list
          };

          try {
            localStorage.setItem('ariana_selected_shipping', JSON.stringify({
              cep: shippingState.cep,
              service: chosen.service,
              name: chosen.name,
              carrier: chosen.carrier,
              quotedPrice: Number(chosen.price),
              effectivePrice: Number(chosen.price),
              explicitFree: !!chosen.explicitFree,
              updatedAt: Date.now(),
              endpoint: shippingState.endpoint,
              raw: chosen.raw
            }));
          } catch (_) {}

          renderShippingOptions(list, chosen.service);
          await recalculateTotals();
        });
      });
    }

    function extractBestShippingOptionFromResponse(data) {
      return extractShippingOptionsFromResponse(data)[0];
    }

    async function quoteCorreios(cepDestino) {
      const cep = String(cepDestino || '').replace(/\D/g, '');
      if (cep.length !== 8) throw new Error('CEP inválido.');

      await loadSettingsOnce();
      await enrichCartWithShippingDefaults();

      const defs = shippingSettings || normalizeShippingDefaults({});
      const pkg = computePackageFromCart();
      const subtotal = getCartSubtotalValue();

      const payload = {
        cepDestino: cep,
        destinationCep: cep,
        cep,
        subtotal,
        total: subtotal,
        invoiceValue: subtotal,
        valorNota: subtotal,
        pesoKg: pkg.pesoKg,
        weightKg: pkg.pesoKg,
        weight: pkg.pesoKg,
        comprimentoCm: pkg.comprimentoCm,
        lengthCm: pkg.comprimentoCm,
        length: pkg.comprimentoCm,
        larguraCm: pkg.larguraCm,
        widthCm: pkg.larguraCm,
        width: pkg.larguraCm,
        alturaCm: pkg.alturaCm,
        heightCm: pkg.alturaCm,
        height: pkg.alturaCm,
        items: buildShippingItemsPayload(),
        sellerId: cartItems[0]?.sellerId || null,
        sellerName: cartItems[0]?.sellerName || cartItems[0]?.soldBy || 'Ariana Móveis',
        // A rota unificada identifica e aplica as regras salvas no painel.
        // Não forçamos uma regra fixa no frontend.
        isArianaOrder: isArianaOrderFromCartItems(cartItems)
      };

      const apiBase = (localStorage.getItem('API_BASE') || window.API_BASE || API_BASE || '').replace(/\/+$/, '');
      if (!apiBase) throw new Error('API de frete não configurada.');

      let data = null;
      let usedEndpoint = '';
      let lastError = '';

      // Usa somente a rota unificada do backend para não cair nas rotas antigas dos Correios/Rodocap.
      const endpoints = [
        `${apiBase}/shipping/logistics/quote`
      ];

      for (const endpoint of endpoints) {
        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const contentType = response.headers.get('content-type') || '';
          const body = contentType.includes('application/json')
            ? await response.json().catch(() => ({}))
            : { error: await response.text().catch(() => '') };

          if (!response.ok) {
            const currentError = body?.detail || body?.details || body?.error || body?.message || `HTTP ${response.status}`;
            if (response.status === 404) {
              lastError = currentError;
              continue;
            }
            if (response.status === 401 || response.status === 403) {
              lastError = currentError;
              continue;
            }
            lastError = currentError;
            continue;
          }

          data = body;
          usedEndpoint = endpoint;
          break;
        } catch (err) {
          lastError = err?.message || String(err || '');
        }
      }

      if (!data) {
        throw new Error(lastError || 'Erro no servidor ao cotar frete.');
      }

      if (!data?.ok && !Array.isArray(data?.quotes) && !data?.quote) {
        throw new Error(data?.detail || data?.error || data?.message || 'Frete indisponível.');
      }

      const options = extractShippingOptionsFromResponse(data);
      const best = options[0];

      let frete = Number(best.price);
      let thresholdFree = false;
      if (defs.freeShippingAbove > 0 && subtotal >= defs.freeShippingAbove) {
        frete = 0;
        thresholdFree = true;
      }

      shippingState = {
        status: 'quoted',
        price: Number(best.price),
        effectivePrice: Number(frete),
        explicitFree: !!best.explicitFree || thresholdFree,
        thresholdFree,
        service: best.service,
        raw: data,
        cep,
        name: best.name,
        carrier: best.carrier,
        endpoint: usedEndpoint,
        selectedOption: best,
        options
      };

      renderShippingOptions(options, best.service);

      try {
        localStorage.setItem('ariana_selected_shipping', JSON.stringify({
          cep,
          service: best.service,
          name: best.name,
          carrier: best.carrier,
          quotedPrice: Number(best.price || 0),
          effectivePrice: Number(frete),
          explicitFree: !!shippingState.explicitFree,
          updatedAt: Date.now(),
          endpoint: usedEndpoint,
          raw: data
        }));
      } catch (_) {}

      await recalculateTotals();
      return { raw: data, best, cep, endpoint: usedEndpoint };
    }

    window.formatPrice = function(price) {
      if (typeof price !== 'number' || isNaN(price)) return 'R$ 0,00';
      return price.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    function arianaMarketplacePrice(item) {
      const explicit = Number(item?.marketplacePrice ?? item?.cardPrice ?? item?.fullPrice ?? item?.precoPrazo ?? 0) || 0;
      if (explicit > 0) return explicit;
      const price = Number(item?.price ?? item?.valor ?? item?.preco ?? 0) || 0;
      const baseExplicit = Number(item?.sellerBasePrice ?? item?.pixPrice ?? item?.basePrice ?? 0) || 0;
      if (baseExplicit > 0) return +(baseExplicit / 0.83).toFixed(2);
      return price > 0 ? price : 0;
    }

    function arianaSellerBasePrice(item) {
      const explicit = Number(item?.sellerBasePrice ?? item?.pixPrice ?? item?.basePrice ?? item?.precoPix ?? 0) || 0;
      if (explicit > 0) return explicit;
      const full = arianaMarketplacePrice(item);
      return full > 0 ? +(full * 0.83).toFixed(2) : 0;
    }

    window.updateClientHeader = function(userName = 'Minha Conta') {
      const accountLink = document.getElementById('client-account-link');
      if (accountLink) {

          accountLink.href = 'minha_conta.html';

          accountLink.href = 'login_cadastro.html';

      }

    window.displayMessage = function(message, type = 'info', targetId = 'message-box', duration = 3000) {
      const msgBox = document.getElementById(targetId);
      if (!msgBox) return;

      msgBox.textContent = message;

      let classes = 'p-3 mb-4 rounded-lg font-bold transition-all duration-300 ';
      if (type === 'error') {
        classes += 'bg-red-100 text-red-700';
      } else if (type === 'success') {
        classes += 'bg-green-100 text-green-700';
      } else if (type === 'loading') {
        classes += 'bg-blue-100 text-blue-700 animate-pulse';
      } else {
        classes += 'bg-gray-100 text-gray-700';
      }

    function hasLegacyLogin() {
      const raw =
        localStorage.getItem('clienteLogado') ||
        localStorage.getItem('usuarioLogado') ||
        localStorage.getItem('currentUser');

      if (!raw) return false;

      const v = String(raw).trim();
      if (!v || v === 'false' || v === 'null' || v === 'undefined' || v === '0') return false;
      if (v === 'true') return true;

      try {
        const obj = JSON.parse(v);
        if (obj && typeof obj === 'object') {
          if (obj.uid || obj.id || obj.email) return true;
        }
      } catch (_) {}

      if (v.includes('@') && v.includes('.')) return true;
      return false;
    }

    function getCurrentUserLike() {
      try {
        const raw = localStorage.getItem('currentUser');
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (obj && typeof obj === 'object') return obj;
      } catch (_) {}
      return null;
    }

    function getWarrantyCartSignature(items = cartItems) {
      return (Array.isArray(items) ? items : [])
        .map((item) => {
          const id = String(resolveCartProductId(item) || item?.id || item?._id || item?.name || 'produto');
          const quantity = parseInt(item?.quantity || 1, 10) || 1;
          return `${id}:${quantity}`;
        })
        .sort()
        .join('|');
    }

    function cartAlreadyPassedWarranty() {
      const currentSignature = getWarrantyCartSignature();
      const reviewedSignature = String(localStorage.getItem('ariana_warranty_reviewed_cart_sig') || '');
      return !!currentSignature && currentSignature === reviewedSignature;
    }

    window.checkOutOrLogin = function() {
      if (cartItems.length === 0) {
        window.displayMessage('Seu carrinho está vazio. Adicione itens antes de finalizar a compra.', 'error', 'message-box');
        return;
      }

      // Todo carrinho novo ou alterado precisa passar uma vez pela proteção do produto.
      // Depois da revisão, o cliente volta ao carrinho e pode seguir normalmente ao checkout.
      if (!cartAlreadyPassedWarranty()) {
        sessionStorage.setItem('ariana_warranty_origin', 'cart');
        window.location.href = 'garantia_estendida.html';
        return;
      }

      const localUser = getCurrentUserLike();
      const legacyLogged = hasLegacyLogin();

      if ((localUser && (localUser.uid || localUser.id || localUser.email)) || legacyLogged) {
        window.location.href = 'checkout.html';
        return;
      }

      sessionStorage.setItem('post_login_redirect', 'checkout.html');
      sessionStorage.setItem('post_login_from', window.location.href);
      window.location.href = 'login_cadastro.html?redirect=checkout.html';
    };

    async function loadCartItems() {
      const storedItems = localStorage.getItem('ariana_moveis_cart') || localStorage.getItem('arianaMoveisCart');
      const container = document.getElementById('cart-items-container');

      if (storedItems && storedItems !== '[]' && storedItems !== '{}') {
        try {
          const parsedItems = JSON.parse(storedItems);

          if (Array.isArray(parsedItems)) {
            cartItems = parsedItems.map((it) => {
              const img =
                it.imageUrl ||
                it.image ||
                it.mainImage ||
                (Array.isArray(it.images) ? it.images[0] : null) ||
                (it.images && typeof it.images === 'object' ? Object.values(it.images)[0] : null);

              const imgUrl = (img && typeof img === 'object' && img.url) ? img.url : img;

              return {
                ...it,
                id: resolveCartProductId(it) || it.id,
                ...normalizeItemShippingFields(it),
                imageUrl: imgUrl || it.imageUrl || it.image || '',
                sellerId: it.sellerId || 'admin',
                sellerName: it.sellerName || 'Ariana Móveis',
                quantity: parseInt(it.quantity || 1, 10) || 1,
                price: parseFloat(it.price || 0) || 0
              };
            });
          } else if (parsedItems && typeof parsedItems === 'object') {
            cartItems = Object.entries(parsedItems).map(([id, it]) => {
              const img =
                it?.imageUrl ||
                it?.image ||
                it?.mainImage ||
                (Array.isArray(it?.images) ? it.images[0] : null) ||
                (it?.images && typeof it.images === 'object' ? Object.values(it.images)[0] : null);

              const imgUrl = (img && typeof img === 'object' && img.url) ? img.url : img;

              return {
                ...it,
                id: resolveCartProductId(it) || id,
                ...normalizeItemShippingFields(it),
                imageUrl: imgUrl || it?.imageUrl || it?.image || '',
                sellerId: it?.sellerId || 'admin',
                sellerName: it?.sellerName || 'Ariana Móveis',
                quantity: parseInt(it?.quantity || 1, 10) || 1,
                price: parseFloat(it?.price || 0) || 0
              };
            });

            saveCartItems(false);
          } else {
            cartItems = [];
          }
        } catch (e) {
          console.error("Erro ao parsear itens do carrinho:", e);
          cartItems = [];
        }
      } else {
        cartItems = [];
      }

      if (container) container.innerHTML = '';
      const couponInput = document.getElementById('coupon-code');
      const couponButton = document.getElementById('btn-aplicar-cupom');
      try { if (couponInput) couponInput.value = normalizeCouponCode(localStorage.getItem('ariana_applied_coupon') || ''); } catch (_) {}
      const applyCoupon = async () => {
        const code = normalizeCouponCode(couponInput?.value || '');
        if (code) localStorage.setItem('ariana_applied_coupon', code);
        else localStorage.removeItem('ariana_applied_coupon');

        const couponMsg = document.getElementById('coupon-message');
        if (couponMsg) {
          couponMsg.textContent = code ? 'Validando cupom...' : 'Cupom removido.';
          couponMsg.className = 'text-xs mt-2 text-gray-500';
        }

        const totalPixBase = cartItems.reduce((sum, item) => {
          return sum + (arianaSellerBasePrice(item) * (parseInt(item.quantity || 1, 10) || 1));
        }, 0);
        const frete = Number(shippingState?.effectivePrice ?? shippingState?.price ?? 0) || 0;
        await validateCouponRemote(code, totalPixBase + frete);
        recalculateTotals();
      };
      if (couponButton) couponButton.addEventListener('click', applyCoupon);
      if (couponInput) couponInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); applyCoupon(); } });

      renderCart();
      try { await enrichCartWithShippingDefaults(); } catch (_) {}
    }

    function saveCartItems(updateHeader = true) {
      localStorage.setItem('ariana_moveis_cart', JSON.stringify(cartItems));
      localStorage.setItem('arianaMoveisCart', JSON.stringify(cartItems));

      if (updateHeader) {
        const totalItems = cartItems.reduce((sum, item) => sum + (parseInt(item.quantity || 1, 10) || 1), 0);
        const counter = document.getElementById('cart-counter-header');

        if (counter) {
          if (totalItems > 0) counter.classList.remove('hidden');

            <div class="flex-grow">
              <h2 class="text-xl font-semibold text-text-dark">${item.name || 'Produto'}</h2>
              <p class="text-sm text-gray-500">Cor: ${item.color || 'Única'} | Entrega: ${item.delivery || 'A calcular'}</p>

              <p class="text-xs text-gray-500 mt-1">no PIX à vista <span class="text-green-600 font-bold">17% OFF</span></p>
              <p class="text-xs text-gray-500">ou ${window.formatPrice(arianaMarketplacePrice(item) * (parseInt(item.quantity || 1, 10) || 1))} no cartão</p>
            </div>
            <div class="flex items-center space-x-4 mt-4 sm:mt-0">
              <div class="flex items-center border border-gray-300 rounded-lg">

                  <i class="fas fa-minus"></i>

                <input type="number" value="${parseInt(item.quantity || 1, 10)}" id="quantity-item-${item.id}" class="w-10 text-center border-x border-gray-300 focus:outline-none" onchange="updateQuantity(${itemIdStr}, 0, this.value)" min="1">
                <button class="px-3 py-1 text-gray-700 hover:bg-gray-100 rounded-r-lg" onclick="updateQuantity(${itemIdStr}, 1)">
                  <i class="fas fa-plus"></i>

    function normalizeCouponCode(value) {
      return String(value || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '');
    }

    function readStoredCoupon() {
      try {
        return JSON.parse(localStorage.getItem('ariana_coupon_result') || 'null') || null;
      } catch (_) {
        return null;
      }
    }

    function storeCouponResult(data) {
      try {
        if (data && data.code) {
          localStorage.setItem('ariana_coupon_result', JSON.stringify(data));
          localStorage.setItem('ariana_checkout_coupon', JSON.stringify(data));
        } else {
          localStorage.removeItem('ariana_coupon_result');
          localStorage.removeItem('ariana_checkout_coupon');
        }
      } catch (_) {}
    }

    function getAppliedCoupon(baseValue) {
      const code = normalizeCouponCode(localStorage.getItem('ariana_applied_coupon') || '');
      const saved = readStoredCoupon();
      if (!code) return { code: '', valid: false, value: 0, message: '' };
      if (!saved || normalizeCouponCode(saved.code) !== code) {
        return { code, valid: false, value: 0, message: 'Clique em Aplicar para validar o cupom.' };
      }
      const rawValue = Number(saved.discountValue ?? saved.discount ?? saved.value ?? 0);
      const value = Math.min(Number(baseValue || 0), Math.max(0, Number.isFinite(rawValue) ? rawValue : 0));
      return {
        ...saved,
        code,
        valid: saved.valid !== false && value > 0,
        value,
        message: saved.message || (value > 0 ? `Cupom ${code} aplicado.` : 'Cupom sem desconto disponível.')
      };
    }

    async function validateCouponRemote(code, baseValue) {
      const cleanCode = normalizeCouponCode(code);
      if (!cleanCode) {
        localStorage.removeItem('ariana_applied_coupon');
        storeCouponResult(null);
        return { code: '', valid: false, value: 0, message: '' };
      }

      const payload = {
        code: cleanCode,
        subtotal: Number(baseValue || 0),
        total: Number(baseValue || 0),
        items: cartItems.map((item) => ({
          productId: item.id || item.productId || item._id || '',
          sellerId: item.sellerId || '',
          category: item.category || item.categoryName || '',
          quantity: Number(item.quantity || 1),
          price: arianaSellerBasePrice(item)
        }))
      };

      try {
        const res = await fetch(`${String(API_BASE).replace(/\/+$/, '')}/coupons/validate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.valid === false || data.ok === false) {
          const result = { code: cleanCode, valid: false, value: 0, discountValue: 0, message: data.message || data.error || 'Cupom inválido ou expirado.' };
          storeCouponResult(result);
          return result;
        }
        const discountValue = Number(data.discountValue ?? data.discount ?? data.value ?? data.amount ?? 0) || 0;
        const result = {
          ...data,
          code: cleanCode,
          valid: true,
          value: discountValue,
          discountValue,
          message: data.message || `Cupom ${cleanCode} aplicado.`
        };
        localStorage.setItem('ariana_applied_coupon', cleanCode);
        storeCouponResult(result);
        return result;
      } catch (error) {
        const result = { code: cleanCode, valid: false, value: 0, discountValue: 0, message: 'Não foi possível validar o cupom agora.' };
        storeCouponResult(result);
        return result;
      }
    }

    async function recalculateTotals() {
      const totalPrazo = cartItems.reduce((sum, item) => {
        return sum + (arianaMarketplacePrice(item) * (parseInt(item.quantity || 1, 10) || 1));
      }, 0);

      const totalPixBase = cartItems.reduce((sum, item) => {
        return sum + (arianaSellerBasePrice(item) * (parseInt(item.quantity || 1, 10) || 1));
      }, 0);

      await loadSettingsOnce();
      const defs = shippingSettings || normalizeShippingDefaults({});

      let frete = Number(shippingState?.effectivePrice ?? shippingState?.price ?? 0) || 0;

      let thresholdFree = false;
      if (defs.freeShippingAbove > 0 && totalPixBase >= defs.freeShippingAbove) {
        frete = 0;
        thresholdFree = true;
      }

      if (shippingState && shippingState.status === 'quoted') {
        shippingState.effectivePrice = frete;
        shippingState.thresholdFree = thresholdFree;
        shippingState.explicitFree = !!shippingState.selectedOption?.explicitFree || thresholdFree;
        try {
          const saved = localStorage.getItem('ariana_selected_shipping');
          if (saved) {
            const obj = JSON.parse(saved);
            obj.effectivePrice = Number(frete || 0);
            obj.updatedAt = Date.now();
            localStorage.setItem('ariana_selected_shipping', JSON.stringify(obj));
          }
        } catch (_) {}
      }

      const subtotal = totalPrazo;
      const totalPixComFrete = totalPixBase + frete;
      const totalPrazoComFrete = totalPrazo + frete;
      const coupon = getAppliedCoupon(totalPixComFrete);
      const couponDiscount = coupon.valid ? Number(coupon.value || 0) : 0;
      const totalPixComFreteFinal = Math.max(0, totalPixComFrete - couponDiscount);
      const totalPrazoComFreteFinal = Math.max(0, totalPrazoComFrete - couponDiscount);
      const economiaPix = Math.max(0, totalPrazo - totalPixBase);
      // O desconto de 17% já está demonstrado no preço PIX. No campo “Desconto”
      // mostramos somente cupom aplicado, evitando duplicar visualmente o abatimento.
      const descontoTotal = couponDiscount;

      try {
        localStorage.setItem('ariana_cart_totals', JSON.stringify({
          subtotal,
          totalPixBase,
          frete,
          totalPixComFrete: totalPixComFreteFinal,
          totalPrazoComFrete: totalPrazoComFreteFinal,
          couponCode: coupon.code || '',
          couponDiscount,
          economiaPix,
          updatedAt: Date.now()
        }));
      } catch (_) {}

      document.getElementById('subtotal').textContent = window.formatPrice(subtotal);

      const freteTextEl = document.getElementById('frete-text');
      if (freteTextEl) {
        if (shippingState.status === 'loading') {
          freteTextEl.textContent = 'Calculando...';
        } else if (shippingState.status === 'error') {
          freteTextEl.textContent = 'Erro ao calcular';
        } else if (shippingState.status === 'quoted') {
          if (frete === 0 && shippingState.explicitFree) {
            freteTextEl.textContent = 'Grátis';
          } else if (frete === 0) {
            freteTextEl.textContent = 'Frete indisponível';
          } else {
            const nome = shippingState.name || shippingState.service || '';
            freteTextEl.textContent = (nome ? nome + ': ' : '') + window.formatPrice(frete);
          }
        } else {
          freteTextEl.textContent = 'A calcular';
        }
      }

      const descontoEl = document.getElementById('desconto');
      if (descontoEl) {
        descontoEl.textContent = descontoTotal > 0 ? `- ${window.formatPrice(descontoTotal)}` : `- ${window.formatPrice(0)}`;
      }

      const totalEl = document.getElementById('total-price');
      if (totalEl) {
        totalEl.innerHTML = `
          <span class="text-2xl font-black">${window.formatPrice(totalPixComFreteFinal)}</span>
          <div class="text-green-600 text-sm font-bold mt-1">no PIX ou boleto à vista</div>
          ${couponDiscount > 0 ? `<div class="text-blue-600 text-xs font-bold mt-1">Cupom ${coupon.code}: - ${window.formatPrice(couponDiscount)}</div>` : ''}
          <div class="text-gray-500 text-xs font-semibold mt-1">ou ${window.formatPrice(totalPrazoComFreteFinal)} no cartão</div>
        `;

        let pixPromo = document.getElementById('pix-incentive');
        if (pixPromo) {
          pixPromo.innerHTML = '';
          pixPromo.classList.add('hidden');
        }
      }

      const couponInput = document.getElementById('coupon-code');
      const couponMsg = document.getElementById('coupon-message');
      if (couponInput && !couponInput.value) couponInput.value = coupon.code || '';
      if (couponMsg) {
        couponMsg.textContent = coupon.message || 'Digite um cupom válido da Ariana Móveis.';
        couponMsg.className = 'text-xs mt-2 ' + (coupon.valid ? 'text-green-600 font-semibold' : 'text-gray-500');
      }
    }

    window.updateQuantity = function(itemId, change, newValue = null) {
      const itemIndex = cartItems.findIndex(item => String(item.id) === String(itemId));
      if (itemIndex === -1) return;

      let newQuantity = parseInt(cartItems[itemIndex].quantity || 1, 10) || 1;

      if (newValue !== null) {
        newQuantity = parseInt(newValue, 10) || 1;
      } else {
        newQuantity += change;
      }

      if (newQuantity < 1) {
        window.removeItem(itemId);
        return;
      }

      cartItems[itemIndex].quantity = newQuantity;

      const quantityInput = document.getElementById(`quantity-item-${itemId}`);
      if (quantityInput) {
        quantityInput.classList.add('bg-blue-50', 'text-primary-blue', 'font-extrabold');
        quantityInput.value = newQuantity;
        setTimeout(() => {
          quantityInput.classList.remove('bg-blue-50', 'text-primary-blue', 'font-extrabold');
        }, 300);
      }

      const itemElementPrice = document.getElementById(`price-item-${itemId}`);
      if (itemElementPrice) {
        itemElementPrice.textContent = window.formatPrice(arianaMarketplacePrice(cartItems[itemIndex]) * newQuantity);
      }

      recalculateTotals();
      saveCartItems();
    };

    window.removeItem = function(itemId) {
      const itemToRemove = cartItems.find(item => String(item.id) === String(itemId));
      if (!itemToRemove) return;

      cartItems = cartItems.filter(item => String(item.id) !== String(itemId));

      const itemElement = document.querySelector(`.cart-item[data-item-id="${CSS.escape(String(itemId))}"]`);
      if (itemElement) {
        itemElement.classList.remove('p-4', 'shadow-md');
        itemElement.classList.add('opacity-0', 'h-0', 'p-0', 'border-none', 'overflow-hidden');

        setTimeout(async () => {
          itemElement.remove();
          recalculateTotals();
          saveCartItems();

          if (cartItems.length === 0) {
            renderCart();
            try { await enrichCartWithShippingDefaults(); } catch (_) {}
          }
        }, 400);
      } else {
        recalculateTotals();
        saveCartItems();
      }

      window.displayMessage(`"${itemToRemove.name}" removido do carrinho.`, 'success', 'message-box');
    };

    function bindFreteButton() {
      const btnFrete = document.getElementById('btn-calcular-frete');
      const cepInput = document.getElementById('frete-cep');

      if (btnFrete && cepInput) {
        btnFrete.addEventListener('click', async () => {
          const cep = String(cepInput.value || '').replace(/\D/g, '');
          if (cep.length !== 8) {
            window.displayMessage('CEP inválido.', 'error', 'message-box');
            return;
          }

          localStorage.setItem('shipping_cep', maskCep(cep));
          shippingState = { status: 'loading', price: 0, effectivePrice: 0, explicitFree: false, service: null, raw: null, cep };
          renderShippingOptions([]);
          await recalculateTotals();

          try {
            await enrichCartWithShippingDefaults();
            await quoteCorreios(cep);
            window.displayMessage('Frete calculado.', 'success', 'message-box');
          } catch (e) {
            console.error('[cart] frete erro:', e);
            shippingState = { status: 'error', price: 0, effectivePrice: 0, explicitFree: false, service: null, raw: String(e), cep };
            renderShippingOptions([]);
            await recalculateTotals();
            const msg = String(e?.message || e || 'Erro ao calcular frete.');
            window.displayMessage(msg.includes('Sem opções de frete') ? msg : 'Erro ao calcular frete. Verifique o CEP e tente novamente.', 'error', 'message-box', 6000);
          }
        });
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const localUser = getCurrentUserLike();
        if (localUser?.name) {
          window.updateClientHeader(localUser.name);
        } else {
          const clientDataString = sessionStorage.getItem('clientArianaMoveis');
          if (clientDataString) {
            try {
              const parsed = JSON.parse(clientDataString);
              window.updateClientHeader(parsed.name || 'Minha Conta');
            } catch (_) {
              window.updateClientHeader('Minha Conta');
            }
          } else {
            window.updateClientHeader('Minha Conta');
          }
        }

        await loadCartItems();
        bindFreteButton();

        const finalizarCompraBtn = document.getElementById('finalizar-compra-btn');
        if (finalizarCompraBtn) {
          finalizarCompraBtn.addEventListener('click', window.checkOutOrLogin);
        }
      } catch (error) {
        console.error('[cart] erro na inicialização:', error);
        window.displayMessage('Erro ao carregar o carrinho.', 'error', 'message-box', 5000);
      }
    });
  </script>


<script>
(function(){
 const source=document.getElementById('frete-text');
 const target=document.getElementById('frete-summary');
 if(source&&target){
   new MutationObserver(()=>target.textContent=source.textContent).observe(source,{childList:true,subtree:true,characterData:true});
   target.textContent=source.textContent;
 }
})();
</script>
