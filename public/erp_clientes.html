<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes | Ariana ERP</title><style>:root{--b:#0646a5;--bg:#f4f6f9;--line:#dce3ec;--text:#172033;--muted:#69758a;--green:#087a52}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Inter,Segoe UI,Arial,sans-serif;color:var(--text)}header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}header h1{font-size:18px;margin:0}header a{color:var(--b);font-weight:800;text-decoration:none}.wrap{max-width:1250px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 7px 22px rgba(23,32,51,.05)}.bar{display:flex;gap:8px;margin-bottom:13px}.bar input{flex:1;border:1px solid #cfd8e5;border-radius:10px;padding:11px 12px;font:inherit}.bar button,.action{border:0;background:var(--b);color:#fff;border-radius:9px;padding:10px 14px;font-weight:900;cursor:pointer}.stats{display:flex;gap:18px;color:var(--muted);font-size:12px;margin-bottom:12px}.stats b{color:var(--text)}table{width:100%;border-collapse:collapse}th{font-size:10px;text-transform:uppercase;color:#788397;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}td{padding:11px 8px;border-bottom:1px solid #edf0f5;vertical-align:top}.name{font-weight:900}.muted{color:var(--muted);font-size:12px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#eaf7f2;color:var(--green);font-size:10px;font-weight:800}.empty{text-align:center;padding:35px;color:var(--muted)}@media(max-width:760px){.wrap{padding:10px}.hide-m{display:none}.bar{flex-direction:column}table{font-size:12px}}</style></head><body><header><div><h1>Clientes</h1><small>Cadastro comercial do Ariana ERP</small></div><a href="erp_ariana.html">← Central ERP</a></header><main class="wrap"><section class="card"><div class="bar"><input id="q" placeholder="Buscar por nome, CPF/CNPJ, telefone ou e-mail" autofocus><button id="search">Buscar</button></div><div class="stats" id="stats">Carregando clientes…</div><div style="overflow:auto"><table><thead><tr><th>Cliente</th><th>CPF/CNPJ</th><th>Contato</th><th class="hide-m">Cidade/UF</th><th></th></tr></thead><tbody id="body"></tbody></table></div><div class="empty" id="empty" style="display:none">Nenhum cliente encontrado.</div></section></main><script>const API=(location.hostname==='localhost'?'http://localhost:3000/api':'https://ariana-backend.onrender.com/api');const $=id=>document.getElementById(id);function token(){const t=localStorage.getItem('admin_token')||localStorage.getItem('auth_token')||localStorage.getItem('token')||'';if(t)return t;try{return JSON.parse(localStorage.getItem('banner_admin_session')||'null')?.token||''}catch{return''}}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function doc(v=''){const d=String(v).replace(/\D/g,'');if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');return v||'—'}async function load(){const q=$('q').value.trim();$('body').innerHTML='<tr><td colspan="5" class="empty">Carregando…</td></tr>';try{const r=await fetch(API+'/erp/people?q='+encodeURIComponent(q)+'&limit=150',{headers:{Authorization:'Bearer '+token()},cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Erro ao carregar clientes.');$('stats').innerHTML=`<span><b>${d.count||0}</b> exibidos</span><span><b>${d.commercialCount||0}</b> cadastro ERP</span><span><b>${d.siteOnlyCount||0}</b> somente site</span>`;$('body').innerHTML=(d.people||[]).map(p=>`<tr><td><div class="name">${esc(p.name)}</div><span class="pill">${esc(p.source==='sige'?'Importado SIGE':p.source==='site'?'Cliente do site':'ERP')}</span></td><td>${esc(doc(p.document))}</td><td>${esc(p.phone||'—')}<div class="muted">${esc(p.email||'')}</div></td><td class="hide-m">${esc(p.addressText||'—')}</td><td><button class="action" data-sell="${esc(p.id)}">Vender</button></td></tr>`).join('');$('empty').style.display=d.count?'none':'block'}catch(e){$('body').innerHTML=`<tr><td colspan="5" class="empty">${esc(e.message)}</td></tr>`}}$('search').onclick=load;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')load()});$('body').onclick=e=>{const b=e.target.closest('[data-sell]');if(b)location.href='erp_nova_venda.html?cliente='+encodeURIComponent(b.dataset.sell)};load();</script></body></html>
