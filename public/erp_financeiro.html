<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Financeiro | Ariana ERP</title><style>
:root{--blue:#0646a5;--bg:#f4f6f9;--line:#dce3ec;--text:#172033;--muted:#6b778b;--green:#11845b;--red:#c83f49;--amber:#b97000;--shadow:0 8px 24px rgba(23,32,51,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}.top h1{margin:0;font-size:18px}.top a{color:var(--blue);font-weight:850;text-decoration:none}.wrap{max-width:1450px;margin:auto;padding:18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:13px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.card small{color:var(--muted);font-weight:750}.card strong{display:block;font-size:23px;margin-top:7px}.tools{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:9px;margin-bottom:13px;box-shadow:var(--shadow)}.tools input{flex:1}.tools input,.tools select{border:1px solid #cfd8e5;border-radius:9px;padding:10px}.btn{border:0;border-radius:8px;padding:9px 11px;font-weight:850;cursor:pointer}.blue{background:var(--blue);color:#fff}.receive{background:#eaf8f2;color:var(--green)}.disabled{opacity:.45;cursor:not-allowed}.tablebox{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:900px}th{font-size:10px;text-transform:uppercase;letter-spacing:.45px;color:#778296;text-align:left;padding:11px 12px;background:#fafbfd;border-bottom:1px solid var(--line)}td{padding:11px 12px;border-bottom:1px solid #edf0f5}.code{font-weight:950;color:var(--blue)}.muted{font-size:12px;color:var(--muted)}.status{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900;background:#fff5df;color:var(--amber)}.status.recebido{background:#eaf8f2;color:var(--green)}.status.estornado,.status.cancelado{background:#fff0f1;color:var(--red)}.overdue{color:var(--red);font-weight:900}.empty{text-align:center;padding:32px;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 15px;border-radius:10px;z-index:99}.hidden{display:none!important}.auth{max-width:550px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.wrap{padding:10px}}@media(max-width:600px){.cards{grid-template-columns:1fr}.tools{display:grid}.top span{display:none}}
</style></head><body><header class="top"><div><h1>Financeiro • Contas a Receber</h1><span class="muted">Ariana ERP Lite</span></div><a href="erp_ariana.html">← Central ERP</a></header><div class="auth hidden" id="auth"><h2>Login necessário</h2><p>Entre no painel administrativo para acessar o financeiro.</p><a href="admin_painel.html">Abrir painel</a></div><main class="wrap" id="app"><div class="cards"><div class="card"><small>Parcelas encontradas</small><strong id="m-count">—</strong></div><div class="card"><small>A receber</small><strong id="m-pending">—</strong></div><div class="card"><small>Recebido</small><strong id="m-received">—</strong></div><div class="card"><small>Vencidas</small><strong id="m-overdue">—</strong></div></div><div class="tools"><input id="search" placeholder="Buscar cliente, código, CPF, telefone ou forma de pagamento"><select id="status"><option value="all">Todos</option><option value="pendente">Pendentes</option><option value="recebido">Recebidos</option><option value="estornado">Estornados</option><option value="cancelado">Cancelados</option></select><button class="btn blue" id="refresh">Atualizar</button></div><div class="tablebox"><table><thead><tr><th>Venda</th><th>Cliente</th><th>Parcela</th><th>Vencimento</th><th>Forma</th><th>Valor</th><th>Status</th><th>Ação</th></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty">Carregando…</div></div></main><div class="toast hidden" id="toast"></div><script>
const API_LOCAL='http://localhost:3000/api',API_RENDER='https://ariana-backend.onrender.com/api',IS_LOCAL=location.hostname==='localhost'||location.hostname==='127.0.0.1',API=(localStorage.getItem('API_BASE')||(IS_LOCAL?API_LOCAL:API_RENDER)).replace(/\/$/,'');const $=id=>document.getElementById(id);let rows=[],timer=null;function token(){const t=localStorage.getItem('admin_token')||localStorage.getItem('auth_token')||localStorage.getItem('token')||'';if(t)return t;try{return JSON.parse(localStorage.getItem('banner_admin_session')||'null')?.token||''}catch{return''}}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(m){$('toast').textContent=m;$('toast').classList.remove('hidden');clearTimeout(window.__t);window.__t=setTimeout(()=>$('toast').classList.add('hidden'),3000)}async function api(path,opt={}){const t=token(),r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{}),...(opt.headers||{})},cache:'no-store'});let d={};try{d=await r.json()}catch{}if(r.status===401){$('auth').classList.remove('hidden');$('app').style.display='none'}if(!r.ok)throw new Error(d.error||`Erro HTTP ${r.status}`);return d}function overdue(r){return r.status==='pendente'&&r.dueAt&&new Date(r.dueAt)<new Date()}function render(summary={}){$('m-count').textContent=summary.count??rows.length;$('m-pending').textContent=money(summary.totalPending||0);$('m-received').textContent=money(summary.totalReceived||0);$('m-overdue').textContent=summary.overdue||0;$('tbody').innerHTML=rows.map((r,i)=>`<tr><td><span class="code">${esc(r.code)}</span></td><td><b>${esc(r.customerName)}</b><div class="muted">${esc(r.customerCpf||r.customerPhone||'')}</div></td><td>${r.number}/${r.installments}</td><td class="${overdue(r)?'overdue':''}">${r.dueAt?new Date(r.dueAt).toLocaleDateString('pt-BR'):'—'}${overdue(r)?'<div class="muted">Vencida</div>':''}</td><td>${esc(r.method||'—')}</td><td><b>${money(r.value)}</b></td><td><span class="status ${esc(r.status)}">${esc(r.status)}</span></td><td>${r.status==='pendente'?`<button class="btn receive" data-receive="${i}">Receber</button>`:'—'}</td></tr>`).join('');$('empty').style.display=rows.length?'none':'block';$('empty').textContent=rows.length?'':'Nenhuma parcela encontrada.'}async function load(){try{const d=await api(`/erp/financeiro?status=${encodeURIComponent($('status').value)}&q=${encodeURIComponent($('search').value.trim())}`),f=d.finance||{};rows=f.receivables||[];render(f.summary||{})}catch(e){toast(e.message);$('empty').textContent=e.message}}async function receive(r){const raw=prompt(`Valor recebido da parcela ${r.number}/${r.installments}:`,Number(r.value).toFixed(2).replace('.',','));if(raw===null)return;const amount=Number(String(raw).replace(/\./g,'').replace(',','.'));if(!Number.isFinite(amount)||amount<=0)return toast('Valor inválido.');const method=prompt('Forma do recebimento:',r.method||'dinheiro');if(method===null)return;try{await api(`/erp/orders/${encodeURIComponent(r.orderId)}/receivables/${r.number}/receive`,{method:'POST',body:JSON.stringify({amount,method})});toast('Parcela recebida com sucesso.');load()}catch(e){toast(e.message)}}$('tbody').addEventListener('click',e=>{const b=e.target.closest('[data-receive]');if(b)receive(rows[Number(b.dataset.receive)])});$('status').onchange=load;$('refresh').onclick=load;$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(load,300)};if(!token()){$('auth').classList.remove('hidden');$('app').style.display='none'}else load();
</script></body></html>
