<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Início | ARIANA MÓVEIS</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="/favicon.png">

  <link rel="stylesheet" href="css/tailwind.min.css">
</head>

<body class="bg-fundo-claro font-sans text-text-dark">
    
    <div id="message-box" class="fixed top-0 left-0 right-0 z-50 p-4"></div>

    <div id="data-pending-container" class="max-w-md mx-auto w-full">
        <div class="text-center mb-6">
            <a href="index.html" class="text-3xl font-bold tracking-wider text-primary-blue">
                ARIANA MOVEIS
            </a>
        </div>
        <div class="p-6 sm:p-8 bg-white rounded-xl shadow-2xl border border-gray-100 w-full">
            <h1 class="text-2xl font-bold text-center text-primary-blue mb-6">Complete Seu Cadastro</h1>
            <p class="text-center text-sm text-gray-600 mb-6">Parabéns! Agora, preencha seus dados pessoais obrigatórios para começar a comprar.</p>

            <form id="form-pending-data" class="space-y-4">
                <div>
                    <label for="pending-cpf" class="block text-sm font-medium text-text-dark">CPF <span class="text-red-500">*</span></label>
                    <input type="text" id="pending-cpf" required inputmode="numeric" maxlength="14" autocomplete="off" class="mt-1 block w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-blue" placeholder="000.000.000-00">
                </div>
                <div>
                    <label for="pending-phone" class="block text-sm font-medium text-text-dark">Telefone de Contato <span class="text-red-500">*</span></label>
                    <input type="text" id="pending-phone" required inputmode="tel" maxlength="15" autocomplete="tel" class="mt-1 block w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-blue" placeholder="(31) 90000-0000">
                </div>
                <div>
                    <label for="pending-birthdate" class="block text-sm font-medium text-text-dark">Data de Nascimento <span class="text-red-500">*</span></label>
                    <input type="text" id="pending-birthdate" required inputmode="numeric" maxlength="10" autocomplete="bday" class="mt-1 block w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-blue" placeholder="DD/MM/AAAA">
                </div>

                <button type="submit" id="pending-data-btn" class="w-full bg-secondary-light-blue text-white py-3 px-4 rounded-lg font-semibold hover:bg-primary-blue transition-colors shadow-lg">
                    Salvar e Ir para o Dashboard
                </button>
            </form>
             <div class="mt-6 text-center text-sm">
                <button type="button" id="logout-pending-btn" class="text-error-red hover:text-dark-bg font-medium">
                    Sair e Voltar para a Loja
                </button>
            </div>
        </div>
    </div>


    

    <script>
        const API_BASE =
          window.API_BASE ||
          localStorage.getItem("API_BASE") ||
          "https://ariana-backend.onrender.com/api";

        const API_ORIGIN =
          window.API_ORIGIN ||
          String(API_BASE).replace(/\/api\/?$/i, "");

        let currentUser = null;

        window.displayMessage = (message, type, duration = 5000) => {
            const container = document.getElementById('message-box');
            let bgColor, icon;
            switch (type) {
                case 'success': bgColor = 'bg-green-100 border-green-400 text-green-700'; icon = 'fa-check-circle'; break;
                case 'error': bgColor = 'bg-red-100 border-red-400 text-red-700'; icon = 'fa-exclamation-triangle'; break;
                case 'loading': bgColor = 'bg-yellow-100 border-yellow-400 text-yellow-700'; icon = 'fa-spinner fa-spin'; break;
                default: bgColor = 'bg-blue-100 border-blue-400 text-blue-700'; icon = 'fa-info-circle'; break;
            }

            container.innerHTML = `
                <div class="p-4 rounded-lg border animate-fade-in ${bgColor} text-sm flex items-center">
                    <i class="fas ${icon} mr-3"></i>${message}
                </div>
            `;
            container.style.display = 'block';

            if (type !== 'loading') {
                setTimeout(() => {
                    container.style.display = 'none';
                    container.innerHTML = '';
                }, duration);
            }
        };

        function getUserToken() {
            return (
                localStorage.getItem('userToken') ||
                localStorage.getItem('authToken') ||
                localStorage.getItem('token') ||
                localStorage.getItem('customerToken') ||
                ''
            );
        }

        function getHeaders(extra = {}) {
            const token = getUserToken();
            return {
                'Content-Type': 'application/json',
                ...(token ? { Authorization: `Bearer ${token}` } : {}),
                ...extra
            };
        }

        async function apiFetch(path, options = {}) {
            const response = await fetch(`${API_BASE}${path}`, {
                ...options,
                headers: getHeaders(options.headers || {})
            });

            const text = await response.text();
            let data = null;

            try {
                data = text ? JSON.parse(text) : null;
            } catch (_) {
                data = text;
            }

            if (!response.ok) {
                throw new Error(
                    (data && (data.message || data.error)) ||
                    `Erro HTTP ${response.status}`
                );
            }

            return data;
        }

        function normalizeUser(payload) {
            const u = payload?.user || payload?.data || payload || null;
            if (!u) return null;
            return {
                uid: u.uid || u.id || u._id || '',
                email: u.email || '',
                cpf: u.cpf || '',
                phone: u.phone || u.telefone || '',
                birthDate: u.birthDate || u.dataNascimento || '',
            };
        }

        function isPending(value) {
            if (value === null || value === undefined) return true;
            const s = String(value).trim().toUpperCase();
            return !s || s === 'PENDING';
        }

        async function loadCurrentUser() {
            const payload = await apiFetch('/me');
            currentUser = normalizeUser(payload);
            return currentUser;
        }

        async function loadUserProfile(uid) {
            try {
                return await apiFetch(`/users/${uid}`);
            } catch (_) {
                return {};
            }
        }

        async function handleAuthChange() {
            const container = document.getElementById('data-pending-container');

            try {
                const me = await loadCurrentUser();

                if (!me || !me.uid) {
                    window.location.href = 'login_cadastro.html';
                    return;
                }

                const profile = await loadUserProfile(me.uid);
                const merged = {
                    ...profile,
                    uid: me.uid,
                    email: me.email || profile.email || '',
                    cpf: me.cpf || profile.cpf || '',
                    phone: me.phone || profile.phone || profile.telefone || '',
                    birthDate: me.birthDate || profile.birthDate || profile.dataNascimento || ''
                };

                currentUser = merged;

                const isDataComplete =
                    !isPending(merged.cpf) &&
                    !isPending(merged.phone) &&
                    !isPending(merged.birthDate);

                if (isDataComplete) {
                    window.location.href = 'minha_conta.html';
                } else {
                    container.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Erro ao validar usuário:', error);
                window.location.href = 'login_cadastro.html';
            }
        }

        async function handlePendingDataSubmit(e) {
            e.preventDefault();

            if (!currentUser || !currentUser.uid) {
                window.displayMessage('Usuário não autenticado. Tente fazer login novamente.', 'error');
                return;
            }

            const newCpf = maskCpfValue(document.getElementById('pending-cpf').value.trim());
            const newPhone = maskPhoneValue(document.getElementById('pending-phone').value.trim());
            const newBirthdate = maskBirthDateValue(document.getElementById('pending-birthdate').value.trim());

            if (!newCpf || !newPhone || !newBirthdate) {
                window.displayMessage('Todos os campos (CPF, Telefone e Data de Nascimento) são obrigatórios.', 'error');
                return;
            }

            if (digitsOnly(newCpf).length !== 11) {
                window.displayMessage('Informe um CPF válido.', 'error');
                return;
            }

            if (digitsOnly(newPhone).length < 10) {
                window.displayMessage('Informe um telefone válido.', 'error');
                return;
            }

            if (!isValidBirthDateBR(newBirthdate)) {
                window.displayMessage('Informe a data de nascimento no formato DD/MM/AAAA.', 'error');
                return;
            }

            window.displayMessage('Salvando dados pessoais e finalizando cadastro...', 'loading');

            try {
                const dataToSave = {
                    cpf: newCpf,
                    phone: newPhone,
                    birthDate: newBirthdate
                };

                await apiFetch(`/users/${currentUser.uid}`, {
                    method: 'PUT',
                    body: JSON.stringify(dataToSave)
                });

                window.displayMessage('Cadastro concluído! Redirecionando para o Dashboard.', 'success');
                setTimeout(() => {
                    window.location.href = 'minha_conta.html?cadastro=completo';
                }, 1000);
            } catch (error) {
                console.error('Erro ao salvar dados pendentes:', error);
                window.displayMessage('Erro ao finalizar o cadastro: ' + error.message, 'error');
            }
        }


        function digitsOnly(value) {
            return String(value || '').replace(/\D+/g, '');
        }

        function maskCpfValue(value) {
            const d = digitsOnly(value).slice(0, 11);
            return d
                .replace(/^(\d{3})(\d)/, '$1.$2')
                .replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3')
                .replace(/\.(\d{3})(\d)/, '.$1-$2');
        }

        function maskPhoneValue(value) {
            const d = digitsOnly(value).slice(0, 11);
            if (d.length <= 10) {
                return d
                    .replace(/^(\d{2})(\d)/, '($1) $2')
                    .replace(/(\d{4})(\d)/, '$1-$2');
            }
            return d
                .replace(/^(\d{2})(\d)/, '($1) $2')
                .replace(/(\d{5})(\d)/, '$1-$2');
        }

        function maskBirthDateValue(value) {
            const d = digitsOnly(value).slice(0, 8);
            return d
                .replace(/^(\d{2})(\d)/, '$1/$2')
                .replace(/^(\d{2})\/(\d{2})(\d)/, '$1/$2/$3');
        }

        function isValidBirthDateBR(value) {
            const match = String(value || '').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
            if (!match) return false;
            const day = Number(match[1]);
            const month = Number(match[2]);
            const year = Number(match[3]);
            const currentYear = new Date().getFullYear();
            const dt = new Date(year, month - 1, day);
            return (
                dt.getFullYear() === year &&
                dt.getMonth() === month - 1 &&
                dt.getDate() === day &&
                year >= 1900 &&
                year <= currentYear
            );
        }

        function bindInputMasks() {
            const cpf = document.getElementById('pending-cpf');
            const phone = document.getElementById('pending-phone');
            const birth = document.getElementById('pending-birthdate');

            if (cpf) {
                cpf.setAttribute('type', 'text');
                cpf.setAttribute('inputmode', 'numeric');
                cpf.setAttribute('maxlength', '14');
                cpf.addEventListener('input', (e) => {
                    e.target.value = maskCpfValue(e.target.value);
                });
            }

            if (phone) {
                phone.setAttribute('type', 'text');
                phone.setAttribute('inputmode', 'tel');
                phone.setAttribute('maxlength', '15');
                phone.addEventListener('input', (e) => {
                    e.target.value = maskPhoneValue(e.target.value);
                });
            }

            if (birth) {
                // Mantém como texto para NÃO abrir calendário no celular.
                birth.setAttribute('type', 'text');
                birth.setAttribute('inputmode', 'numeric');
                birth.setAttribute('maxlength', '10');
                birth.setAttribute('placeholder', 'DD/MM/AAAA');
                birth.addEventListener('input', (e) => {
                    e.target.value = maskBirthDateValue(e.target.value);
                });
                birth.addEventListener('blur', (e) => {
                    e.target.value = maskBirthDateValue(e.target.value);
                });
            }
        }

        function handleLogout() {
            try {
                window.displayMessage('Saindo...', 'loading');
                localStorage.removeItem('userToken');
                localStorage.removeItem('authToken');
                localStorage.removeItem('token');
                localStorage.removeItem('customerToken');
                setTimeout(() => {
                    window.location.href = 'login_cadastro.html?logout=success';
                }, 300);
            } catch (error) {
                console.error('Erro ao fazer logout:', error);
                window.displayMessage('Erro ao fazer logout. Tente novamente.', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            bindInputMasks();
            handleAuthChange();
            document.getElementById('form-pending-data').addEventListener('submit', handlePendingDataSubmit);
            document.getElementById('logout-pending-btn').addEventListener('click', handleLogout);
        });
    </script>

    <script src="js/api-config.js"></script>

    <script src="marketplace-core.js"></script>
    <script src="marketplace-core_global_payments.js"></script>

     <script src="js/layout-fit.js" defer></script>

    <script src="js/header_auth_fix.js" defer></script>

</body>
</html>
