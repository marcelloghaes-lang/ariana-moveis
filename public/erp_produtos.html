<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos e Estoque | Ariana ERP</title><style>:root{--b:#0646a5;--bg:#f4f6f9;--line:#dce3ec;--text:#172033;--muted:#69758a;--green:#087a52;--amber:#b97000;--red:#c83f49}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Inter,Segoe UI,Arial,sans-serif;color:var(--text)}header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}header h1{font-size:18px;margin:0}header a{color:var(--b);font-weight:800;text-decoration:none}.wrap{max-width:1300px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.bar{display:flex;gap:8px;margin-bottom:13px}.bar input{flex:1;border:1px solid #cfd8e5;border-radius:10px;padding:11px 12px;font:inherit}.bar button{border:0;background:var(--b);color:white;border-radius:9px;padding:10px 14px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.stat small{color:var(--muted)}.stat b{display:block;font-size:22px;margin-top:4px}table{width:100%;border-collapse:collapse}th{font-size:10px;text-transform:uppercase;color:#788397;text-align:left;padding:9px;border-bottom:1px solid var(--line)}td{padding:10px 9px;border-bottom:1px solid #edf0f5}.stock{font-weight:900}.ok{color:var(--green)}.low{color:var(--amber)}.zero{color:var(--red)}.muted{color:var(--muted);font-size:12px}.empty{text-align:center;padding:30px;color:var(--muted)}@media(max-width:760px){.wrap{padding:10px}.stats{grid-template-columns:repeat(2,1fr)}.hide-m{display:none}.bar{flex-direction:column}}</style></head><body><header><div><h1>Produtos e Estoque</h1><small>Catálogo operacional do Ariana ERP</small></div><a href="erp_ariana.html">← Central ERP</a></header><main class="wrap"><div class="stats"><div class="stat"><small>Produtos exibidos</small><b id="s-total">—</b></div><div class="stat"><small>Com estoque</small><b id="s-stock">—</b></div><div class="stat"><small>Estoque baixo</small><b id="s-low">—</b></div><div class="stat"><small>Sem estoque</small><b id="s-zero">—</b></div></div><section class="card"><div class="bar"><input id="q" placeholder="Buscar por nome, SKU, marca ou categoria" autofocus><button id="search">Buscar</button></div><div style="overflow:auto"><table><thead><tr><th>Produto</th><th>SKU</th><th class="hide-m">Marca/Categoria</th><th>Preço</th><th>Estoque</th></tr></thead><tbody id="body"></tbody></table></div></section></main><script>const API=(location.hostname==='localhost'?'http://localhost:3000/api':'https://ariana-backend.onrender.com/api');const $=id=>document.getElementById(id);function token(){const t=localStorage.getItem('admin_token')||localStorage.getItem('auth_token')||localStorage.getItem('token')||'';if(t)return t;try{return JSON.parse(localStorage.getItem('banner_admin_session')||'null')?.token||''}catch{return''}}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}async function load(){const q=$('q').value.trim();$('body').innerHTML='<tr><td colspan="5" class="empty">Carregando…</td></tr>';try{const r=await fetch(API+'/erp/products?q='+encodeURIComponent(q)+'&limit=200',{headers:{Authorization:'Bearer '+token()},cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Erro ao carregar produtos.');const p=d.products||[];$('s-total').textContent=p.length;$('s-stock').textContent=p.filter(x=>Number(x.stock)>0).length;$('s-low').textContent=p.filter(x=>Number(x.stock)>0&&Number(x.stock)<=5).length;$('s-zero').textContent=p.filter(x=>Number(x.stock)<=0).length;$('body').innerHTML=p.length?p.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.sku||'—')}</td><td class="hide-m">${esc([x.brand,x.category].filter(Boolean).join(' • ')||'—')}</td><td>${money(x.price)}</td><td class="stock ${Number(x.stock)<=0?'zero':Number(x.stock)<=5?'low':'ok'}">${Number(x.stock||0)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Nenhum produto encontrado.</td></tr>'}catch(e){$('body').innerHTML=`<tr><td colspan="5" class="empty">${esc(e.message)}</td></tr>`}}$('search').onclick=load;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')load()});load();</script></body></html>
