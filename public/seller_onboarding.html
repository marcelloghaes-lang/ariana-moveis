<style id="ariana-seller-professional-ui">

  --am-blue:#0047AB!important;

body{letter-spacing:-.01em;}
/* Fundos antigos */

/* Sidebar Seller/Admin */
aside#sidebar, aside.sidebar, .side, .sidebar, .bg-dark-bg, .bg-dark-gray-bg{
  background:linear-gradient(180deg,#0047AB 0%,#052b63 54%,#061f45 100%)!important;
  box-shadow:14px 0 36px rgba(15,23,42,.12)!important;
}
aside#sidebar, .side, .sidebar{border-right:1px solid rgba(255,255,255,.08)!important;}
aside#sidebar .px-4:first-child span, aside#sidebar .px-4:first-child, .side h1, .sidebar .brand, .sidebar h1{
  color:#fff!important;letter-spacing:.01em!important;
}
aside#sidebar .px-4:first-child, .side h1{

aside#sidebar nav a, .nav button, .sidebar-link, aside nav a{
  display:flex!important;align-items:center!important;gap:12px!important;border-radius:16px!important;padding:12px 14px!important;color:rgba(255,255,255,.86)!important;font-weight:850!important;text-decoration:none!important;transition:.16s ease!important;background:transparent!important;box-shadow:none!important;

}
#btn-sair, a[id*="sair"], a[href="#"][id*="logout"], #logout-btn{color:#fecaca!important;margin-top:18px!important;}
/* Área principal */
main, .main, .flex-1, .flex-grow{min-width:0!important;}
.main, main.flex-grow, .flex-1.flex.flex-col, body>div.flex-1{background:linear-gradient(180deg,#eef5ff 0,#f7f9fc 330px,#f3f6fb 100%)!important;}
header, .topbar, .top, .bg-white.border-b{
  background:rgba(255,255,255,.92)!important;backdrop-filter:blur(14px)!important;border-color:rgba(226,232,240,.9)!important;
}
h1,h2,h3{color:var(--am-text)!important;line-height:1.12!important;}
p,.help,.sub,.muted,.text-gray-600,.text-slate-500{color:var(--am-muted)!important;}
/* Cards e painéis */
.card,.box,.stat,.quick-card,.rounded-2xl.bg-white,.bg-white.rounded-2xl,.seller-form-card,section.bg-white,.shadow-soft,.receipt,.empty,[class*="shadow"]{

}
.card{padding:20px!important;}
.stat{padding:18px!important;}
.stat small,.label,label,.text-xs.uppercase{font-size:11px!important;font-weight:950!important;text-transform:uppercase!important;letter-spacing:.055em!important;color:var(--am-muted)!important;}

/* Botões */

button.bg-primary-blue,button.bg-blue-600,button.bg-green-600,button.bg-red-600{

/* Badges */
.pill,.badge,.status-novo,.status-respondido,[class*="status-"]{border-radius:999px!important;padding:6px 10px!important;font-size:11px!important;font-weight:950!important;}
/* Grids comuns */
.stats{gap:14px!important}.filters{gap:12px!important}.quick-grid{gap:14px!important}.form-grid{gap:12px!important}.action-bar{gap:10px!important;}
/* Responsivo */
@media(max-width:920px){

  .stats{grid-template-columns:1fr 1fr!important;}
  .filters,.layout,.form-grid,.action-bar,.quick-grid{grid-template-columns:1fr!important;}
  .card,.box{border-radius:20px!important;padding:16px!important;}
  button,.primary,.light,.green,.red,.yellow,.gray{width:100%!important;}
}
@media(max-width:560px){.stats{grid-template-columns:1fr!important;} aside#sidebar nav,.nav{grid-template-columns:1fr!important;}}

<body class="flex items-center justify-center min-h-screen p-4">

  <div id="toast-container"></div>

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8 border border-gray-100">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Recuperar Senha</h1>
      <p class="text-slate-500 mt-2 text-sm font-medium">Digite seu e-mail para receber as instruções de acesso ao painel seller.</p>
    </div>

    <form id="recovery-form" class="space-y-5">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">E-mail Cadastrado</label>
        <input type="email" id="email" class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none focus:border-[#2E6DA4] transition-all font-medium" placeholder="seu@email.com" required autocomplete="email">
      </div>

      <button type="submit" id="btn-submit" class="w-full py-4 rounded-xl font-bold btn-primary shadow-lg shadow-blue-900/20 flex items-center justify-center gap-2">
        <i class="fas fa-paper-plane"></i> Enviar Instruções
      </button>

      <div class="text-center mt-6">
        <a href="seller_login.html" class="text-sm font-bold text-[#2E6DA4] hover:underline flex items-center justify-center gap-2">
          <i class="fas fa-arrow-left text-xs"></i> Voltar para o Login
        </a>
      </div>
    </form>
  </div>

  <script>
    const IS_LOCAL_HOST =
      window.location.hostname === "127.0.0.1" ||
      window.location.hostname === "localhost";

    const API_BASE = IS_LOCAL_HOST
      ? "http://localhost:3000/api"
      : "https://ariana-backend.onrender.com/api";

    const $ = (id) => document.getElementById(id);

    function toast(message, type = 'info') {
      const container = $('toast-container');
      const el = document.createElement('div');
      const bgColor = type === 'success' ? 'bg-green-600' : 'bg-red-600';
      el.className = `${bgColor} text-white px-6 py-3 rounded-xl shadow-lg font-bold text-sm animate-bounce-short`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      }, 4000);
    }

    $('recovery-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('btn-submit');
      const email = $('email').value.trim().toLowerCase();

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Enviando...';

      try {
        const res = await fetch(`${API_BASE}/seller/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.message || 'Erro ao processar e-mail');

        toast('Se o e-mail existir, você receberá um link em breve!', 'success');
        $('recovery-form').reset();
        
      } catch (err) {
        console.error('Erro:', err);
        toast(err.message || 'Erro ao conectar com o servidor Ariana Móveis', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar Instruções';
      }
    });
  </script>


<script id="ariana-seller-professional-ui-js">
(function(){
  try{
    var page=(location.pathname.split('/').pop()||'').toLowerCase();
    document.querySelectorAll('aside a, .side .nav button').forEach(function(el){
      var href=(el.getAttribute('href')||'').toLowerCase();
      if(href && href.indexOf(page)>=0){el.classList.add('active');}
    });
    document.querySelectorAll('aside#sidebar .px-4:first-child span').forEach(function(el){
      if(/ariana/i.test(el.textContent||'')) el.textContent='ARIANA MÓVEIS';
    });
  }catch(e){}
})();
</script>

</body>
