<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Início | ARIANA MÓVEIS</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="css/tailwind.min.css">

  <script src="js/api-config.js"></script>
</head>

<body class="bg-fundo-claro font-sans text-text-dark">

<div id="header-container"></div>

<main class="max-w-7xl mx-auto px-4 py-10 min-h-[60vh]">
<div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
<div>
<h1 class="text-3xl font-black text-gray-900 tracking-tight">Meus Favoritos</h1>
<p id="fav-count" class="text-primary-blue font-bold">0 itens salvos</p>
</div>

<a href="index.html" class="flex items-center justify-center gap-2 bg-white border-2 border-primary-blue text-primary-blue px-6 py-2.5 rounded-xl font-bold hover:bg-primary-blue hover:text-white transition-all duration-300 shadow-sm">
Voltar para a Loja
</a>
</div>

<div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 bg-white rounded-3xl border-2 border-dashed border-gray-200">
<h2 class="text-2xl font-bold text-gray-800 mb-2">Sua lista está vazia</h2>
<p class="text-gray-500 mb-8">Nenhum produto foi favoritado ainda.</p>
<a href="index.html" class="bg-primary-blue text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200">
Ver ofertas hoje
</a>
</div>

<div id="favorites-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
</main>

<div id="footer-container"></div>

<script>
const API_BASE =
  window.API_BASE ||
  localStorage.getItem("API_BASE") ||
  "https://ariana-backend.onrender.com/api";

const API_ORIGIN =
  window.API_ORIGIN ||
  String(API_BASE).replace(/\/api\/?$/i, "");

window.syncHeroBannerLayout = window.syncHeroBannerLayout || function(){};
window.initMiniBannersCarousel = window.initMiniBannersCarousel || function(){};
window.resolveApiImageUrl = window.resolveApiImageUrl || function(value){
  const raw = String(value || '').trim();
  if (!raw || raw.includes('${')) return '';
  if (/^https?:\/\//i.test(raw) || /^data:/i.test(raw) || /^blob:/i.test(raw)) return raw;
  if (raw.startsWith('/')) return API_ORIGIN + raw;
  return API_ORIGIN + '/' + raw.replace(/^\.?\//, '');
};

const favoritesListEl = document.getElementById('favorites-list');
const emptyStateEl = document.getElementById('empty-state');
const favCountEl = document.getElementById('fav-count');

const formatBRL = (val) =>
new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);

function getFavorites(){
return JSON.parse(localStorage.getItem("favorites") || "[]");
}

function saveFavorites(list){
localStorage.setItem("favorites", JSON.stringify(list));
}

window.removeFavorite = function(id){
let favs = getFavorites();
favs = favs.filter(f => String(f) !== String(id));
saveFavorites(favs);
loadFavorites();
};

function getProductImage(product) {
  return (
    window.resolveApiImageUrl(product?.imageUrl) ||
    window.resolveApiImageUrl(product?.mainImageUrl) ||
    window.resolveApiImageUrl(product?.thumbnail) ||
    window.resolveApiImageUrl(product?.coverImage) ||
    window.resolveApiImageUrl(product?.imagem) ||
    window.resolveApiImageUrl(product?.foto) ||
    window.resolveApiImageUrl(product?.image) ||
    window.resolveApiImageUrl(product?.images?.[0]?.url) ||
    window.resolveApiImageUrl(product?.images?.[0]?.path) ||
    window.resolveApiImageUrl(product?.images?.[0]) ||
    window.resolveApiImageUrl(product?.imageUrls?.[0]) ||
    ""
  );
}

function renderFavorites(products){

favoritesListEl.innerHTML = "";
favCountEl.textContent = `${products.length} itens salvos`;

if(!products.length){
emptyStateEl.classList.remove("hidden");
return;
}

emptyStateEl.classList.add("hidden");

products.forEach(product => {
  const imageUrl = getProductImage(product);
  const productId = product?._id || product?.id || "";
  const productName = product?.name || product?.nome || "Produto sem nome";
  const productPrice = Number(product?.price ?? product?.preco ?? 0);

favoritesListEl.innerHTML += `
<div class="bg-white rounded-2xl shadow-sm border overflow-hidden flex flex-col">

<div class="h-56 p-4">
<img src="${imageUrl}" alt="${productName}" class="w-full h-full object-contain" onerror="this.onerror=null;this.src='https://via.placeholder.com/400x400?text=Sem+Imagem';">
</div>

<div class="p-5 text-center flex flex-col flex-grow">
<h3 class="font-bold mb-2 text-sm">${productName}</h3>
<p class="text-xl font-black text-primary-blue mb-5">${formatBRL(productPrice)}</p>

<div class="mt-auto space-y-2">
<a href="produto.html?id=${productId}" class="block bg-primary-blue text-white py-2 rounded-xl font-bold text-sm">
Ver Detalhes
</a>

<button onclick="removeFavorite('${productId}')" class="text-red-500 text-xs">
Remover
</button>
</div>

</div>
</div>
`;
});
}

async function loadFavorites(){

const ids = getFavorites().map(String);

if(!ids.length){
renderFavorites([]);
return;
}

try{
const res = await fetch(`${API_BASE}/products`);
if (!res.ok) throw new Error(`HTTP ${res.status}`);
const all = await res.json();

const products = Array.isArray(all)
  ? all
  : Array.isArray(all?.products)
    ? all.products
    : [];

const filtered = products.filter(p => ids.includes(String(p?._id || p?.id)));

renderFavorites(filtered);

}catch(e){
console.error('Erro ao carregar favoritos:', e);
renderFavorites([]);
}
}

document.addEventListener("DOMContentLoaded", loadFavorites);
</script>
<script src="./header.js"></script>
<script>
  window.carregarHeader();
</script>

<script src="footer.js"></script>
<script src="js/layout-fit.js" defer></script>

</body>
</html>
