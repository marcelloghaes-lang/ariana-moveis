<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Editar Produto | ARIANA MÓVEIS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const API_BASE =
  (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost')
    ? 'http://localhost:3000/api'
    : 'https://ariana-backend.onrender.com/api';
window.API_BASE = API_BASE;
try {
  localStorage.setItem('API_BASE', API_BASE);
  localStorage.setItem('API_BASE_URL', API_BASE);
} catch(_e) {}

    const $ = (id) => document.getElementById(id);
    function getSellerToken() {
      return localStorage.getItem('seller_token') || '';
    }
    function getSellerProfile() {
      try { return JSON.parse(localStorage.getItem('seller_profile') || '{}') || {}; } catch (_) { return {}; }
    }
    function clearSellerSession() {
      localStorage.removeItem('seller_token');
      localStorage.removeItem('seller_profile');
      localStorage.removeItem('seller_status');
      localStorage.removeItem('seller_active');
      localStorage.removeItem('partner_request_id');
    }
    function authHeaders(extra = {}) {
      const token = getSellerToken();
      return token ? { ...extra, Authorization: `Bearer ${token}` } : { ...extra };
    }
    function ensureSellerSession() {
      const token = getSellerToken();
      if (!token) {
        window.location.href = 'seller_login.html';
        return false;
      }
      return true;
    }
    const productId = new URLSearchParams(window.location.search).get('id');
    let currentProduct = null;

    function showToast(message, type = 'info') {
      const box = $('toast-container');
      if (!box) return alert(message);
      const el = document.createElement('div');
      el.className = `toast px-4 py-3 rounded-xl text-white font-bold ${type === 'error' ? 'bg-error-red' : type === 'success' ? 'bg-success-green' : 'bg-primary-blue'}`;
      el.textContent = message;
      box.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 250);
      }, 3000);
    }

    function resolveImageUrl(product) {
      const candidates = [product?.imageUrl, product?.mainImageUrl, product?.image, product?.imagem];
      if (Array.isArray(product?.images)) {
        for (const item of product.images) {
          if (typeof item === 'string' && item.trim()) candidates.push(item.trim());
          if (item?.url) candidates.push(item.url);
        }
      }
      for (const item of candidates) {
        const value = String(item || '').trim();
        if (value && !value.includes('${')) return value;
      }
      return '';
    }

    async function loadProduct() {
      if (!ensureSellerSession()) return;
      if (!productId) return;
      try {
        const meRes = await fetch(`${API_BASE}/seller/auth/me`, { headers: authHeaders() });
        if (meRes.status === 401 || meRes.status === 403) {
          clearSellerSession();
          window.location.href = 'seller_login.html';
          return;
        }

        const res = await fetch(`${API_BASE}/seller/products/${productId}`, { headers: authHeaders() });
        if (res.status === 401 || res.status === 403) {
          clearSellerSession();
          window.location.href = 'seller_login.html';
          return;
        }
        if (!res.ok) throw new Error('Produto não encontrado.');
        const p = await res.json();
        currentProduct = p || {};

        $('productIdPill').textContent = p._id || p.id;
        $('productIdPill').classList.remove('hidden');
        $('name').value = p.name || p.nome || '';
        $('sku').value = p.sku || '';
        $('price').value = p.price || p.preco || 0;
        $('stock').value = p.stock || p.estoque || 0;
        $('category').value = p.category || p.categoria || p.categoryName || '';
        $('imageUrl').value = resolveImageUrl(p);
        $('description').value = p.description || p.descricao || '';
        $('pesoKg').value = p.pesoKg || p.weight || '';
        $('comprimento').value = p.comprimento || p.length || '';
        $('largura').value = p.largura || p.width || '';
        $('altura').value = p.altura || p.height || '';
        $('active').checked = p.active !== false;
      } catch (e) {
        console.error(e);
        showToast(e.message || 'Falha ao carregar produto.', 'error');
      }
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('btn-save');
      btn.disabled = true;
      btn.textContent = 'Salvando...';

      const imageUrl = $('imageUrl').value.trim();
      const payload = {
        name: $('name').value.trim(),
        nome: $('name').value.trim(),
        sku: $('sku').value.trim(),
        price: Number($('price').value || 0),
        preco: Number($('price').value || 0),
        stock: Number($('stock').value || 0),
        category: $('category').value.trim() || currentProduct?.category || currentProduct?.categoria || '',
        categoria: $('category').value.trim() || currentProduct?.category || currentProduct?.categoria || '',
        description: $('description').value.trim(),
        descricao: $('description').value.trim(),
        imageUrl: imageUrl || resolveImageUrl(currentProduct),
        mainImageUrl: imageUrl || resolveImageUrl(currentProduct),
        image: imageUrl || resolveImageUrl(currentProduct),
        pesoKg: Number($('pesoKg').value || 0),
        comprimento: Number($('comprimento').value || 0),
        largura: Number($('largura').value || 0),
        altura: Number($('altura').value || 0),
        active: $('active').checked,
      };

      if (Array.isArray(currentProduct?.images) && currentProduct.images.length) {
        payload.images = currentProduct.images;
      } else if (payload.imageUrl) {
        payload.images = [{ name: 'principal', url: payload.imageUrl, isMain: true }];
      }

      try {
        if (!ensureSellerSession()) return;
        const res = await fetch(`${API_BASE}/seller/products/${productId}`, {
          method: 'PUT',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify(payload)
        });
        const result = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(result.error || result.message || 'Erro ao salvar produto.');
        showToast('Produto atualizado com sucesso!', 'success');
        window.location.href = 'seller_produtos.html';
      } catch (e) {
        console.error(e);
        showToast(e.message || 'Erro ao salvar.', 'error');
        btn.disabled = false;
        btn.textContent = 'Salvar alterações';
      }
    });

    window.onload = loadProduct;
    $('sidebar-toggle')?.addEventListener('click', () => $('sidebar').classList.toggle('-translate-x-full'));
    $('btn-sair')?.addEventListener('click', (e) => { e.preventDefault(); clearSellerSession(); window.location.href = 'seller_login.html'; });
  </script>
  <script src="js/product-card.js" defer></script>
</body>
</html>
