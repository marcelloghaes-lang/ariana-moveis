<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pagamento | ARIANA MOVEIS</title>

  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/api-config.js"></script>
  <script src="https://sdk.mercadopago.com/js/v2"></script>

  <style>
    .mp-input{
      width:100%;
      border:1px solid #e5e7eb;
      border-radius:0.75rem;
      padding:0.85rem 0.95rem;
      outline:none;
      background:#fff;
    }
    .mp-input:focus{ box-shadow:0 0 0 3px rgba(59,130,246,.15); border-color:#60a5fa; }
    .btn-primary{
      background:#0ea5e9;
      color:#fff;
      font-weight:800;
      border-radius:1rem;
      padding:0.95rem 1.1rem;
      width:100%;
    }
    .btn-primary:hover{ filter:brightness(.97); }
    .btn-primary:disabled{ opacity:.55; cursor:not-allowed; }

    .btn-choice{
      background:#fff;
      border:2px solid #e5e7eb;
      border-radius:1rem;
      padding:1.25rem;
      width:100%;
      text-align:left;
      transition:all .2s;
      display:flex;
      align-items:center;
      gap:1rem;
    }
    .btn-choice:hover{ border-color:#0ea5e9; background:#f0f9ff; }
    .btn-choice.active{ border-color:#0ea5e9; background:#f0f9ff; box-shadow:0 0 0 3px rgba(14,165,233,.1); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans leading-relaxed">

  <div class="max-w-2xl mx-auto px-4 py-8">
    <div class="mb-8 flex items-center justify-between">
      <h1 class="text-2xl font-black tracking-tight">Pagamento</h1>
      <div id="order-id-display" class="text-xs font-mono text-slate-400"></div>
    </div>

    <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm font-medium border"></div>

    <div id="section-choice" class="space-y-4">
      <p class="text-slate-500 mb-4 font-medium">Como deseja pagar?</p>

      <button class="btn-choice group" data-method="pix" type="button">
        <div class="w-12 h-12 rounded-full bg-teal-50 flex items-center justify-center text-teal-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
        </div>
        <div class="flex-1">
          <div class="font-bold">Pix</div>
          <div class="text-xs text-slate-500">Aprovação instantânea</div>
        </div>
        <div class="radio-indicator w-5 h-5 border-2 rounded-full border-slate-300"></div>
      </button>

      <button class="btn-choice" data-method="card" type="button">
        <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
        </div>
        <div class="flex-1">
          <div class="font-bold">Cartão de Crédito</div>
          <div class="text-xs text-slate-500">Parcele em até 12x</div>
        </div>
        <div class="radio-indicator w-5 h-5 border-2 rounded-full border-slate-300"></div>
      </button>

      <button class="btn-choice" data-method="boleto" type="button">
        <div class="w-12 h-12 rounded-full bg-amber-50 flex items-center justify-center text-amber-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
        </div>
        <div class="flex-1">
          <div class="font-bold">Boleto Bancário</div>
          <div class="text-xs text-slate-500">Vencimento em 3 dias úteis</div>
        </div>
        <div class="radio-indicator w-5 h-5 border-2 rounded-full border-slate-300"></div>
      </button>

      <div class="pt-6">
        <button id="btn-continue" disabled class="btn-primary opacity-50 flex items-center justify-center gap-2" type="button">
          Continuar
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>

    <div id="panel-card" class="hidden space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
      <button onclick="showChoice()" class="text-sm font-bold text-slate-400 hover:text-slate-600 flex items-center gap-1 mb-4" type="button">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg> Voltar
      </button>

      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
        <form id="form-checkout" class="space-y-4">
          <div class="grid grid-cols-1 gap-4">
            <div>
              <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Número do Cartão</label>
              <div id="form-checkout__cardNumber" class="mp-input h-12"></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Vencimento</label>
                <div id="form-checkout__expirationDate" class="mp-input h-12"></div>
              </div>
              <div>
                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">CVV</label>
                <div id="form-checkout__securityCode" class="mp-input h-12"></div>
              </div>
            </div>
            <div>
              <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Nome do Titular</label>
              <input type="text" id="form-checkout__cardholderName" class="mp-input h-12" autocomplete="cc-name" />
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">CPF do Titular</label>
                <input type="text" id="customerCpf" maxlength="14" placeholder="000.000.000-00" class="mp-input h-12" autocomplete="off" inputmode="numeric" />
              </div>
              <div>
                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Data de Nascimento</label>
                <input type="text" id="customerBirthDate" maxlength="10" placeholder="DD/MM/AAAA" class="mp-input h-12" autocomplete="bday" inputmode="numeric" />
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Telefone</label>
                <input type="tel" id="customerPhone" maxlength="15" placeholder="(00) 00000-0000" class="mp-input h-12" autocomplete="tel" inputmode="tel" />
              </div>
              <div>
                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">E-mail</label>
                <input type="email" id="customerEmail" placeholder="cliente@email.com" class="mp-input h-12" autocomplete="email" />
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Banco Emissor</label>
                <select id="form-checkout__issuer" class="mp-input h-12"></select>
              </div>
              <div>
                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Parcelas</label>
                <select id="form-checkout__installments" class="mp-input h-12"></select>
              </div>
            </div>
            <select id="form-checkout__identificationType" class="hidden"></select>
            <input type="text" id="form-checkout__identificationNumber" class="hidden" />
            <input type="email" id="form-checkout__cardholderEmail" class="hidden" />
          </div>
          <button type="submit" id="form-checkout__submit" class="btn-primary mt-6">Confirmar Pagamento</button>
        </form>
      </div>
    </div>

    <div id="panel-pix" class="hidden space-y-6">
      <button onclick="showChoice()" class="text-sm font-bold text-slate-400 hover:text-slate-600 flex items-center gap-1 mb-4" type="button">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg> Voltar
      </button>

      <div class="bg-white rounded-2xl p-8 shadow-sm border border-slate-100 text-center space-y-6">
        <div id="pix-loading" class="flex flex-col items-center py-8">
          <div class="w-12 h-12 border-4 border-teal-500 border-t-transparent rounded-full animate-spin"></div>
          <p class="mt-4 text-slate-500 animate-pulse">Gerando seu QR Code Pix...</p>
        </div>

        <div id="pix-content" class="hidden space-y-6">
          <div class="bg-teal-50 rounded-2xl p-4 inline-block mx-auto border border-teal-100">
            <img id="pix-qr-img" class="w-48 h-48 mx-auto" src="" alt="QR Code Pix" />
          </div>
          <div class="space-y-2 text-left">
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider ml-1">Código Pix (Copia e Cola)</label>
            <div class="flex gap-2">
              <input type="text" id="pix-code-input" readonly class="mp-input bg-slate-50 text-xs font-mono" />
              <button id="btn-copy-pix" class="bg-slate-900 text-white px-4 rounded-xl hover:bg-slate-800 transition-colors" type="button">Copiar</button>
            </div>
          </div>
          <p class="text-xs text-slate-400 italic">O status do seu pedido será atualizado automaticamente após o pagamento.</p>
        </div>
      </div>
    </div>

    <div id="panel-boleto" class="hidden space-y-6">
      <button onclick="showChoice()" class="text-sm font-bold text-slate-400 hover:text-slate-600 flex items-center gap-1 mb-4" type="button">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg> Voltar
      </button>
      <div class="bg-white rounded-2xl p-8 shadow-sm border border-slate-100 text-center space-y-6">
        <div class="w-20 h-20 bg-amber-50 rounded-full flex items-center justify-center mx-auto text-amber-600">
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        </div>
        <h3 class="text-lg font-bold">Boleto Bancário</h3>
        <p class="text-slate-500 text-sm">Ao clicar no botão abaixo, geraremos o boleto para o seu pedido. A compensação leva de 1 a 3 dias úteis.</p>
        <button id="btn-generate-boleto" class="btn-primary" type="button">Gerar Boleto Agora</button>
      </div>
    </div>

    <div id="order-summary" class="mt-8 pt-8 border-t border-slate-200 hidden">
      <div class="flex items-center justify-between text-slate-500 mb-2">
        <span class="text-sm">Total do Pedido</span>
        <span id="summary-total" class="text-xl font-black text-slate-900">R$ 0,00</span>
      </div>
    </div>
  </div>

  <script>
    const API_BASE =
      window.API_BASE ||
      localStorage.getItem("API_BASE") ||
      "https://ariana-backend.onrender.com/api";

    const API_ORIGIN =
      window.API_ORIGIN ||
      String(API_BASE).replace(/\/api\/?$/i, "");

    window.API_BASE = API_BASE;
    window.API_ORIGIN = API_ORIGIN;

    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('orderId');

    let currentUser = null;
    let customerProfile = null;
    let orderData = null;
    let mp = null;
    let cardForm = null;
    let pollTimer = null;
    let selectedMethod = "";

    function digitsOnly(v) {
      return String(v || "").replace(/\D+/g, "");
    }

    function getInputValue(id) {
      const el = document.getElementById(id);
      return el ? String(el.value || "").trim() : "";
    }

    function maskCpfValue(value) {
      const d = digitsOnly(value).slice(0, 11);
      return d
        .replace(/^(\d{3})(\d)/, "$1.$2")
        .replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3")
        .replace(/\.(\d{3})(\d)/, ".$1-$2");
    }

    function maskPhoneValue(value) {
      const d = digitsOnly(value).slice(0, 11);
      if (d.length <= 10) {
        return d
          .replace(/^(\d{2})(\d)/, "($1) $2")
          .replace(/(\d{4})(\d)/, "$1-$2");
      }
      return d
        .replace(/^(\d{2})(\d)/, "($1) $2")
        .replace(/(\d{5})(\d)/, "$1-$2");
    }

    function maskBirthDateValue(value) {
      const d = digitsOnly(value).slice(0, 8);
      return d
        .replace(/^(\d{2})(\d)/, "$1/$2")
        .replace(/^(\d{2})\/(\d{2})(\d)/, "$1/$2/$3");
    }

    function formatBirthDateForInput(value) {
      const raw = String(value || "").trim();
      const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (iso) return `${iso[3]}/${iso[2]}/${iso[1]}`;
      return maskBirthDateValue(raw);
    }

    function normalizeBirthDateForApi(value) {
      const raw = String(value || "").trim();
      const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (iso) return raw;

      const br = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (!br) return "";

      const day = Number(br[1]);
      const month = Number(br[2]);
      const year = Number(br[3]);
      const currentYear = new Date().getFullYear();
      const dt = new Date(year, month - 1, day);
      const isValid =
        dt.getFullYear() === year &&
        dt.getMonth() === month - 1 &&
        dt.getDate() === day &&
        year >= 1900 &&
        year <= currentYear;

      if (!isValid) return "";
      return `${String(year).padStart(4, "0")}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }

    function getCardCustomerData() {
      const profileCpf = digitsOnly(pick(customerProfile?.cpf, customerProfile?.document, orderData?.customer?.cpf, orderData?.cpf));
      const profileEmail = pick(customerProfile?.email, orderData?.customer?.email, currentUser?.email);
      const profilePhone = pick(customerProfile?.phone, customerProfile?.telefone, orderData?.customerPhone, orderData?.customer?.phone, orderData?.shippingAddress?.phone);
      const fullName = pick(getInputValue("form-checkout__cardholderName"), getOrderFullName());
      return {
        name: fullName,
        cpf: digitsOnly(pick(getInputValue("customerCpf"), profileCpf)),
        birthDate: normalizeBirthDateForApi(getInputValue("customerBirthDate")),
        phone: digitsOnly(pick(getInputValue("customerPhone"), profilePhone)),
        email: pick(getInputValue("customerEmail"), profileEmail)
      };
    }

    function fillCustomerFieldsFromOrder() {
      const data = getCardCustomerData();
      const cpfEl = document.getElementById("customerCpf");
      const phoneEl = document.getElementById("customerPhone");
      const emailEl = document.getElementById("customerEmail");
      const birthEl = document.getElementById("customerBirthDate");
      if (cpfEl && !cpfEl.value && data.cpf) cpfEl.value = maskCpfValue(data.cpf);
      if (phoneEl && !phoneEl.value && data.phone) phoneEl.value = maskPhoneValue(data.phone);
      if (emailEl && !emailEl.value && data.email) emailEl.value = data.email;
      if (birthEl && !birthEl.value) birthEl.value = formatBirthDateForInput(pick(customerProfile?.birthDate, customerProfile?.birth_date, customerProfile?.dataNascimento, orderData?.customer?.birthDate, orderData?.customer?.birth_date));
    }

    function validateCardCustomerData() {
      const data = getCardCustomerData();
      if (!data.name || data.name.split(/\s+/).length < 2) throw new Error("Informe o nome completo do titular do cartão.");
      if (!data.cpf || data.cpf.length !== 11) throw new Error("Informe um CPF válido do titular do cartão.");
      if (!data.birthDate) throw new Error("Informe uma data de nascimento válida no formato DD/MM/AAAA.");
      if (!data.phone || data.phone.length < 10) throw new Error("Informe um telefone válido do titular do cartão.");
      if (!data.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) throw new Error("Informe um e-mail válido do titular do cartão.");
      return data;
    }

    function pick(...vals) {
      for (const v of vals) {
        if (v !== undefined && v !== null && String(v).trim() !== "") return v;
      }
      return "";
    }

    function getAuthToken() {
      return (
        localStorage.getItem("userToken") ||
        localStorage.getItem("authToken") ||
        localStorage.getItem("token") ||
        localStorage.getItem("customerToken") ||
        ""
      );
    }

    function getHeaders(extra = {}) {
      const token = getAuthToken();
      return {
        "Content-Type": "application/json",
        ...(token ? { Authorization: "Bearer " + token } : {}),
        ...extra
      };
    }

    function getMpStatus(result) {
      return String(
        result?.status ||
        result?.data?.status ||
        result?.raw?.status ||
        result?.payment?.status ||
        ""
      ).toLowerCase();
    }

    function isMpApproved(result) {
      return result?.approved === true || getMpStatus(result) === "approved";
    }

    function getMpStatusMessage(result) {
      return (
        result?.error ||
        result?.details?.message ||
        result?.data?.status_detail ||
        result?.raw?.status_detail ||
        result?.statusDetail ||
        "Transação não aprovada pelo Mercado Pago."
      );
    }

    function mergeAndCachePayment(method, result, statusOverride) {
      const mpStatus = statusOverride || getMpStatus(result) || "pending";
      const merged = {
        ...(orderData || {}),
        paymentMethod: method,
        payment_method: method,
        paymentStatus: mpStatus === "approved" ? "approved" : mpStatus,
        status: mpStatus === "approved" ? "approved" : (orderData?.status || "pending_payment"),
        payment: {
          ...(orderData?.payment || {}),
          provider: "mercadopago",
          method,
          type: method === "card" ? "credit_card" : method,
          paymentId: result?.id || result?.paymentId || result?.data?.id || result?.raw?.id || "",
          status: mpStatus,
          statusDetail: result?.statusDetail || result?.data?.status_detail || result?.raw?.status_detail || "",
          raw: result?.data || result?.raw || result || null
        },
        totals: {
          ...(orderData?.totals || {}),
          paymentMethod: method
        }
      };
      try {
        localStorage.setItem("arianaLastOrderId", String(orderId || ""));
        localStorage.setItem("arianaLastOrderPayment", method);
        localStorage.setItem("arianaCheckoutSelectedPay", method);
        localStorage.setItem("arianaLastOrderResponse", JSON.stringify(merged));
      } catch (_) {}
      orderData = normalizeOrder(merged);
      return merged;
    }

    async function apiFetch(path, options = {}) {
      const url = /^https?:\/\//i.test(String(path || ""))
        ? String(path)
        : `${API_BASE}${String(path || "").startsWith("/") ? "" : "/"}${String(path || "")}`;

      const res = await fetch(url, {
        ...options,
        headers: getHeaders(options.headers || {})
      });

      const text = await res.text();
      let data = null;

      try {
        data = text ? JSON.parse(text) : null;
      } catch (_) {
        data = text;
      }

      if (!res.ok) {
        const details = data && (
          data.message ||
          data.error ||
          data.status_detail ||
          data.statusDetail ||
          data.details?.message ||
          data.details?.cause?.[0]?.description ||
          data.response?.message
        );
        throw new Error(details || `Erro HTTP ${res.status}`);
      }

      return data;
    }

    function setAlert(type, text) {
      const box = document.getElementById("alert-box");
      box.className = "mb-6 p-4 rounded-xl text-sm font-medium border";
      if (type === "error") box.classList.add("bg-red-50", "border-red-100", "text-red-700");
      else if (type === "success") box.classList.add("bg-teal-50", "border-teal-100", "text-teal-700");
      else if (type === "loading") box.classList.add("bg-blue-50", "border-blue-100", "text-blue-700");
      else box.classList.add("bg-slate-50", "border-slate-200", "text-slate-700");
      box.innerText = text;
      box.classList.remove("hidden");
    }

    function disablePayments(val) {
      const cardBtn = document.getElementById("form-checkout__submit");
      const boletoBtn = document.getElementById("btn-generate-boleto");
      if (cardBtn) cardBtn.disabled = val;
      if (boletoBtn) boletoBtn.disabled = val;
    }

    window.showChoice = () => {
      document.getElementById("section-choice").classList.remove("hidden");
      document.getElementById("panel-card").classList.add("hidden");
      document.getElementById("panel-pix").classList.add("hidden");
      document.getElementById("panel-boleto").classList.add("hidden");
      unmountCardForm();
    };

    function showPanel(id) {
      document.getElementById("section-choice").classList.add("hidden");
      document.getElementById("panel-card").classList.add("hidden");
      document.getElementById("panel-pix").classList.add("hidden");
      document.getElementById("panel-boleto").classList.add("hidden");
      document.getElementById(id).classList.remove("hidden");
    }

    function normalizeOrder(raw) {
      const data = raw?.order || raw?.item || raw?.data || raw || {};
      const totals = data?.totals || {};
      return {
        ...data,
        _id: data._id || data.id || data.orderId || "",
        id: data.id || data._id || data.orderId || "",
        status: data.status || data.paymentStatus || "pending",
        customer: data.customer || {},
        address: data.shippingAddress || data.address || data.deliveryAddress || data.customer?.address || null,
        totals: {
          ...(totals || {}),
          products: Number(totals.products ?? data.subtotal ?? 0) || 0,
          shipping: Number(totals.shipping ?? data.shippingCost ?? 0) || 0,
          grandTotalOriginal: Number(totals.grandTotalOriginal ?? totals.totalOriginal ?? data.totalOriginal ?? 0) || 0,
          discountValue: Number(totals.discountValue ?? data.discountValue ?? 0) || 0,
          discountApplied: totals.discountApplied ?? data.discountApplied ?? '',
          grandTotal: Number(
            totals.grandTotal ??
            totals.total ??
            data.total ??
            data.amount ??
            data.valorTotal ??
            0
          ) || 0
        }
      };
    }

    function normalizeProfile(raw) {
      return raw?.user || raw?.item || raw?.data || raw || {};
    }

    function normalizeAddress(addr) {
      if (!addr || typeof addr !== "object") return null;

      return {
        street: pick(addr.street, addr.street_name, addr.logradouro, addr.rua, addr.address, addr.endereco),
        number: pick(addr.number, addr.street_number, addr.numero, "S/N"),
        neighborhood: pick(addr.neighborhood, addr.bairro),
        city: pick(addr.city, addr.city_name, addr.cidade),
        state: String(pick(addr.state, addr.federal_unit, addr.uf)).trim().toUpperCase().slice(0, 2),
        zip: digitsOnly(pick(addr.zip, addr.zip_code, addr.cep, addr.zipCode)),
        complement: pick(addr.complement, addr.complemento, addr.apartment, addr.apto, addr.compl)
      };
    }

    function getOrderCpf() {
      return digitsOnly(
        pick(
          getInputValue("customerCpf"),
          customerProfile?.cpf,
          customerProfile?.document,
          orderData?.customer?.cpf,
          orderData?.cpf
        )
      );
    }

    function getOrderFullName() {
      return String(
        pick(
          customerProfile?.name,
          customerProfile?.nome,
          orderData?.customer?.name,
          orderData?.customer?.nome,
          currentUser?.name,
          currentUser?.displayName,
          "Cliente Ariana"
        )
      ).trim();
    }

    function splitFullName(full) {
      const parts = String(full || "").trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return { firstName: "Cliente", lastName: "Silva" };
      if (parts.length === 1) return { firstName: parts[0], lastName: "Silva" };
      return { firstName: parts[0], lastName: parts.slice(1).join(" ") };
    }

    function getBestAddress() {
      return normalizeAddress(
        orderData?.address ||
        customerProfile?.address ||
        (Array.isArray(customerProfile?.addresses) ? customerProfile.addresses[0] : null)
      );
    }

    function toMpAddress(addr) {
      const a = normalizeAddress(addr) || {};
      return {
        zip_code: a.zip || "",
        street_name: a.street || "",
        street_number: String(a.number || "S/N"),
        neighborhood: a.neighborhood || "",
        city: a.city || "",
        federal_unit: a.state || ""
      };
    }

    function getMpPayerStrict() {
      const customer = getCardCustomerData();
      const fullName = customer.name || getOrderFullName();
      const parts = splitFullName(fullName);
      const phoneDigits = digitsOnly(customer.phone);
      const payer = {
        email: customer.email,
        first_name: parts.firstName,
        last_name: parts.lastName,
        identification: { type: "CPF", number: customer.cpf || getOrderCpf() },
        address: toMpAddress(getBestAddress())
      };
      if (phoneDigits) {
        payer.phone = {
          area_code: phoneDigits.length >= 10 ? phoneDigits.slice(0, 2) : "",
          number: phoneDigits.length >= 10 ? phoneDigits.slice(2) : phoneDigits
        };
      }
      // A data de nascimento é enviada separadamente no payload e gravada como metadata no backend.
      // Não enviamos date_of_birth dentro de payer porque algumas versões da API de Payments do Mercado Pago
      // retornam HTTP 400 quando recebem campos extras dentro de payer.
      return payer;
    }

    function getMpReceiverAddressFromOrder() {
      const bestAddr = normalizeAddress(getBestAddress()) || {};
      const mpAddr = toMpAddress(bestAddr);
      return {
        zip_code: mpAddr.zip_code || "",
        street_name: mpAddr.street_name || "",
        street_number: String(mpAddr.street_number || "S/N"),
        neighborhood: mpAddr.neighborhood || "",
        city_name: mpAddr.city || "",
        state_name: mpAddr.federal_unit || "",
        apartment: bestAddr.complement || "",
        receiver_name: getOrderFullName()
      };
    }

    async function getMpPublicKey() {
      const data = await apiFetch("/payments/mp/public-key");
      const publicKey = data?.publicKey || data?.public_key || data?.key || "";
      if (!publicKey) {
        throw new Error("Não foi possível obter a Public Key do Mercado Pago.");
      }
      return publicKey;
    }

    function unmountCardForm() {
      if (cardForm) {
        try { cardForm.unmount(); } catch (_) {}
        cardForm = null;
      }
    }

    async function mountCardFormSafe() {
      try {
        if (!orderData?.totals?.grandTotal) {
          throw new Error("Total do pedido inválido.");
        }

        if (!mp) {
          const publicKey = await getMpPublicKey();
          mp = new MercadoPago(publicKey, { locale: "pt-BR" });
        }

        if (cardForm) unmountCardForm();

        cardForm = mp.cardForm({
          amount: String(orderData.totals.grandTotal),
          iframe: true,
          form: {
            id: "form-checkout",
            cardNumber: { id: "form-checkout__cardNumber", placeholder: "0000 0000 0000 0000" },
            expirationDate: { id: "form-checkout__expirationDate", placeholder: "MM/AA" },
            securityCode: { id: "form-checkout__securityCode", placeholder: "123" },
            cardholderName: { id: "form-checkout__cardholderName" },
            issuer: { id: "form-checkout__issuer" },
            installments: { id: "form-checkout__installments" },
            identificationType: { id: "form-checkout__identificationType" },
            identificationNumber: { id: "form-checkout__identificationNumber" },
            cardholderEmail: { id: "form-checkout__cardholderEmail" }
          },
          callbacks: {
            onFormMounted: (error) => {
              if (error) {
                console.warn("Erro ao montar formulário", error);
                return;
              }

              if (!document.getElementById("form-checkout__cardholderName").value) {
                document.getElementById("form-checkout__cardholderName").value = getOrderFullName();
              }
              fillCustomerFieldsFromOrder();
              const payer = getMpPayerStrict();
              document.getElementById("form-checkout__cardholderEmail").value = payer.email || "";
              document.getElementById("form-checkout__identificationType").value = "CPF";
              document.getElementById("form-checkout__identificationNumber").value = payer.identification?.number || "";
            },
            onSubmit: (event) => {
              event.preventDefault();
              const formData = cardForm.getCardFormData();
              doPayCard(formData);
            },
            onIdentificationTypesReceived: (error) => {
              if (error) console.warn("Erro identificação", error);
            }
          }
        });
      } catch (err) {
        console.error("Falha crítica no SDK:", err);
        setAlert("error", err.message || "Falha ao iniciar o cartão.");
      }
    }

    async function doPayCard(formData) {
      try {
        const customer = validateCardCustomerData();
        document.getElementById("form-checkout__cardholderEmail").value = customer.email;
        document.getElementById("form-checkout__identificationType").value = "CPF";
        document.getElementById("form-checkout__identificationNumber").value = customer.cpf;

        setAlert("loading", "Validando cartão junto ao Mercado Pago...");
        disablePayments(true);

        const payer = getMpPayerStrict();

        const cardToken = String(formData?.token || "").trim();
        const issuerId = String(formData?.issuerId || formData?.issuer_id || "").trim();
        const paymentMethodId = String(formData?.paymentMethodId || formData?.payment_method_id || "").trim();
        const installments = Number(formData?.installments || 1) || 1;
        const amount = Number(orderData?.totals?.grandTotal || formData?.amount || 0) || 0;

        console.log("[CARD FORM DATA]", {
          hasToken: !!cardToken,
          issuerId,
          paymentMethodId,
          installments,
          amount,
          emailOk: /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(customer.email || ""),
          cpfOk: String(customer.cpf || "").replace(/\D/g, "").length === 11,
          birthDateOk: !!customer.birthDate,
          phoneOk: String(customer.phone || "").replace(/\D/g, "").length >= 10
        });

        if (!amount || amount <= 0) {
          throw new Error("Total do pedido inválido para pagamento no cartão.");
        }
        if (!cardToken) {
          throw new Error("O Mercado Pago não gerou o token do cartão. Confira número, validade, CVV e tente novamente.");
        }
        if (!paymentMethodId) {
          throw new Error("A bandeira do cartão não foi identificada pelo Mercado Pago.");
        }
        if (!issuerId) {
          throw new Error("O banco emissor do cartão não foi identificado pelo Mercado Pago.");
        }

        const result = await apiFetch("/payments/mp/credit", {
          method: "POST",
          body: JSON.stringify({
            token: cardToken,
            issuer_id: issuerId,
            payment_method_id: paymentMethodId,
            amount,
            installments,
            orderId: orderId,
            email: customer.email,
            cpf: customer.cpf,
            birthDate: customer.birthDate,
            phone: customer.phone,
            customer: customer,
            payer: payer,
            address: toMpAddress(getBestAddress()),
            receiver_address: getMpReceiverAddressFromOrder(),
            paymentMethod: "card"
          })
        });

        if (isMpApproved(result)) {
          mergeAndCachePayment("card", result, "approved");
          clearCheckoutCartOnlyAfterSuccess();
          setAlert("success", "Pagamento aprovado! Preparando seu pedido...");
          setTimeout(() => {
            window.location.href = "pedido_confirmado.html?orderId=" + encodeURIComponent(orderId);
          }, 1200);
          return;
        }

        const mpStatus = getMpStatus(result) || "pending";
        mergeAndCachePayment("card", result, mpStatus);
        throw new Error(`${getMpStatusMessage(result)} Status: ${mpStatus}`);
      } catch (e) {
        console.error("ERRO CARTAO COMPLETO:", e);

        let msg =
          e?.details?.cause?.[0]?.description ||
          e?.details?.message ||
          e?.statusDetail ||
          e?.message ||
          "Falha no pagamento.";

        setAlert("error", "Erro no cartão: " + msg);
        disablePayments(false);
      }
    }

    async function generatePix() {
      try {
        setAlert("loading", "Gerando seu QR Code Pix...");
        const data = await apiFetch("/payments/mp/pix", {
          method: "POST",
          body: JSON.stringify({
            orderId: orderId,
            amount: orderData.totals.grandTotal,
            email: getMpPayerStrict().email || "",
            cpf: getMpPayerStrict().identification?.number || "",
            payer: getMpPayerStrict(),
            address: toMpAddress(getBestAddress()),
            receiver_address: getMpReceiverAddressFromOrder()
          })
        });

        if (data?.ok && (data?.qrCodeBase64 || data?.qrCode || data?.qr_code)) {
          try {
            const merged = {
              ...(orderData || {}),
              paymentMethod: "pix",
              payment_method: "pix",
              payment: { ...(orderData?.payment || {}), provider: "mercadopago", method: "pix", type: "pix", ...(data?.payment || data || {}) },
              paymentStatus: "pending",
              status: "pending",
              totals: { ...(orderData?.totals || {}), paymentMethod: "pix" }
            };
            localStorage.setItem("arianaLastOrderId", String(orderId || ""));
            localStorage.setItem("arianaLastOrderResponse", JSON.stringify(merged));
          } catch (_) {}
          document.getElementById("pix-loading").classList.add("hidden");
          document.getElementById("pix-content").classList.remove("hidden");
          if (data?.qrCodeBase64) {
            document.getElementById("pix-qr-img").src = `data:image/png;base64,${data.qrCodeBase64}`;
          } else if (data?.qrCodeImage) {
            document.getElementById("pix-qr-img").src = data.qrCodeImage;
          }
          document.getElementById("pix-code-input").value = data.qrCode || data.qr_code || "";
          // Pix gerado ainda não significa pagamento aprovado. Mantém o carrinho se o cliente voltar.
          setAlert("success", "Pix gerado com sucesso.");
        } else {
          throw new Error(data?.error || "Falha ao gerar QR Code.");
        }
      } catch (e) {
        setAlert("error", "Não foi possível gerar o PIX. " + (e.message || ""));
        showChoice();
      }
    }

    async function generateBoleto() {
      try {
        setAlert("loading", "Gerando boleto oficial...");
        disablePayments(true);

        const parts = splitFullName(getOrderFullName());
        const payer = getMpPayerStrict();

        const data = await apiFetch("/payments/mp/boleto", {
          method: "POST",
          body: JSON.stringify({
            orderId: orderId,
            amount: orderData.totals.grandTotal,
            email: payer.email || "",
            cpf: payer.identification?.number || "",
            firstName: parts.firstName,
            lastName: parts.lastName,
            address: toMpAddress(getBestAddress()),
            payer,
            receiver_address: getMpReceiverAddressFromOrder()
          })
        });

        if (data?.ok && (data?.ticketUrl || data?.ticket_url)) {
          try {
            const merged = {
              ...(orderData || {}),
              paymentMethod: "boleto",
              payment_method: "boleto",
              payment: { ...(orderData?.payment || {}), provider: "mercadopago", method: "boleto", type: "boleto", ...(data?.payment || data || {}) },
              paymentStatus: "pending",
              status: "pending",
              totals: { ...(orderData?.totals || {}), paymentMethod: "boleto" }
            };
            localStorage.setItem("arianaLastOrderId", String(orderId || ""));
            localStorage.setItem("arianaLastOrderResponse", JSON.stringify(merged));
          } catch (_) {}
          // Boleto gerado ainda fica pendente até compensar. Mantém o carrinho se o cliente voltar.
          setAlert("success", "Boleto gerado com sucesso!");
          window.open(data.ticketUrl || data.ticket_url, "_blank");
        } else {
          throw new Error(data?.details?.cause?.[0]?.description || data?.error || "Erro ao gerar boleto.");
        }
      } catch (e) {
        setAlert("error", "Erro: " + (e.message || "Falha ao gerar boleto."));
        disablePayments(false);
      }
    }

    async function loadCurrentUser() {
      try {
        const data = await apiFetch("/me");
        currentUser = normalizeProfile(data);
      } catch (_) {
        currentUser = null;
      }
    }

    async function loadProfile() {
      try {
        const data = await apiFetch("/me");
        customerProfile = normalizeProfile(data);
      } catch (_) {
        customerProfile = {};
      }
    }

    async function loadOrder() {
      if (!orderId) {
        setAlert("error", "ID do pedido não fornecido.");
        return;
      }

      document.getElementById("order-id-display").innerText = `PEDIDO: ${orderId}`;

      const attempts = [
        `/orders/${encodeURIComponent(orderId)}`,
        `/pedidos/${encodeURIComponent(orderId)}`
      ];

      let lastError = null;

      for (const path of attempts) {
        try {
          const data = await apiFetch(path);
          orderData = normalizeOrder(data);
          try {
            localStorage.setItem("arianaLastOrderId", String(orderId || orderData?._id || orderData?.id || ""));
            localStorage.setItem("arianaLastOrderResponse", JSON.stringify(orderData));
          } catch (_) {}
          renderResumo();

          if (["paid", "approved"].includes(String(orderData.status || "").toLowerCase())) {
            window.location.href = "pedido_confirmado.html?orderId=" + encodeURIComponent(orderId);
            return;
          }

          return;
        } catch (e) {
          lastError = e;
        }
      }

      throw lastError || new Error("Pedido não encontrado.");
    }

    function renderResumo() {
      if (!orderData) return;
      document.getElementById("order-summary").classList.remove("hidden");
      const fmt = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
      const totalEl = document.getElementById("summary-total");
      if (totalEl) totalEl.innerText = fmt.format(Number(orderData?.totals?.grandTotal || 0));

      const box = document.getElementById("order-summary");
      if (box && !document.getElementById("summary-discount-info")) {
        const original = Number(orderData?.totals?.grandTotalOriginal || 0);
        const discount = Number(orderData?.totals?.discountValue || 0);
        const applied = String(orderData?.totals?.discountApplied || "");
        if (discount > 0 && original > 0) {
          const info = document.createElement("div");
          info.id = "summary-discount-info";
          info.className = "mt-3 text-sm text-green-600 font-bold text-right";
          info.innerHTML = `Desconto aplicado ${applied ? `(${applied})` : ``}: - ${fmt.format(discount)}<br><span class="text-slate-400 font-medium">De ${fmt.format(original)} por</span>`;
          box.insertBefore(info, totalEl?.parentElement || null);
        }
      }
      disablePayments(false);
    }

    async function refreshOrderStatus() {
      try {
        await loadOrder();
      } catch (_) {}
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(refreshOrderStatus, 10000);
    }


    function openSelectedMethod(method) {
      const normalized =
        method === "card" ? "card" :
        method === "boleto" ? "boleto" :
        "pix";

      selectedMethod = normalized;

      document.querySelectorAll(".btn-choice").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.method === normalized);
        const indicator = btn.querySelector(".radio-indicator");
        if (indicator) {
          indicator.innerHTML = btn.dataset.method === normalized
            ? '<div class="w-3 h-3 mx-auto mt-0.5 bg-blue-600 rounded-full"></div>'
            : "";
        }
      });

      const continueBtn = document.getElementById("btn-continue");
      if (continueBtn) {
        continueBtn.disabled = false;
        continueBtn.classList.remove("opacity-50");
      }

      const choice = document.getElementById("section-choice");
      const panelCard = document.getElementById("panel-card");
      const panelPix = document.getElementById("panel-pix");
      const panelBoleto = document.getElementById("panel-boleto");

      if (choice) choice.classList.add("hidden");
      if (panelCard) panelCard.classList.add("hidden");
      if (panelPix) panelPix.classList.add("hidden");
      if (panelBoleto) panelBoleto.classList.add("hidden");

      if (normalized === "card" && panelCard) panelCard.classList.remove("hidden");
      if (normalized === "pix" && panelPix) panelPix.classList.remove("hidden");
      if (normalized === "boleto" && panelBoleto) panelBoleto.classList.remove("hidden");
    }

    async function tryAutoOpenMethod() {
      const params = new URLSearchParams(window.location.search);
      const method = (
        params.get("method") ||
        localStorage.getItem("arianaCheckoutSelectedPay") ||
        localStorage.getItem("arianaLastOrderPayment") ||
        ""
      ).trim().toLowerCase();

      if (!method) return;

      if (method === "card") {
        selectedMethod = "card";
        showPanel("panel-card");
        await mountCardFormSafe();
      } else if (method === "pix") {
        selectedMethod = "pix";
        showPanel("panel-pix");
        document.getElementById("pix-loading").classList.remove("hidden");
        document.getElementById("pix-content").classList.add("hidden");
        await generatePix();
      } else if (method === "boleto") {
        selectedMethod = "boleto";
        showPanel("panel-boleto");
      }
    }

    function clearCheckoutCartOnlyAfterSuccess() {
      try {
        localStorage.removeItem("arianaMoveisCart");
        localStorage.removeItem("ariana_moveis_cart");
        localStorage.removeItem("arianaCheckoutPendingCart");
      } catch (_) {}
    }

    function bindChoice() {
      if (window.__bindChoiceDone) return;
      window.__bindChoiceDone = true;

      const btns = document.querySelectorAll(".btn-choice");
      const continueBtn = document.getElementById("btn-continue");

      btns.forEach((b) => {
        b.addEventListener("click", () => {
          btns.forEach((x) => {
            x.classList.remove("active");
            const indicator = x.querySelector(".radio-indicator");
            if (indicator) indicator.innerHTML = "";
          });
          b.classList.add("active");
          const indicator = b.querySelector(".radio-indicator");
          if (indicator) indicator.innerHTML = '<div class="w-3 h-3 mx-auto mt-0.5 bg-blue-600 rounded-full"></div>';
          continueBtn.disabled = false;
          continueBtn.style.opacity = "1";
          continueBtn.dataset.method = b.dataset.method;
          selectedMethod = b.dataset.method || "";
          try {
            localStorage.setItem("arianaCheckoutSelectedPay", selectedMethod);
            localStorage.setItem("arianaLastOrderPayment", selectedMethod);
          } catch (_) {}
        });
      });

      continueBtn.addEventListener("click", async () => {
        const method = continueBtn.dataset.method;
        if (method === "card") {
          showPanel("panel-card");
          await mountCardFormSafe();
        } else if (method === "pix") {
          showPanel("panel-pix");
          document.getElementById("pix-loading").classList.remove("hidden");
          document.getElementById("pix-content").classList.add("hidden");
          await generatePix();
        } else if (method === "boleto") {
          showPanel("panel-boleto");
        }
      });
    }

    async function init() {
      try {
        bindChoice();
        document.getElementById("customerCpf")?.addEventListener("input", (e) => { e.target.value = maskCpfValue(e.target.value); });
        document.getElementById("customerPhone")?.addEventListener("input", (e) => { e.target.value = maskPhoneValue(e.target.value); });
        document.getElementById("customerBirthDate")?.addEventListener("input", (e) => { e.target.value = maskBirthDateValue(e.target.value); });
        document.getElementById("customerBirthDate")?.addEventListener("blur", (e) => { e.target.value = formatBirthDateForInput(e.target.value); });
        document.getElementById("customerEmail")?.addEventListener("blur", (e) => { e.target.value = String(e.target.value || "").trim().toLowerCase(); });
        document.getElementById("btn-generate-boleto").addEventListener("click", generateBoleto);
        document.getElementById("btn-copy-pix").addEventListener("click", async () => {
          const input = document.getElementById("pix-code-input");
          try {
            await navigator.clipboard.writeText(input.value || "");
            setAlert("success", "Código Pix copiado!");
          } catch (_) {
            input.select();
            document.execCommand("copy");
            setAlert("success", "Código Pix copiado!");
          }
        });

        await loadCurrentUser();
        await loadProfile();
        await loadOrder();
        // Não abrir PIX/cartão automaticamente. O cliente precisa escolher a forma de pagamento nesta tela.
        startPolling();
      } catch (e) {
        console.error(e);
        setAlert("error", e.message || "Não foi possível carregar o pagamento.");
      }
    }

    document.addEventListener("DOMContentLoaded", init);
    window.addEventListener("beforeunload", () => {
      if (pollTimer) clearInterval(pollTimer);
      unmountCardForm();
    });
  </script>
</body>
</html>
