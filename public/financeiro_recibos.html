<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro Ariana | Carregando</title>
  <style>
    html,body{height:100%;margin:0;font-family:Inter,Arial,sans-serif;background:#f3f6fb;color:#0f172a}
    .loader{height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
    .card{max-width:520px;background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:28px;box-shadow:0 18px 50px #0f172a14}
    .brand{font-size:26px;font-weight:900;color:#1d4ed8;margin-bottom:8px}.muted{color:#64748b;font-size:14px;line-height:1.5}
  </style>
</head>
<body>
  <div class="loader"><div class="card"><div class="brand">Ariana Móveis</div><div id="loadingText" class="muted">Carregando o Financeiro Ariana integrado ao ERP...</div></div></div>
  <script>
    (async function carregarFinanceiroAriana(){
      try{
        const response=await fetch('/financeiro_recibos_legacy.html?v=20260915-erp1',{cache:'no-store'});
        if(!response.ok)throw new Error('HTTP '+response.status);
        let html=await response.text();
        const preload='<scr'+'ipt src="/financeiro_erp_preload.js?v=20260915-erp1"></scr'+'ipt>';
        const bridge='<scr'+'ipt src="/financeiro_erp_bridge.js?v=20260915-erp1"></scr'+'ipt>';
        if(/<head[^>]*>/i.test(html))html=html.replace(/<head([^>]*)>/i,'<head$1>'+preload);
        else html=preload+html;
        if(/<\/body>/i.test(html))html=html.replace(/<\/body>/i,bridge+'</body>');
        else html+=bridge;
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        const text=document.getElementById('loadingText');
        if(text)text.textContent='Não foi possível carregar o Financeiro Ariana. Atualize a página. Detalhe: '+(error.message||error);
        console.error('[Financeiro Ariana loader]',error);
      }
    })();
  </script>
</body>
</html>
