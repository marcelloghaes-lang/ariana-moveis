<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financeiro | Ariana ERP</title><style>:root{--b:#0646a5;--bg:#f4f6f9;--line:#dce3ec;--text:#172033;--muted:#69758a;--green:#087a52;--red:#be3443;--amber:#a85f00}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Inter,Segoe UI,Arial,sans-serif;color:var(--text)}header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}header a{color:var(--b);font-weight:900;text-decoration:none}.wrap{max-width:1450px;margin:auto;padding:18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.card small{color:var(--muted);font-weight:800}.card b{display:block;font-size:22px;margin-top:5px}.bad{color:var(--red)}.ok{color:var(--green)}.warn{color:var(--amber)}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0}.tabs button,.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer}.tabs button.active,.btn.primary{background:var(--b);color:#fff;border-color:var(--b)}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:12px}.filters input,.filters select{border:1px solid #cfd8e5;border-radius:9px;padding:10px}table{width:100%;border-collapse:collapse}th{font-size:10px;text-transform:uppercase;color:#778296;text-align:left;padding:9px;border-bottom:1px solid var(--line)}td{padding:10px 9px;border-bottom:1px solid #edf0f5}.pill{font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px;background:#eef4ff;color:var(--b)}.pill.overdue{background:#fff0f1;color:var(--red)}.pill.paid{background:#eaf7f2;color:var(--green)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.empty{text-align:center;color:var(--muted);padding:25px}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.filters,.grid2{grid-template-columns:1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr}.wrap{padding:10px}}</style></head><body><header><div><b>Financeiro Completo</b><div style="color:#69758a;font-size:12px">Ariana ERP • dados próprios</div></div><div><a href="erp_relatorios.html">Relatórios</a> &nbsp; <a href="erp_ariana.html">← Central ERP</a></div></header><main class="wrap"><div class="cards"><div class="card"><small>A receber</small><b id="rec">—</b></div><div class="card"><small>A receber vencido</small><b class="bad" id="recOver">—</b></div><div class="card"><small>A pagar</small><b id="pay">—</b></div><div class="card"><small>A pagar vencido</small><b class="bad" id="payOver">—</b></div></div><div class="tabs" id="tabs"><button class="active" data-dir="receivable" data-view="pending">A Receber</button><button data-dir="receivable" data-view="upcoming">A vencer</button><button data-dir="receivable" data-view="overdue">Vencidos</button><button data-dir="receivable" data-view="delinquent">Inadimplentes</button><button data-dir="receivable" data-view="paid">Recebidos</button><button data-dir="payable" data-view="pending">A Pagar</button><button data-dir="payable" data-view="upcoming">Pagar a vencer</button><button data-dir="payable" data-view="overdue">Pagar vencidos</button><button data-dir="payable" data-view="paid">Pagos</button></div><section class="panel"><div class="filters"><input id="q" placeholder="Cliente/fornecedor, CPF/CNPJ, descrição ou categoria"><input id="from" type="date"><input id="to" type="date"><button class="btn primary" id="search">Atualizar</button></div><div style="overflow:auto"><table><thead><tr><th>Pessoa</th><th>Descrição</th><th>Vencimento</th><th>Forma</th><th>Valor</th><th>Status</th></tr></thead><tbody id="body"></tbody></table></div></section><div class="grid2"><section class="panel"><h3>Inadimplentes</h3><div id="delinquents"></div></section><section class="panel"><h3>Fluxo de caixa — previsto x realizado</h3><div id="flow"></div></section></div><section class="panel" style="margin-top:14px"><h3>Resultado por categoria</h3><div id="categories"></div></section></main><script>const API=location.hostname==='localhost'?'http://localhost:3000/api':'https://ariana-backend.onrender.com/api';const $=id=>document.getElementById(id);let dir='receivable',view='pending';function token(){const t=localStorage.getItem('admin_token')||localStorage.getItem('auth_token')||localStorage.getItem('token')||'';if(t)return t;try{return JSON.parse(localStorage.getItem('banner_admin_session')||'null')?.token||''}catch{return''}}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function date(v){if(!v)return'—';return new Date(v).toLocaleDateString('pt-BR')}async function load(){const p=new URLSearchParams({direction:dir,q:$('q').value.trim()});if(view!=='delinquent')p.set('view',view);if($('from').value)p.set('from',$('from').value);if($('to').value)p.set('to',$('to').value);const r=await fetch(API+'/erp/financeiro/completo?'+p,{headers:{Authorization:'Bearer '+token()},cache:'no-store'}),d=await r.json();if(!r.ok){$('body').innerHTML=`<tr><td colspan="6" class="empty">${esc(d.error||'Erro')}</td></tr>`;return}const s=d.summary||{};$('rec').textContent=money(s.receivables?.pending?.value);$('recOver').textContent=money(s.receivables?.overdue?.value);$('pay').textContent=money(s.payables?.pending?.value);$('payOver').textContent=money(s.payables?.overdue?.value);if(view==='delinquent'){$('body').innerHTML=(d.delinquents||[]).map(x=>`<tr><td><b>${esc(x.personName)}</b></td><td>${x.count} parcela(s)</td><td>${date(x.oldestDue)}</td><td>${x.daysOverdue} dias</td><td><b class="bad">${money(x.total)}</b></td><td><span class="pill overdue">Inadimplente</span></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhum inadimplente.</td></tr>'}else $('body').innerHTML=(d.entries||[]).map(x=>`<tr><td><b>${esc(x.personName||'—')}</b><br><small>${esc(x.personDocument||'')}</small></td><td>${esc(x.description||'—')}<br><small>${esc(x.categoryName||'')}</small></td><td>${date(x.dueAt)}</td><td>${esc(x.paymentMethod||'—')}</td><td><b>${money(x.status==='paid'?(x.paidValue||x.value):x.value)}</b></td><td><span class="pill ${x.view==='overdue'?'overdue':x.view==='paid'?'paid':''}">${x.view==='overdue'?'Vencido':x.view==='upcoming'?'A vencer':x.view==='paid'?'Pago/Recebido':esc(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nenhum lançamento.</td></tr>';$('delinquents').innerHTML=(d.delinquents||[]).slice(0,12).map(x=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #edf0f5"><span>${esc(x.personName)} <small>(${x.count})</small></span><b class="bad">${money(x.total)}</b></div>`).join('')||'<div class="empty">Nenhum inadimplente.</div>';$('flow').innerHTML=(d.cashFlow||[]).slice(-12).map(x=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #edf0f5"><span>${x.month}</span><span>Prev. <b>${money(x.saldoPrevisto)}</b> • Real <b class="${x.saldoRealizado>=0?'ok':'bad'}">${money(x.saldoRealizado)}</b></span></div>`).join('')||'<div class="empty">Sem movimento.</div>';$('categories').innerHTML=(d.categories||[]).slice(0,25).map(x=>`<div style="display:grid;grid-template-columns:2fr 1fr 1fr;padding:7px 0;border-bottom:1px solid #edf0f5"><span>${esc(x.category)}</span><span>Previsto: <b>${money(x.expected)}</b></span><span>Realizado: <b>${money(x.realized)}</b></span></div>`).join('')||'<div class="empty">Sem categorias.</div>'}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');dir=b.dataset.dir;view=b.dataset.view;load()});$('search').onclick=load;$('q').onkeydown=e=>{if(e.key==='Enter')load()};load();</script></body></html>
