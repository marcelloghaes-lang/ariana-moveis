<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comissões | Ariana ERP</title><style>body{margin:0;background:#f4f7fb;font:14px Arial;color:#142033}header{padding:18px;background:#2E6DA4;color:#fff}main{max-width:1200px;margin:auto;padding:18px}.box{background:#fff;border:1px solid #dce5ef;border-radius:12px;padding:14px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap}input,select,button{padding:10px;border:1px solid #ccd8e5;border-radius:8px}button{background:#2E6DA4;color:#fff;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #edf1f5;text-align:left}a{color:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cards b{display:block;font-size:20px;margin-top:4px}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}
/* Ariana ERP — identidade operacional unificada */
:root{--ariana-blue:#0047ab;--ariana-blue-dark:#00377f;--ariana-yellow:#f4c400;--ariana-bg:#f2f6fb;--ariana-line:#d8e2ef}
body{background:var(--ariana-bg)!important}
header,.top,.header{background:linear-gradient(90deg,var(--ariana-blue-dark),var(--ariana-blue))!important;color:#fff!important;border-bottom:0!important;box-shadow:0 4px 16px rgba(0,40,100,.16)}
header h1,header h2,.top h1,.top h2,.header h1,.header h2{color:#fff!important}
header small,.top small,.header small{color:#dceaff!important}
header a,.top a,.header a{color:#fff!important}header a:hover,.top a:hover,.header a:hover{color:var(--ariana-yellow)!important}
.card,.box,.panel,.hero,.tablebox,.toolbar,.filters,.summary,.kpi{border-radius:8px!important;box-shadow:0 8px 22px rgba(0,49,118,.08)!important}
button,.btn{border-radius:6px!important}input,select,textarea{border-color:#c8d6e7!important}input:focus,select:focus,textarea:focus{outline:none!important;border-color:#6c9ddd!important;box-shadow:0 0 0 3px rgba(0,71,171,.09)!important}
table thead th{color:#315273}table tbody tr:hover{background:#f6f9fd}
</style><link rel="stylesheet" href="erp-theme.css?v=20260924-1">
</head><body><header><b>Comissões de vendedores</b> · <a href="erp_ariana.html">Voltar ao Ariana ERP</a></header><main><div class="box"><div class="row"><input id="from" type="date"><input id="to" type="date"><label><input id="hist" type="checkbox"> Histórico SIGE</label><button id="load">Atualizar</button></div></div><div class="cards"><div class="box">Vendas<b id="s1">—</b></div><div class="box">Faturamento<b id="s2">—</b></div><div class="box">Comissões<b id="s3">—</b></div><div class="box">Vendedores<b id="s4">—</b></div></div><div class="box"><b>Regra por vendedor</b><div class="row" style="margin-top:10px"><input id="seller" placeholder="Vendedor"><select id="mode"><option value="percent">Percentual</option><option value="fixed_per_sale">Valor fixo por venda</option></select><input id="value" type="number" min="0" step="0.01" placeholder="Valor"><button id="save">Salvar regra</button></div></div><div class="box"><b>Resumo por vendedor</b><div id="out" style="overflow:auto;margin-top:10px"></div></div></main><script>const API='https://ariana-backend.onrender.com/api',tok=()=>localStorage.getItem('admin_token')||localStorage.getItem('adminToken')||localStorage.getItem('auth_token')||localStorage.getItem('token')||'',m=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),$=id=>document.getElementById(id);async function req(p,o={}){const r=await fetch(API+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok()}}),d=await r.json();if(!r.ok)throw Error(d.error||'Erro');return d}async function load(){const q=new URLSearchParams({from:$('from').value,to:$('to').value});if($('hist').checked)q.set('includeHistorical','true');const d=await req('/erp/comissoes/relatorio?'+q),s=d.summary||{};$('s1').textContent=s.sales||0;$('s2').textContent=m(s.total);$('s3').textContent=m(s.commission);$('s4').textContent=s.sellers||0;$('out').innerHTML='<table><tr><th>Vendedor</th><th>Vendas</th><th>Faturamento</th><th>Regra</th><th>Comissão</th></tr>'+((d.sellers||[]).map(x=>'<tr><td><button data-s="'+x.sellerName+'" data-m="'+(x.rule?.mode||'percent')+'" data-v="'+(x.rule?.value||0)+'">'+x.sellerName+'</button></td><td>'+x.sales+'</td><td>'+m(x.total)+'</td><td>'+(x.rule?(x.rule.mode==='percent'?x.rule.value+'%':m(x.rule.value)+'/venda'):'Sem regra')+'</td><td><b>'+m(x.commission)+'</b></td></tr>').join(''))+'</table>';document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{$('seller').value=b.dataset.s;$('mode').value=b.dataset.m;$('value').value=b.dataset.v})}$('save').onclick=async()=>{await req('/erp/comissoes/regras',{method:'PUT',body:JSON.stringify({sellerName:$('seller').value,mode:$('mode').value,value:Number($('value').value||0),active:true})});load()};$('load').onclick=load;const n=new Date(),f=new Date(n.getFullYear(),n.getMonth(),1);$('from').value=f.toISOString().slice(0,10);$('to').value=n.toISOString().slice(0,10);load().catch(e=>$('out').textContent=e.message);</script></body></html>
