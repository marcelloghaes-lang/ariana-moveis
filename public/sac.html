<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAC & Ouvidoria | Ariana Móveis</title>

    <link rel="stylesheet" href="./css/tailwind.min.css">
    <script src="js/api-config.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; margin: 0; padding: 0; }

        /* 🔥 AGORA NÃO FORÇA COR — USA HEADER PADRÃO */
        #header-container {
            width: 100%;
            position: relative;
            z-index: 100;
        }

        /* HERO AGORA SEGUE COR PADRÃO DO SISTEMA */
        .hero-sac {
            background-color: #2E6DA4;
            width: 100%;
            padding: 40px 0 80px 0;
            text-align: center;
        }

        .hero-sac h1 {
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .hero-sac p {
            color: #bfdbfe;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            margin-top: -50px; 
            position: relative;
            z-index: 20;
        }

        .card-info-sac {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .text-dark-ariana { color: #2E6DA4; }

        .btn-voltar-sac {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s;
        }
        .btn-voltar-sac:hover { background: rgba(255, 255, 255, 0.25); }
    </style>
</head>

<body>

    <div id="header-container"></div>

    <section class="hero-sac">
        <div class="max-w-6xl mx-auto px-4">
            <a href="index.html" class="btn-voltar-sac">
                <i class="fas fa-arrow-left"></i> VOLTAR PARA A LOJA
            </a>
            <h1>Como podemos ajudar?</h1>
            <p>Central de Atendimento e Ouvidoria Ariana Móveis</p>
        </div>
    </section>

    <main class="max-w-6xl mx-auto px-4 pb-20 main-content">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <div class="lg:col-span-1 space-y-6">
                <div class="card-info-sac">
                    <h3 class="font-bold text-xl mb-6 border-b pb-2 text-dark-ariana">Canais Diretos</h3>

                    <div class="flex items-center gap-4 mb-8">
                        <div class="bg-blue-50 p-3 rounded-lg text-blue-800">
                            <i class="fas fa-phone-alt text-xl"></i>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold uppercase text-gray-400">Capitais e Regiões</p>
                            <p id="display-4004" class="text-lg font-black text-dark-ariana">4004-0000</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-4">
                        <div class="bg-green-50 p-3 rounded-lg text-green-700">
                            <i class="fas fa-whatsapp text-xl"></i>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold uppercase text-gray-400">WhatsApp / SAC</p>
                            <p id="display-0800" class="text-lg font-black text-dark-ariana">0800-000-000</p>
                        </div>
                    </div>
                </div>

                <div class="card-info-sac" style="background-color: #f1f5f9;">
                    <h3 class="font-bold text-md mb-3 flex items-center gap-2 text-dark-ariana">
                        <i class="far fa-clock"></i> Horários de Suporte
                    </h3>
                    <div class="text-sm space-y-1 text-dark-ariana">
                        <p class="flex justify-between"><span>Seg a Sex:</span> <strong>08:00 às 18:00</strong></p>
                        <p class="flex justify-between"><span>Sábados:</span> <strong>09:00 às 13:00</strong></p>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-white rounded-2xl shadow-xl p-8 sm:p-10 border border-gray-100">
                    <form id="form-atendimento" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <input type="text" id="nome" required placeholder="Seu Nome Completo" class="w-full p-4 border rounded-xl bg-gray-50 outline-none focus:border-blue-900">
                            <input type="email" id="email" required placeholder="Seu melhor e-mail" class="w-full p-4 border rounded-xl bg-gray-50 outline-none focus:border-blue-900">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <input type="text" id="pedido" placeholder="Número do Pedido (se houver)" class="w-full p-4 border rounded-xl bg-gray-50 outline-none">
                            <select id="tipo" class="w-full p-4 border rounded-xl bg-gray-50 font-bold text-gray-700">
                                <option>Dúvidas sobre Pedido (SAC)</option>
                                <option>Elogios ou Reclamações (Ouvidoria)</option>
                            </select>
                        </div>
                        <textarea id="mensagem" required rows="5" placeholder="Descreva aqui sua solicitação..." class="w-full p-4 border rounded-xl bg-gray-50 outline-none focus:border-blue-900"></textarea>

                        <button type="submit" id="btn-enviar" class="w-full bg-primary-blue text-white py-5 rounded-xl font-black text-lg shadow-lg hover:bg-blue-800 transition-all">
                            ENVIAR MENSAGEM
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="./footer.js"></script>

    <script>
        function initAriana() {
            if (window.carregarHeader) window.carregarHeader();
            if (window.carregarFooter) window.carregarFooter();
        }
        window.addEventListener('load', initAriana);
        setTimeout(initAriana, 600);

        const API_BASE = window.API_BASE;

        document.getElementById('form-atendimento').onsubmit = async (e) => {
            e.preventDefault();

            const payload = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                pedido: document.getElementById('pedido').value,
                tipo: document.getElementById('tipo').value,
                mensagem: document.getElementById('mensagem').value
            };

            try {
                await fetch(API_BASE + "/atendimentos", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                alert("Sua mensagem foi enviada com sucesso!");
                e.target.reset();
            } catch (err) {
                alert("Erro ao enviar.");
            }
        };
    </script>

</body>
</html>
