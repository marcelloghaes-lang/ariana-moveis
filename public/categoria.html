<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Categorias | ARIANA MÓVEIS</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="./css/tailwind.min.css">
  <script src="js/api-config.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F5F7FA; }
    .product-card { transition: all 0.3s ease; }
    .product-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,.1); }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .product-card{background-color:#fff;border-radius:4px;border:1px solid #e7e7e7;box-shadow:none;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;padding:10px;height:100%}
    .product-image-container{width:100%;height:180px;position:relative;overflow:hidden;margin-bottom:10px;display:flex;justify-content:center;align-items:center;background:#fff}
    .product-image-container img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
    .product-card-body{padding:0;flex-grow:1;display:flex;flex-direction:column;justify-content:flex-start}
    .product-name{font-size:.85rem;font-weight:400;color:#444;height:3em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:10px}
    .product-old-price{font-size:.8rem;color:#999;text-decoration:line-through;font-weight:400;line-height:1.2}
    .product-price{font-size:1.25rem;font-weight:700;color:#333;margin-top:2px;display:flex;align-items:flex-end;line-height:1}
    .product-price .currency{font-size:.7em;font-weight:400;align-self:flex-start}
    .product-price .price-integer{font-size:1em;font-weight:700;margin-left:2px}
    .product-price .decimal-part{font-size:.7em;font-weight:400}
    .product-price .cash-text{font-size:.75rem;font-weight:400;color:#555;margin-left:5px;padding-bottom:1px}
    .product-installments{font-size:.75rem;color:#777;margin-top:5px;line-height:1.4}
    .product-tag-container{position:absolute;top:5px;left:5px;z-index:10;display:flex;flex-direction:column;gap:5px}
    .product-tag{color:#fff;font-size:.75rem;font-weight:600;padding:2px 5px;border-radius:2px;display:block;width:fit-content;line-height:1}
    .tag-orange{background-color:#ff931e}
    .product-card-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  </style>

  
  <script>
    window.apiRequestWithFallback = async function(path, opts = {}) {
      const API_BASE =
        window.API_BASE ||
        localStorage.getItem("API_BASE") ||
        "https://ariana-backend.onrender.com/api";

      const normalizedPath = `${String(path).startsWith('/') ? '' : '/'}${path}`;
      const headers = { ...(opts.headers || {}) };

      if (!(opts.body instanceof FormData) && !headers['Content-Type']) {
        headers['Content-Type'] = 'application/json';
      }

      const url = `${String(API_BASE).replace(/\/+$/, '')}${normalizedPath}`;
      const res = await fetch(url, { ...opts, headers });
      const ct = res.headers.get('content-type') || '';
      const data = ct.includes('application/json')
        ? await res.json().catch(() => null)
        : await res.text().catch(() => null);

      if (!res.ok) {
        const msg = (data && typeof data === 'object' && (data.message || data.error))
          ? (data.message || data.error)
          : `HTTP ${res.status}`;
        throw new Error(msg);
      }

      return data;
    };
  </script>
</head>

<body class="bg-fundo text-text-dark font-sans">

  <div id="header-container"></div>
  <div id="header-placeholder"></div>
  <div id="message-container" class="fixed top-24 right-4 z-[9999] w-80"></div>

  <main class="max-w-8xl mx-auto px-4 sm:px-6 lg:px-8 py-8 mt-6">
    <div class="flex flex-col md:flex-row gap-8">

      <aside class="w-full md:w-64 flex-shrink-0">
        <div class="bg-white rounded-xl shadow-sm p-6 sticky top-24 border border-gray-100">
          <h2 class="text-lg font-bold mb-6 flex items-center gap-2">
            <i class="fa-solid fa-filter text-primary-blue text-sm"></i> Filtros
          </h2>

          <div class="mb-8">
            <h3 class="font-bold text-xs uppercase text-gray-400 mb-4">Categorias</h3>
            <ul id="categories-sidebar" class="space-y-3"></ul>
          </div>

          <div class="border-t pt-6">
            <h3 class="font-bold text-xs uppercase text-gray-400 mb-4">Pesquisar na Categoria</h3>
            <div class="relative">
              <input type="text" id="search" placeholder="Buscar..."

      </aside>

      <section class="flex-1">
        <div class="flex flex-col sm:flex-row justify-between items-end sm:items-center mb-8 gap-4">
          <div>
            <nav class="flex text-xs text-gray-400 mb-2 gap-2" id="breadcrumb">
              <a href="index.html">Início</a><span>/</span><span class="text-gray-600">Categorias</span>

        </div>
      </section>
    </div>
  </main>

  <div id="main-footer"></div>

  <script src="./marketplace-core.js" defer></script>
  <script src="./marketplace-core_global_payments.js" defer></script>
  <script src="./product-card.js" defer></script>

  <script>
    (async function () {
      const $ = (id) => document.getElementById(id);

      window.__toNumberBR = window.__toNumberBR || function(v, fallback = 0) {
        try {
          if (v === null || v === undefined) return fallback;
          if (typeof v === 'number') return Number.isFinite(v) ? v : fallback;
          let s = String(v).trim();
          if (!s) return fallback;
          s = s.replace(/[R$\s]/g, '').replace(/[^0-9.,-]/g, '');
          const hasComma = s.includes(',');
          const hasDot = s.includes('.');
          if (hasComma && hasDot) s = s.replace(/\./g, '').replace(',', '.');
          else if (hasComma && !hasDot) s = s.replace(',', '.');
          const n = parseFloat(s);
          return Number.isFinite(n) ? n : fallback;
        } catch (_) { return fallback; }
      };

      let API_BASE = window.API_BASE || localStorage.getItem('API_BASE') || 'https://ariana-backend.onrender.com/api';
      window.API_BASE = API_BASE;
      window.API_ORIGIN = window.API_ORIGIN || String(API_BASE).replace(/\/api\/?$/i, '');

      let allProducts = [];
      let allCategories = [];
      let currentCategory = null;
      let currentParent = null;
      let currentSub = null;

      const formatCurrency = (v) =>
        new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(window.__toNumberBR(v, 0));

      const norm = (s) => String(s || '')
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, ' ')
        .trim();

      const slug = (s) => norm(s).replace(/\s+/g, '-');

      function escapeHtml(v) {
        return String(v ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function resolveImage(product) {
        const raw = product?.imageUrl || product?.mainImageUrl || product?.image || product?.imagem ||
          (Array.isArray(product?.images) ? (typeof product.images[0] === 'string' ? product.images[0] : product.images[0]?.url || product.images[0]?.imageUrl) : '') ||
          (Array.isArray(product?.imageUrls) ? product.imageUrls[0] : '') ||
          (Array.isArray(product?.imagePaths) ? product.imagePaths[0] : '');
        if (typeof window.resolveApiImageUrl === 'function') return window.resolveApiImageUrl(raw);
        if (!raw) return 'https://placehold.co/400x400?text=SEM+IMAGEM';
        if (/^(https?:|data:|blob:)/i.test(raw)) return raw;
        if (String(raw).startsWith('/')) return window.API_ORIGIN + raw;
        return window.API_ORIGIN + '/' + String(raw).replace(/^\.?\//, '');
      }

      function getPrice(p) {
        return window.__toNumberBR(p.price ?? p.preco ?? p.valor ?? p.salePrice ?? p.finalPrice ?? 0, 0);
      }

      function getOldPrice(p) {
        const n = window.__toNumberBR(p.oldPrice ?? p.precoAntigo ?? p.precoDe ?? p.compareAtPrice ?? p.originalPrice ?? p.listPrice, NaN);
        return Number.isFinite(n) && n > 0 ? n : null;
      }

      async function apiGet(path) {
        const url = `${String(API_BASE).replace(/\/+$/, '')}/${String(path).replace(/^\/+/, '')}`;
        const res = await fetch(url, { headers: { Accept: 'application/json' }, cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status} em ${path}`);
        return await res.json();
      }

      async function waitHelpers(maxMs = 3000) {
        const start = Date.now();
        while (Date.now() - start < maxMs) {
          if (typeof window.createProductCard === 'function') return true;
          await new Promise(r => setTimeout(r, 50));
        }
        return false;
      }

      async function fetchCategories() {
        const data = await apiGet('/categories');
        const items = Array.isArray(data) ? data : (data.items || data.categories || data.data || []);
        return items.map(c => ({
          ...c,
          id: String(c.id || c._id || '').trim(),
          name: c.name || c.nome || c.title || '',
          slug: c.slug || c.key || c.code || slug(c.name || c.nome || c.title || ''),
          parentId: String(c.parentId || c.parent || c.parent_id || '').trim()
        })).filter(c => c.id && c.active !== false);
      }

      async function fetchProducts() {
        const paths = ['/products', '/seller/products'];
        let last = [];
        for (const path of paths) {
          try {
            const data = await apiGet(path);
            const items = Array.isArray(data) ? data : (data.items || data.products || data.data || []);
            if (Array.isArray(items) && items.length) return items.filter(p => p && p.active !== false).map(p => ({ ...p, id: String(p.id || p._id || p.productId || '').trim() }));
            last = items || [];
          } catch (_) {}
        }
        return Array.isArray(last) ? last : [];
      }

      function isRoot(cat) {
        const p = String(cat?.parentId || '').trim().toLowerCase();
        return !p || p === 'null' || p === 'undefined' || p === '0' || p === 'root';
      }

      function findCategoryFromUrl(params) {
        const id = params.get('id') || params.get('categoryId');
        const wanted = params.get('slug') || params.get('categorySlug') || params.get('name') || params.get('category') || params.get('categoria');
        if (id) {
          const found = allCategories.find(c => String(c.id) === String(id) || String(c._id) === String(id));
          if (found) return found;
        }
        if (wanted) {
          const n = norm(wanted);
          const s = slug(wanted);
          return allCategories.find(c =>
            norm(c.name) === n || slug(c.name) === s || slug(c.slug) === s || norm(c.slug) === n || String(c.id) === String(wanted)
          ) || null;
        }
        return null;
      }

      function getChildren(parent) {
        if (!parent) return [];
        const pid = String(parent.id || parent._id || '').trim();
        const pslug = slug(parent.slug || parent.name);
        const pname = norm(parent.name);
        return allCategories.filter(c => {
          const cp = String(c.parentId || c.parent || c.parent_id || '').trim();
          return cp === pid || slug(cp) === pslug || norm(cp) === pname;
        });
      }

      function aliasTermsForCategory(cat, includeChildren = true) {
        const terms = new Set();
        const add = (v) => {
          const a = norm(v); const b = slug(v);
          if (a) terms.add(a);
          if (b) terms.add(b.replace(/-/g, ' '));
        };
        if (!cat) return terms;
        [cat.id, cat._id, cat.name, cat.nome, cat.slug, cat.key, cat.code].forEach(add);
        const name = norm(cat.name || cat.nome || cat.slug);
        const packs = {
          'smart tv': ['smart tv','smarttv','tv','televisor','televisores'],
          'smartphones': ['smartphones','smartphone','celular','celulares','telefone'],
          'celulares': ['smartphones','smartphone','celular','celulares','telefone'],
          'moveis': ['moveis','movel','móveis','móvel','guarda roupas','guarda roupa','sofa','sofas','cama','camas','cozinha','rack','painel','mesa','cadeira'],
          'eletrodomesticos': ['eletrodomesticos','eletro domesticos','geladeira','geladeiras','refrigerador','fogao','fogoes','microondas','micro ondas','maquina de lavar','lavadora'],
          'eletroportateis': ['eletroportateis','eletro portateis','air fryer','fritadeira','secador','ventilador','liquidificador','batedeira'],
          'informatica': ['informatica','notebook','computador','computadores','monitor','impressora'],
          'som e audio': ['som','audio','caixa de som','caixa som','speaker'],
          'caixa de som': ['som','audio','caixa de som','caixa som','speaker'],
          'beleza e saude': ['beleza','saude','maquina de corte','barbeador','secador','chapinha']
        };
        for (const [key, vals] of Object.entries(packs)) {
          if (name.includes(key) || key.includes(name)) vals.forEach(add);
        }
        if (includeChildren) getChildren(cat).forEach(ch => aliasTermsForCategory(ch, false).forEach(t => terms.add(t)));
        return terms;
      }

      function productSearchText(p) {
        const values = [
          p.id, p._id, p.sku, p.slug,
          p.name, p.nome, p.title, p.titulo,
          p.categoryId, p.category_id, p.categoriaId,
          p.categoryName, p.category, p.categoria,
          p.subcategoryId, p.subcategory_id,
          p.subcategoryName, p.subcategory, p.subcategoria,
          p.department, p.departamento,
          p.brand, p.marca,
          p.description, p.descricao
        ];
        return norm(values.filter(Boolean).join(' '));
      }

      function matchesCategory(p, cat) {
        if (!cat) return true;
        const text = productSearchText(p);
        const directIds = [p.categoryId, p.category_id, p.categoriaId, p.subcategoryId, p.subcategory_id].map(v => String(v || '').trim());
        const validIds = [cat.id, cat._id, ...getChildren(cat).map(c => c.id), ...getChildren(cat).map(c => c._id)].map(v => String(v || '').trim()).filter(Boolean);
        if (directIds.some(id => id && validIds.includes(id))) return true;
        const terms = aliasTermsForCategory(cat, true);
        for (const t of terms) {
          if (!t || t.length < 2) continue;
          if (text.includes(t)) return true;
        }
        return false;
      }

      function renderSidebar() {
        const sidebar = $('categories-sidebar');
        if (!sidebar) return;
        const roots = allCategories.filter(isRoot).sort((a,b) => String(a.name).localeCompare(String(b.name), 'pt-BR'));
        sidebar.innerHTML = roots.map(cat => {
          const active = currentParent && String(cat.id) === String(currentParent.id) && !currentSub;
          const children = getChildren(cat).sort((a,b) => String(a.name).localeCompare(String(b.name), 'pt-BR'));
          return `
            <li>
              <a href="categoria.html?id=${encodeURIComponent(cat.id)}"
                 class="block w-full text-left px-3 py-2 rounded-lg text-sm font-bold transition ${active ? 'bg-primary-blue text-white shadow' : 'bg-gray-50 text-gray-700 hover:bg-blue-50 hover:text-primary-blue'}">
                 ${escapeHtml(cat.name)}
              </a>
              ${children.length ? `<div class="mt-2 ml-3 space-y-1 border-l border-gray-200 pl-3">
                ${children.map(ch => {
                  const subActive = currentSub && String(ch.id) === String(currentSub.id);
                  return `<a href="categoria.html?id=${encodeURIComponent(ch.id)}" class="block px-2 py-1 rounded-md text-xs font-semibold ${subActive ? 'bg-blue-100 text-primary-blue' : 'text-gray-500 hover:text-primary-blue hover:bg-gray-50'}">${escapeHtml(ch.name)}</a>`;
                }).join('')}
              </div>` : ''}
            </li>`;
        }).join('');
      }

      function renderProducts(list) {
        const grid = $('product-grid');
        const empty = $('empty-state');
        if (!grid) return;
        grid.innerHTML = '';
        if (!list.length) {
          empty?.classList.remove('hidden');
          return;
        }
        empty?.classList.add('hidden');

        if (typeof window.createProductCard === 'function') {
          grid.innerHTML = list.map(p => window.createProductCard({
            ...p,
            id: p.id || p._id,
            imageUrl: resolveImage(p),
            mainImageUrl: resolveImage(p),
            image: resolveImage(p),
            imagem: resolveImage(p)
          })).join('');
          return;
        }

        grid.innerHTML = list.map(p => {
          const id = p.id || p._id || '';
          const name = p.name || p.nome || p.title || 'Produto';
          const full = getOldPrice(p) || getPrice(p);
          const pix = getPrice(p) || full;
          const off = full > pix ? Math.round((1 - pix / full) * 100) : 0;
          const inst = full / 12;
          return `<a href="produto.html?id=${encodeURIComponent(id)}" class="product-card">
            <div class="product-image-container">
              ${off ? `<div class="product-tag-container"><span class="product-tag tag-orange">-${off}% OFF</span></div>` : ''}
              <img src="${resolveImage(p)}" alt="${escapeHtml(name)}" loading="lazy">
            </div>
            <div class="product-card-body">
              <p class="product-name">${escapeHtml(name)}</p>
              <div class="mt-auto">
                ${full > pix ? `<p class="product-old-price">${formatCurrency(full)}</p>` : `<p class="product-old-price" style="opacity:0">.</p>`}
                <div class="product-price"><span class="currency">R$</span><span class="price-integer">${formatCurrency(pix).replace('R$','').trim()}</span><span class="cash-text">à vista</span></div>
                <p class="product-installments">ou 12x de ${formatCurrency(inst)} s/ juros</p>
                <p class="product-installments text-gray-400">Total parcelado: ${formatCurrency(full)}</p>
              </div>
            </div>
          </a>`;
        }).join('');
      }

      function applyFilters() {
        const term = norm($('search')?.value || '');
        const sort = $('sort')?.value || 'default';
        let filtered = allProducts.filter(p => matchesCategory(p, currentCategory));
        if (term) filtered = filtered.filter(p => productSearchText(p).includes(term));
        if (sort === 'price-asc') filtered.sort((a,b) => getPrice(a) - getPrice(b));
        if (sort === 'price-desc') filtered.sort((a,b) => getPrice(b) - getPrice(a));
        if (sort === 'name-asc') filtered.sort((a,b) => String(a.name || a.nome || '').localeCompare(String(b.name || b.nome || ''), 'pt-BR'));
        renderProducts(filtered);
      }

      function setTitles() {
        const title = $('category-title');
        const breadcrumb = $('breadcrumb');
        const label = currentSub?.name || currentParent?.name || currentCategory?.name || 'Categorias';
        if (title) title.textContent = label;
        if (breadcrumb) breadcrumb.innerHTML = `<a href="index.html">Início</a><span>/</span><span class="text-gray-600">${escapeHtml(label)}</span>`;
      }

      async function initCategoria() {
        try {
          $('loading')?.classList.remove('hidden');
          await waitHelpers();
          allCategories = await fetchCategories();
          allProducts = await fetchProducts();

          const params = new URLSearchParams(window.location.search);
          currentCategory = findCategoryFromUrl(params) || null;
          if (!currentCategory && allCategories.length) currentCategory = allCategories.find(isRoot) || allCategories[0];

          if (currentCategory) {
            currentSub = !isRoot(currentCategory) ? currentCategory : null;
            currentParent = currentSub ? allCategories.find(c => String(c.id) === String(currentSub.parentId)) : currentCategory;
          }

          renderSidebar();
          setTitles();
          $('loading')?.classList.add('hidden');
          applyFilters();
        } catch (err) {
          console.error('[categoria] erro ao carregar:', err);
          $('loading')?.classList.add('hidden');
          $('empty-state')?.classList.remove('hidden');
        }
      }

      $('search')?.addEventListener('input', applyFilters);
      $('sort')?.addEventListener('change', applyFilters);
      initCategoria();
    })();
  </script>

  <script src="js/header_auth_fix.js" defer></script>
  <script src="header.js" defer></script>
  <script>
    (function () {
      const tryInitHeader = () => {
        if (typeof window.carregarHeader !== 'function') {
          setTimeout(tryInitHeader, 60);
          return;
        }
        if (document.querySelector('header[data-ariana="1"]')) return;

        try {
          window.carregarHeader();
          const h = document.querySelector('header');
          if (h) h.setAttribute('data-ariana', '1');
        } catch (e) {
          console.error("[page] erro ao carregar header:", e);
        }
      };

      tryInitHeader();
      document.addEventListener('DOMContentLoaded', tryInitHeader);
      window.addEventListener('load', tryInitHeader);
      window.addEventListener('pageshow', tryInitHeader);
      window.addEventListener('marketplace:helpers-ready', tryInitHeader);
    })();
  </script>

  <script src="footer.js" defer></script>

  <script>
    (function(){
      try {
        if (typeof loadRecommendations === 'function') {
          loadRecommendations();
        }
      } catch(e){
        console.error('[produto] erro ao carregar recomendações:', e);
      }
    })();
  </script>

  <script>
    (function () {
      if (typeof window.bindHeaderAuthListener === 'function') return;
      window.bindHeaderAuthListener = function (auth) {
        try {
          if (!auth || typeof auth.onAuthStateChanged !== 'function') return;
          auth.onAuthStateChanged(function (user) {
            try { if (typeof window.updateClientHeaderUI === 'function') window.updateClientHeaderUI(user); } catch (e) {}
            try { if (typeof window.loadClientAddress === 'function') window.loadClientAddress(user); } catch (e) {}
          });
        } catch (e) {
          console.error('[header_auth_inline] erro:', e);
        }
      };
    })();
  </script>
