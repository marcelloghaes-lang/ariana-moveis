<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Completo | ARIANA MOVEIS</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="https://placehold.co/16x16/2E6DA4/ffffff?text=AM" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link rel="icon" type="image/png" href="./favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'primary-blue': '#2E6DA4', 
                        'dark-bg': '#1D2B3A', 
                        'secondary-light-blue': '#56B5FF', 
                        'text-dark': '#333333',
                        'fundo-claro': '#F5F7FA',
                        'dark-gray-bg': '#222222', 
                        'error-red': '#D32F2F',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                },
            },
        }
    </script>

    <style>
        .page-container { max-width: 1300px; }
        .product-card {
            background-color: white;
            border-radius: 4px;
            border: 1px solid #e7e7e7;
            box-shadow: none;
            transition: transform 0.3s, box-shadow 0.3s;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            padding: 10px;
            height: 100%;
        }
        .product-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); }
        .product-image-container {
            width: 100%;
            height: 180px;
            position: relative;
            overflow: hidden;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .product-image-container img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            transition: none;
        }
        .product-card-body {
            padding: 0;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .product-name {
            font-size: 0.85rem;
            font-weight: 400;
            color: #444;
            height: 3em;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-bottom: 10px;
        }
        .product-old-price {
            font-size: 0.8rem;
            color: #999;
            text-decoration: line-through;
            font-weight: 400;
            line-height: 1.2;
        }
        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: #333;
            margin-top: 2px;
            display: flex;
            align-items: flex-end;
            line-height: 1;
        }
        .product-price .currency { font-size: 0.7em; font-weight: 400; align-self: flex-start; }
        .product-price .price-integer { font-size: 1.0em; font-weight: 700; margin-left: 2px; }
        .product-price .decimal-part { font-size: 0.7em; font-weight: 400; }
        .product-price .cash-text { font-size: 0.75rem; font-weight: 400; color: #555; margin-left: 5px; padding-bottom: 1px; }
        .product-installments { font-size: 0.75rem; color: #777; margin-top: 5px; line-height: 1.4; }
        .product-tag-container { position: absolute; top: 5px; left: 5px; z-index: 10; display: flex; flex-direction: column; gap: 5px; }
        .product-tag { color: white; font-size: 0.75rem; font-weight: 600; padding: 2px 5px; border-radius: 2px; display: block; width: fit-content; line-height: 1; }
        .tag-orange { background-color: #ff931e; }
        .product-card-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    </style>

<script>
(function () {
  window.API_BASE =
    window.API_BASE ||
    localStorage.getItem("API_BASE") ||
    "https://ariana-backend.onrender.com/api";

  window.API_ORIGIN =
    window.API_ORIGIN ||
    String(window.API_BASE).replace(/\/api\/?$/i, "");

  try {
    localStorage.setItem("API_BASE", window.API_BASE);
    localStorage.setItem("API_BASE_URL", window.API_BASE);
  } catch(_e) {}

  window.resolveApiImageUrl = window.resolveApiImageUrl || function(value){
    const raw = String(value || '').trim();
    if (!raw || raw.includes('${')) return 'https://placehold.co/400x400?text=SEM+IMAGEM';
    if (/^https?:\/\//i.test(raw) || /^data:/i.test(raw)) return raw;
    if (raw.startsWith('/')) return window.API_ORIGIN + raw;
    return window.API_ORIGIN + '/' + raw.replace(/^\.?\//, '');
  };

  const origFetch = window.fetch ? window.fetch.bind(window) : null;
  if (origFetch && !window.__ARIANA_FETCH_PATCH__) {
    window.__ARIANA_FETCH_PATCH__ = true;
    window.fetch = function(input, init){
      let url = typeof input === "string" ? input : (input && input.url ? input.url : "");
      if (url) {
        url = url
          .replace("https://ariana-move-mongo.onrender.com/api", window.API_BASE)
          .replace("https://southamerica-east1-ariana-moveis-final.cloudfunctions.net/api", window.API_BASE);

        if (typeof input === "string") input = url;
        else if (input instanceof Request) input = new Request(url, input);
      }
      return origFetch(input, init);
    };
  }
})();
</script>
</head>
<body class="bg-fundo-claro min-h-screen">

    <main class="flex-grow page-container mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <h2 id="search-results-header" class="text-3xl font-extrabold text-text-dark mb-6 mt-4 border-b pb-2 border-gray-300">
            Catálogo Completo de Produtos
        </h2>

        <div id="loading-container" class="text-center p-10 bg-white rounded-xl shadow-lg mb-8 hidden">
            <i class="fas fa-spinner fa-spin text-primary-blue text-4xl mb-4"></i>
            <p class="text-lg text-gray-600">Carregando nosso catálogo completo, aguarde...</p>
        </div>

        <div id="featured-product-grid" class="grid gap-6 product-card-grid"></div>

    </main>

<script src="./marketplace-core.js"></script>
<script src="./marketplace-core_global_payments.js"></script>
<script src="./product-card.js"></script>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const API_BASE = window.API_BASE;

  window.formatCurrency = window.formatCurrency || function(value) {
    if (value === null || value === undefined) return 'R$ 0,00';
    const num = parseFloat(value);
    if (isNaN(num)) return 'R$ 0,00';
    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(num);
  };

  window.__toNumberBR = window.__toNumberBR || function(v, fallback = 0){
    try{
      if (v === null || v === undefined) return fallback;
      if (typeof v === 'number') return Number.isFinite(v) ? v : fallback;
      let s = String(v).trim();
      if (!s) return fallback;
      s = s.replace(/[R$\s]/g, '').replace(/[^0-9.,-]/g,'');
      const hasComma = s.includes(',');
      const hasDot = s.includes('.');
      if (hasComma && hasDot){
        s = s.replace(/\./g,'').replace(',', '.');
      } else if (hasComma && !hasDot){
        s = s.replace(',', '.');
      }
      const n = parseFloat(s);
      return Number.isFinite(n) ? n : fallback;
    }catch(_e){
      return fallback;
    }
  };

  window.formatPriceParts = window.formatPriceParts || function(value) {
    if (value === null || value === undefined || isNaN(parseFloat(value))) {
      return { symbol: 'R$', integer: '0', decimal: '00' };
    }
    const formatted = window.formatCurrency(value);
    const numericString = formatted.replace('R$', '').replace(/\./g, '').trim();
    const idx = numericString.lastIndexOf(',');
    let integerPart = numericString;
    let decimalPart = '00';
    if (idx !== -1) {
      integerPart = numericString.substring(0, idx);
      decimalPart = numericString.substring(idx + 1).padEnd(2, '0').substring(0, 2);
    }
    if (integerPart === '') integerPart = '0';
    return { symbol: 'R$', integer: integerPart, decimal: decimalPart };
  };

  const normalizeListResponse = (data) => {
    if (Array.isArray(data)) return data;
    if (data && Array.isArray(data.items)) return data.items;
    if (data && Array.isArray(data.products)) return data.products;
    if (data && Array.isArray(data.results)) return data.results;
    if (data && Array.isArray(data.docs)) return data.docs;
    if (data && Array.isArray(data.data)) return data.data;
    return [];
  };

  async function apiRequest(path, opts = {}) {
    const normalizedPath = `${String(path).startsWith('/') ? '' : '/'}${path}`;

    const headers = { ...(opts.headers || {}) };
    if (!(opts.body instanceof FormData) && !headers['Content-Type']) {
      headers['Content-Type'] = 'application/json';
    }

    const url = `${String(API_BASE).replace(/\/+$/, '')}${normalizedPath}`;
    const res = await fetch(url, { ...opts, headers });
    const ct = res.headers.get('content-type') || '';
    const data = ct.includes('application/json')
      ? await res.json().catch(() => null)
      : await res.text().catch(() => null);

    if (!res.ok) {
      const msg = (data && typeof data === 'object' && (data.message || data.error))
        ? (data.message || data.error)
        : `HTTP ${res.status}`;
      throw new Error(msg);
    }

    return data;
  }

  const getSectionConfigFromUrl = () => {
    const urlParams = new URLSearchParams(window.location.search);
    const section = (urlParams.get('section') || '').toLowerCase().trim();
    const map = {
      offers: { title: '🔥 Ofertas Imperdíveis', predicate: (p) => p.isOffer === true || (Array.isArray(p.homeSections) && p.homeSections.includes('offers')) },
      best_sellers: { title: '⭐ Queridinhos / Mais Vendidos', predicate: (p) => p.isBestSeller === true || (Array.isArray(p.homeSections) && p.homeSections.includes('best_sellers')) },
      new_arrivals: { title: '⚡ Lançamentos', predicate: (p) => p.isNew === true || p.isNewArrival === true || (Array.isArray(p.homeSections) && p.homeSections.includes('new_arrivals')) },
      recommended: { title: '👍 Recomendados para Você', predicate: (p) => p.isRecommended === true || (Array.isArray(p.homeSections) && p.homeSections.includes('recommended')) },
      featured: { title: '🏆 Destaques', predicate: (p) => p.isFeatured === true || p.isHighlight === true || (Array.isArray(p.homeSections) && p.homeSections.includes('featured')) },
    };
    return map[section] ? { key: section, ...map[section] } : null;
  };

  const getNormalizedProductImage = (product) => {
    return window.resolveApiImageUrl(
      product?.imageUrl ||
      product?.mainImageUrl ||
      product?.image ||
      product?.imagem ||
      (Array.isArray(product?.images)
        ? (typeof product.images[0] === 'string'
            ? product.images[0]
            : product.images[0]?.url)
        : '') ||
      (Array.isArray(product?.imagePaths) ? product.imagePaths[0] : '') ||
      (Array.isArray(product?.imageUrls) ? product.imageUrls[0] : '')
    );
  };

  const loadCartCounterSafe = () => {
    if (typeof window.loadCartCounter === 'function') {
      try { window.loadCartCounter(); return; } catch (_) {}
    }
  };

  const renderProductCards = (products, gridId) => {
    const gridContainer = $(gridId);
    if (!gridContainer) return;
    gridContainer.innerHTML = '';
    if (!products || products.length === 0) {
      gridContainer.innerHTML = '<p class="col-span-full text-center text-lg text-gray-500 py-10">Nenhum produto encontrado no catálogo.</p>';
      return;
    }

    if (typeof window.createProductCard === 'function') {
      gridContainer.innerHTML = products.map(p => window.createProductCard(p)).join('');
      return;
    }

    gridContainer.innerHTML = products.map((p) => {
      const priceParts = window.formatPriceParts(p.price || 0);
      return `
        <a href="produto.html?id=${encodeURIComponent(p.id)}" class="product-card">
          <div class="product-image-container">
            <img src="${p.imageUrl || 'https://placehold.co/400x400/CCCCCC/333333?text=SEM+IMAGEM'}" alt="${String(p.name || '').replace(/"/g,'&quot;')}" loading="lazy" decoding="async">
          </div>
          <div class="product-card-body">
            <p class="product-name">${p.name || 'Produto'}</p>
            <div class="mt-auto">
              <p class="product-old-price opacity-0 text-transparent">.</p>
              <div class="product-price">
                <span class="currency">${priceParts.symbol}</span>
                <span class="price-integer">${priceParts.integer}</span>
                <span class="decimal-part">,${priceParts.decimal}</span>
                <span class="cash-text">à vista</span>
              </div>
              <p class="product-installments">em até 12x</p>
            </div>
          </div>
        </a>`;
    }).join('');
  };

  const normalizeSearchTextLocal = (value) => String(value || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  const productSearchText = (product) => normalizeSearchTextLocal([
    product?.name, product?.nome, product?.title, product?.titulo,
    product?.category, product?.categoria, product?.categoryName, product?.categorySlug, product?.categoryId,
    product?.subcategory, product?.subcategoria, product?.subcategoryName, product?.subcategorySlug, product?.subcategoryId,
    product?.description, product?.descricao, product?.brand, product?.marca, product?.sku
  ].filter(Boolean).join(' '));

  const applyCatalogSearchFilter = (eventOrQuery = null) => {
    if (eventOrQuery && typeof eventOrQuery.preventDefault === 'function') eventOrQuery.preventDefault();

    const externalQuery = (typeof eventOrQuery === 'string') ? eventOrQuery : null;
    const desktop = document.getElementById('search-input-desktop');
    const mobile = document.getElementById('search-input-mobile');
    const rawQuery = externalQuery !== null ? externalQuery : (desktop?.value || mobile?.value || '');
    const queryText = normalizeSearchTextLocal(rawQuery);

    const headerEl = $('search-results-header');
    const sectionCfg2 = getSectionConfigFromUrl();
    const sourceList = (window.__BASE_PRODUCTS__ && window.__BASE_PRODUCTS__.length) ? window.__BASE_PRODUCTS__ : (window.__ALL_PRODUCTS__ || []);

    if (!queryText) {
      renderProductCards(sourceList, 'featured-product-grid');
      if (headerEl) headerEl.textContent = sectionCfg2 ? sectionCfg2.title : 'Catálogo Completo de Produtos';
      return;
    }

    const words = queryText.split(' ').filter(Boolean);
    const filteredProducts = sourceList.filter(product => {
      const haystack = productSearchText(product);
      return words.every(w => haystack.includes(w));
    });

    renderProductCards(filteredProducts, 'featured-product-grid');
    if (headerEl) headerEl.textContent = sectionCfg2 ? `${sectionCfg2.title} — Busca: "${rawQuery}"` : `Resultados da Busca por "${rawQuery}"`;
  };

  const setupSearchListeners = () => {
    const searchInputDesktop = document.getElementById('search-input-desktop');
    const searchInputMobile = document.getElementById('search-input-mobile');

    const params = new URLSearchParams(window.location.search);
    const q = params.get('q') || params.get('query') || params.get('busca') || '';
    if (q) {
      if (searchInputDesktop) searchInputDesktop.value = q;
      if (searchInputMobile) searchInputMobile.value = q;
    }

    let throttleTimer;
    const handleInput = () => {
      clearTimeout(throttleTimer);
      throttleTimer = setTimeout(() => applyCatalogSearchFilter(null), 220);
    };
    searchInputDesktop?.addEventListener('input', handleInput);
    searchInputMobile?.addEventListener('input', handleInput);
  };

  const loadProducts = async () => {
    const loadingContainer = $('loading-container');
    const productGrid = $('featured-product-grid');

    try {
      if (loadingContainer) loadingContainer.classList.remove('hidden');

      try {
        if (typeof window.getPaymentSettings === 'function') await window.getPaymentSettings();
      } catch (_) {}

      const endpoints = ['/products', '/seller/products', '/home/index-data'];
      let allProducts = [];

      for (const endpoint of endpoints) {
        try {
          const data = await apiRequest(endpoint);
          const items = normalizeListResponse(endpoint === '/home/index-data' && data && data.products ? data.products : data);
          if (items.length) {
            allProducts = items.map(item => {
              const price = item.preco ?? item.price ?? item.valor ?? 0;
              const baseProduct = {
                ...item,
                id: item.id || item._id,
                name: item.nome || item.name || 'Produto Sem Nome',
                price,
                oldPrice: item.precoAntigo || item.oldPrice || null,
                category: item.category || item.categoria || item.categoryName || 'Geral',
                description: item.description || item.descricao || '',
                imageUrl: getNormalizedProductImage(item),
                isOffer: item.isOffer === true,
                isBestSeller: item.isBestSeller === true,
                isNew: item.isNew === true,
                isNewArrival: item.isNewArrival === true,
                isRecommended: item.isRecommended === true,
                isFeatured: item.isFeatured === true,
                isHighlight: item.isHighlight === true,
                homeSections: item.homeSections || []
              };
              return (typeof window.decorateProductWithPayments === 'function')
                ? (window.decorateProductWithPayments(baseProduct) || baseProduct)
                : baseProduct;
            });
            break;
          }
        } catch (_) {}
      }

      if (!allProducts.length) throw new Error('Nenhum produto retornado pela API.');

      window.__ALL_PRODUCTS__ = allProducts;

      const sectionCfg = getSectionConfigFromUrl();
      const baseProducts = sectionCfg ? allProducts.filter(sectionCfg.predicate) : [...allProducts];
      window.__BASE_PRODUCTS__ = baseProducts;

      const header = $('search-results-header');
      if (header) header.textContent = sectionCfg ? sectionCfg.title : 'Catálogo Completo de Produtos';

      const urlParams = new URLSearchParams(window.location.search);
      const queryFromUrl = urlParams.get('q');
      if (queryFromUrl) {
        const decodedQuery = decodeURIComponent(queryFromUrl).trim();
        const d = document.getElementById('search-input-desktop');
        const m = document.getElementById('search-input-mobile');
        if (d) d.value = decodedQuery;
        if (m) m.value = decodedQuery;
        applyCatalogSearchFilter(decodedQuery);
      } else {
        renderProductCards(baseProducts, 'featured-product-grid');
      }
    } catch (error) {
      console.error("Erro ao carregar produtos:", error);
      if (productGrid) productGrid.innerHTML = `<p class="col-span-full text-center text-lg text-red-600 py-10">❌ Erro ao carregar produtos: ${error.message}</p>`;
    } finally {
      if (loadingContainer) loadingContainer.classList.add('hidden');
    }
  };

  document.addEventListener('DOMContentLoaded', async () => {
    loadCartCounterSafe();
    setupSearchListeners();
    await loadProducts();
  });
})();
</script>

<script src="./header.js"></script>
<script>
(function () {
  const tryInit = () => {
    if (typeof window.carregarHeader !== 'function') return setTimeout(tryInit, 60);
    if (!document.querySelector('header[data-ariana="1"]')) {
      try { window.carregarHeader(); } catch(e){ console.error('[todos_produtos] header erro:', e); }
      const h = document.querySelector('header');
      if (h) h.setAttribute('data-ariana','1');
    }
  };
  tryInit();
})();
</script>
<script src="footer.js"></script>
<script src="js/layout-fit.js" defer></script>
