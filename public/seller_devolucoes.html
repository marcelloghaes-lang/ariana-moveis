<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Devoluções | ARIANA MÓVEIS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'primary-blue': '#2E6DA4',
            'dark-bg': '#1D2B3A',
            'fundo-claro': '#F5F7FA',
            'dark-gray-bg': '#222222',
            'error-red': '#ef4444',
            'success-green': '#10b981',
          }
        }
      }
    }
  </script>
  <style>
    :root { --primary:#2E6DA4; --dark:#1D2B3A; --bg:#F5F7FA; --success:#10b981; --danger:#ef4444; }
    body { font-family: Inter, sans-serif; background: var(--bg); }
    .bg-primary-blue{background:var(--primary)} .text-primary-blue{color:var(--primary)} .bg-dark-bg{background:var(--dark)}
    .text-dark-bg{color:var(--dark)} .bg-fundo-claro{background:var(--bg)} .bg-success-green{background:var(--success)}
    .bg-error-red{background:var(--danger)} .border-soft{border-color:#e5e7eb} .card{background:#fff;border:1px solid #e5e7eb;border-radius:1.25rem;box-shadow:0 8px 24px rgba(15,23,42,.06)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:1rem;padding:.85rem 1.2rem;font-weight:800;transition:.2s}
    .btn-primary{background:var(--primary);color:#fff} .btn-primary:hover{opacity:.95} .btn-light{background:#fff;color:var(--dark);border:1px solid #e5e7eb}
    .pill{display:inline-flex;align-items:center;padding:.35rem .75rem;border-radius:9999px;font-size:.75rem;font-weight:800}
    #toast-container{position:fixed;right:1rem;top:1rem;z-index:80;display:flex;flex-direction:column;gap:.75rem}
    .sidebar-link{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;border-radius:.9rem;color:#fff;opacity:.95}
    .sidebar-link:hover,.sidebar-link.active{background:rgba(255,255,255,.08)}
    .muted{color:#64748b} .page-main{flex:1;overflow:auto;padding:1.5rem} @media (max-width:767px){ .page-main{padding:1rem} }
  </style>
</head>
<body class="bg-fundo-claro min-h-screen flex">
<div id="toast-container"></div>

<aside id="sidebar" class="bg-dark-bg w-64 min-h-screen space-y-6 py-7 px-3 absolute inset-y-0 left-0 transform -translate-x-full md:translate-x-0 md:relative transition z-40">
  <nav class="flex flex-col space-y-2">
            <a href="seller_dashboard.html" class="flex items-center space-x-2 py-2.5 px-4 rounded transition duration-200 bg-dark-gray-bg text-white"><i class="fas fa-home"></i><span>Dashboard</span></a>
            <a href="seller_produtos.html" class="flex items-center space-x-2 py-2.5 px-4 rounded transition duration-200 hover:bg-dark-gray-bg text-white"><i class="fas fa-box"></i><span>Meus Produtos</span></a>
            <a href="seller_produto_novo.html" class="flex items-center space-x-2 py-2.5 px-4 rounded transition duration-200 hover:bg-dark-gray-bg text-white"><i class="fas fa-plus-circle"></i><span>Cadastrar Produto</span></a>
            <a href="seller_produto_editar.html" class="flex items-center space-x-2 py-2.5 px-4 rounded transition duration-200 hover:bg-dark-gray-bg text-white"><i class="fas fa-edit"></i><span>Editar Produto</span></a>
            <a href="seller_pedidos.html" class="flex items-center space-x-2 py-2.5 px-4 rounded transition duration-200 hover:bg-dark-gray-bg text-white"><i class="fas fa-shopping-cart"></i><span>Pedidos</span></a>
            <a href="seller_vendas.html" class="flex items-center space-x-2 py-2.5 px-4 rounded transition duration-200 hover:bg-dark-gray-bg text-white"><i class="fas fa-chart-line"></i><span>Vendas</span></a>
            <a href="seller_notificacoes.html" class="flex items-center space-x-2 py-2.5 px-4 rounded transition duration-200 hover:bg-dark-gray-bg text-white"><i class="fas fa-bell"></i><span>Notificações</span></a>
            <a href="seller_mercadopago.html" class="flex items-center space-x-2 py-2.5 px-4 rounded transition duration-200 hover:bg-dark-gray-bg text-white"><i class="fas fa-credit-card"></i><span>Mercado Pago</span></a>
            <a href="seller_configuracoes.html" class="flex items-center space-x-2 py-2.5 px-4 rounded transition duration-200 hover:bg-dark-gray-bg text-white"><i class="fas fa-cog"></i><span>Configurações</span></a>
            <a href="seller_devolucoes.html" class="flex items-center space-x-2 py-2.5 px-4 rounded transition duration-200 hover:bg-dark-gray-bg text-white"><i class="fas fa-exchange-alt"></i><span>Devoluções</span></a>
            <a href="seller_extrato.html" class="flex items-center space-x-2 py-2.5 px-4 rounded transition duration-200 hover:bg-dark-gray-bg text-white"><i class="fas fa-receipt"></i><span>Extrato</span></a>
            <a href="#" id="btn-sair" class="flex items-center space-x-2 py-2.5 px-4 rounded transition duration-200 hover:bg-dark-gray-bg text-red-400 mt-auto"><i class="fas fa-sign-out-alt"></i><span>Sair</span></a>
        </nav>
</aside>

<div class="flex-1 flex flex-col min-w-0">
  <header class="bg-white border-b border-soft shadow-sm px-4 py-3 md:p-4">
    <div class="flex items-center gap-3 min-w-0">
      <button id="sidebar-toggle" class="shrink-0 w-10 h-10 rounded-xl flex items-center justify-center text-gray-500 md:hidden hover:bg-slate-100" aria-label="Abrir menu">
        <i class="fas fa-bars text-xl"></i>
      </button>

      <h1 class="flex-1 min-w-0 text-lg md:text-xl font-black text-dark-bg uppercase tracking-tight truncate">
        Devoluções
      </h1>

      <i class="shrink-0 fas fa-user-circle text-3xl text-primary-blue"></i>
    </div>

    <div class="mt-2 md:mt-0 md:absolute md:right-4 md:top-4 flex md:block">
      <span id="user-display-name" class="block w-full text-xs md:text-sm font-black text-gray-700 truncate text-right md:text-left">
        Bem-vindo, Seller!
      </span>
    </div>
  </header>

  <main class="page-main">
    <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4 mb-6">
      <div class="min-w-0">
        <h2 class="text-3xl md:text-3xl font-black text-dark-bg uppercase tracking-tight leading-tight">Central de devoluções</h2>
        <p class="muted mt-2 text-base md:text-lg font-medium leading-relaxed">Gerencie as solicitações de troca e devolução dos seus clientes.</p>
      </div>
      <button id="btn-refresh-returns" class="btn btn-primary shadow-lg w-full sm:w-auto"><i class="fas fa-rotate"></i> Atualizar lista</button>
    </div>

    <div id="returns-list" class="space-y-4">
      <div class="card p-10 text-center muted font-bold">Sincronizando com MongoDB...</div>
    </div>
  </main>
</div>


<script>
const IS_LOCAL_HOST = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost";
const API_BASE = IS_LOCAL_HOST ? "http://localhost:3000/api" : "https://ariana-backend.onrender.com/api";
const byId = (id) => document.getElementById(id);
const $ = byId;

function getSellerToken() {
  return localStorage.getItem("seller_token") || "";
}
function getSellerProfile() {
  try { return JSON.parse(localStorage.getItem("seller_profile") || "{}") || {}; } catch(_) { return {}; }
}
function clearSellerSession() {
  localStorage.removeItem("seller_token");
  localStorage.removeItem("seller_profile");
  localStorage.removeItem("partner_request_id");
}
function authHeaders(extra = {}) {
  const token = getSellerToken();
  return token ? { ...extra, Authorization: `Bearer ${token}` } : { ...extra };
}
function ensureSellerSession() {
  if (!getSellerToken()) {
    window.location.href = "seller_login.html";
    return false;
  }
  return true;
}
function applySellerHeaderName(profile = getSellerProfile()) {
  const el = $("user-display-name");
  if (el) el.textContent = `Bem-vindo, ${profile.factoryName || profile.storeName || profile.displayName || profile.name || "Seller"}!`;
}
function resolveReturns(payload) {
  if (Array.isArray(payload)) return payload;
  return payload.items || payload.results || payload.docs || payload.returns || payload.orders || [];
}
function orderIdOf(order) {
  return String(order._id || order.id || order.orderId || order.pedidoId || "");
}
function reasonOf(order) {
  return order.returnReason || order.reason || order.motivo || order.metadata?.returnReason || "O cliente solicitou a devolução deste produto através da central de ajuda.";
}
async function loadReturns() {
  if (!ensureSellerSession()) return;
  applySellerHeaderName();
  const list = $("returns-list");
  list.innerHTML = '<div class="card p-10 text-center muted font-bold">Sincronizando com MongoDB...</div>';
  try {
    const res = await fetch(`${API_BASE}/seller/returns`, { headers: authHeaders() });
    if (res.status === 401 || res.status === 403) {
      clearSellerSession();
      window.location.href = "seller_login.html";
      return;
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data?.error || data?.message || `Erro ${res.status}`);

    const orders = resolveReturns(data);
    if (!orders.length) {
      list.innerHTML = '<div class="card p-10 text-center muted font-bold">Nenhuma devolução ou troca pendente.</div>';
      return;
    }

    list.innerHTML = orders.map((o) => {
      const oid = orderIdOf(o);
      const date = o.updatedAt || o.createdAt || o.date || null;
      return `
        <div class="card p-6 animate-fade border-l-4 border-primary-blue">
          <div class="flex items-center justify-between gap-3 flex-wrap">
            <div>
              <div class="font-black text-dark-bg text-lg">Pedido #${String(oid || "---").slice(-8).toUpperCase()}</div>
              <div class="muted text-xs mt-1 font-bold italic">${date ? new Date(date).toLocaleString("pt-BR") : ""}</div>
            </div>
            <div class="flex items-center gap-2">
              <span class="pill bg-amber-100 text-amber-700 uppercase font-black text-[10px]">${o.statusLabel || o.status || "Aguardando análise"}</span>
              ${oid ? `<a href="seller_pedido_detalhe.html?id=${oid}" class="btn btn-light !py-2 !px-3 shadow-sm hover:bg-gray-50"><i class="fas fa-eye text-primary-blue"></i></a>` : ""}
            </div>
          </div>
          <div class="mt-4 p-4 bg-gray-50 rounded-2xl border border-gray-100 text-sm text-gray-700 italic">
            <i class="fas fa-comment-alt mr-2 text-primary-blue"></i>
            "${reasonOf(o)}"
          </div>
        </div>
      `;
    }).join("");
  } catch (e) {
    console.error("Erro ao carregar devoluções:", e);
    list.innerHTML = `<div class="card p-10 text-center text-red-500 font-bold">${e.message || "Erro de conexão com o servidor."}</div>`;
  }
}
document.addEventListener("DOMContentLoaded", () => {
  loadReturns();
  $("btn-refresh-returns")?.addEventListener("click", loadReturns);
  $("sidebar-toggle")?.addEventListener("click", () => $("sidebar").classList.toggle("-translate-x-full"));
  $("btn-sair")?.addEventListener("click", (e) => {
    e.preventDefault();
    clearSellerSession();
    window.location.href = "seller_login.html";
  });
});
</script>
</body>
</html>
