<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pedidos | Ariana ERP</title><style>
:root{--blue:#0646a5;--bg:#f4f6f9;--card:#fff;--line:#dce3ec;--text:#172033;--muted:#6c788c;--green:#11845b;--red:#c83f49;--amber:#b97000;--shadow:0 8px 24px rgba(23,32,51,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:20}.top h1{margin:0;font-size:18px}.top a{text-decoration:none;color:var(--blue);font-weight:850}.wrap{max-width:1450px;margin:auto;padding:18px}.tools{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;gap:9px;flex-wrap:wrap;box-shadow:var(--shadow);margin-bottom:13px}.tools input{flex:1;min-width:240px}.tools input,.tools select{border:1px solid #cfd8e5;border-radius:9px;padding:10px}.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:850;cursor:pointer}.blue{background:var(--blue);color:#fff}.outline{background:#fff;border:1px solid #bdc9d9;color:var(--blue)}.danger{background:#fff0f1;color:var(--red)}.green{background:#eaf8f2;color:var(--green)}.tablebox{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:900px}th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#778296;text-align:left;background:#fafbfd;padding:11px 12px;border-bottom:1px solid var(--line)}td{padding:12px;border-bottom:1px solid #edf0f5;vertical-align:middle}.code{font-weight:950;color:var(--blue)}.muted{color:var(--muted);font-size:12px}.status{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900;background:#edf2f8;color:#536075}.status.faturado{background:#eaf8f2;color:var(--green)}.status.cancelado,.status.estornado{background:#fff0f1;color:var(--red)}.status.orcamento{background:#fff6df;color:var(--amber)}.row-actions{display:flex;gap:5px;flex-wrap:wrap}.row-actions button{border:0;border-radius:7px;padding:7px 8px;font-size:11px;font-weight:850;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:35px}.pager{display:flex;justify-content:space-between;align-items:center;padding:13px;background:#fff}.modal{position:fixed;inset:0;background:rgba(8,25,48,.5);display:grid;place-items:center;padding:15px;z-index:80}.modal.hidden,.toast.hidden{display:none}.dialog{width:min(820px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:15px;box-shadow:0 24px 80px rgba(0,0,0,.23)}.dialog-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff}.dialog-body{padding:17px}.x{border:0;background:#eef2f7;width:34px;height:34px;border-radius:9px;cursor:pointer}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.info div{background:#f8fafc;border:1px solid #e6ebf1;border-radius:10px;padding:10px}.info small{display:block;color:var(--muted);margin-bottom:4px}.items{width:100%;min-width:0}.items th,.items td{padding:8px}.timeline{margin-top:15px;border-left:2px solid #d9e4f4;padding-left:12px}.event{margin:0 0 10px}.event b{display:block;font-size:12px}.event small{color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 15px;border-radius:10px;z-index:99}.auth{max-width:550px;margin:70px auto;background:#fff;padding:24px;border:1px solid var(--line);border-radius:14px;text-align:center}.auth.hidden{display:none}@media(max-width:700px){.wrap{padding:10px}.info{grid-template-columns:1fr}.tools{display:grid;grid-template-columns:1fr}.tools input{min-width:0}.top span{display:none}}
</style></head><body>
<header class="top"><div><h1>Pedidos e Vendas</h1><span class="muted">Ariana ERP Lite</span></div><div><a href="erp_nova_venda.html">＋ Nova venda</a> &nbsp; <a href="erp_ariana.html">← Central</a></div></header>
<div class="auth hidden" id="auth"><h2>Login necessário</h2><p>Entre no painel administrativo para acessar os pedidos do ERP.</p><a href="admin_painel.html">Abrir painel</a></div>
<main class="wrap" id="app"><div class="tools"><input id="search" placeholder="Buscar por cliente, CPF, telefone, código, produto ou SKU"><select id="status"><option value="all">Todos os status</option><option value="orcamento">Orçamento</option><option value="pedido">Pedido</option><option value="venda">Venda</option><option value="faturado">Faturado</option><option value="estornado">Estornado</option><option value="cancelado">Cancelado</option></select><button class="btn blue" id="refresh">Atualizar</button></div>
<div class="tablebox"><table><thead><tr><th>Código</th><th>Data</th><th>Cliente</th><th>Status</th><th>Pagamento</th><th>Total</th><th>Ações</th></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty">Carregando…</div><div class="pager"><button class="btn outline" id="prev">← Anterior</button><span id="pageinfo" class="muted"></span><button class="btn outline" id="next">Próxima →</button></div></div></main>
<div class="modal hidden" id="modal"><div class="dialog"><div class="dialog-head"><strong id="modal-title">Detalhes</strong><button class="x" id="close">×</button></div><div class="dialog-body" id="modal-body"></div></div></div><div class="toast hidden" id="toast"></div>
<script>
const API_LOCAL='http://localhost:3000/api',API_RENDER='https://ariana-backend.onrender.com/api',IS_LOCAL=location.hostname==='localhost'||location.hostname==='127.0.0.1',API=(localStorage.getItem('API_BASE')||(IS_LOCAL?API_LOCAL:API_RENDER)).replace(/\/$/,'');const $=id=>document.getElementById(id);let page=1,pages=1,rows=[],timer=null;
function token(){const t=localStorage.getItem('admin_token')||localStorage.getItem('auth_token')||localStorage.getItem('token')||'';if(t)return t;try{return JSON.parse(localStorage.getItem('banner_admin_session')||'null')?.token||''}catch{return''}}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(m){$('toast').textContent=m;$('toast').classList.remove('hidden');clearTimeout(window.__t);window.__t=setTimeout(()=>$('toast').classList.add('hidden'),3000)}async function api(path,opt={}){const t=token(),r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{}),...(opt.headers||{})},cache:'no-store'});let d={};try{d=await r.json()}catch{}if(r.status===401){$('auth').classList.remove('hidden');$('app').style.display='none'}if(!r.ok)throw new Error(d.error||`Erro HTTP ${r.status}`);return d}
function code(o){return o?.televendas?.erp?.code||String(o?._id||o?.id||'').slice(-8).toUpperCase()}function fmtDate(v){return v?new Date(v).toLocaleString('pt-BR'):'—'}function render(){const body=$('tbody');body.innerHTML=rows.map((o,i)=>{const status=o.status||'',method=o.payment?.method||'—',inst=o.payment?.installments||1;let actions=`<button class="green" data-view="${i}">Detalhes</button>`;if(['orcamento','pedido','venda'].includes(status))actions+=`<button class="green" data-bill="${i}">Faturar</button><button class="danger" data-cancel="${i}">Cancelar</button>`;if(status==='faturado')actions+=`<button class="danger" data-reverse="${i}">Estornar</button>`;return `<tr><td><span class="code">${esc(code(o))}</span></td><td>${fmtDate(o.createdAt)}</td><td><b>${esc(o.customerName||'Consumidor')}</b><div class="muted">${esc(o.customerCpf||o.customerPhone||'')}</div></td><td><span class="status ${esc(status)}">${esc(o.statusLabel||status)}</span></td><td>${esc(method)}<div class="muted">${inst}x</div></td><td><b>${money(o.total)}</b></td><td><div class="row-actions">${actions}</div></td></tr>`}).join('');$('empty').style.display=rows.length?'none':'block';$('empty').textContent=rows.length?'':'Nenhum registro encontrado.';$('pageinfo').textContent=`Página ${page} de ${pages}`;$('prev').disabled=page<=1;$('next').disabled=page>=pages}
async function load(){try{const q=$('search').value.trim(),s=$('status').value,d=await api(`/erp/orders?page=${page}&limit=30&status=${encodeURIComponent(s)}&q=${encodeURIComponent(q)}`);rows=d.orders||[];pages=Math.max(1,d.pagination?.pages||1);render()}catch(e){toast(e.message);$('empty').textContent=e.message}}
function detail(o){const e=o?.televendas?.erp||{},items=(o.items||[]).map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.unitPrice)}</td><td>${money(i.totalPrice)}</td></tr>`).join(''),rec=(e.receivables||[]).map(r=>`<tr><td>${r.number}/${r.installments}</td><td>${new Date(r.dueAt).toLocaleDateString('pt-BR')}</td><td>${money(r.value)}</td><td>${esc(r.status)}</td></tr>`).join(''),timeline=(e.timeline||[]).slice().reverse().map(t=>`<div class="event"><b>${esc(t.label||t.status)}</b><small>${fmtDate(t.at)} • ${esc(t.by||'')}</small></div>`).join('');$('modal-title').textContent=code(o);$('modal-body').innerHTML=`<div class="info"><div><small>Cliente</small><b>${esc(o.customerName||'Consumidor')}</b></div><div><small>Status</small><b>${esc(o.statusLabel||o.status)}</b></div><div><small>Total</small><b>${money(o.total)}</b></div><div><small>Pagamento</small><b>${esc(o.payment?.method||'—')} • ${o.payment?.installments||1}x</b></div><div><small>Estoque</small><b>${esc(e.stockStatus||'not_moved')}</b></div><div><small>Financeiro</small><b>${esc(e.financialStatus||'not_generated')}</b></div></div><h3>Itens</h3><table class="items"><tr><th>Produto</th><th>Qtd.</th><th>Unit.</th><th>Total</th></tr>${items}</table>${rec?`<h3>Financeiro</h3><table class="items"><tr><th>Parcela</th><th>Vencimento</th><th>Valor</th><th>Status</th></tr>${rec}</table>`:''}<h3>Histórico</h3><div class="timeline">${timeline||'<span class="muted">Sem eventos.</span>'}</div>`;$('modal').classList.remove('hidden')}
async function bill(o){if(!confirm(`Faturar ${code(o)}? Isso baixará o estoque e gerará o financeiro.`))return;try{const d=await api(`/erp/orders/${encodeURIComponent(o._id||o.id)}/faturar`,{method:'POST',body:JSON.stringify({paymentMethod:o.payment?.method||'dinheiro',installments:o.payment?.installments||1})});toast('Venda faturada com sucesso.');await load();detail(d.order)}catch(e){toast(e.message)}}async function cancelOrder(o){const reason=prompt('Motivo do cancelamento:','Cancelado pelo operador');if(reason===null)return;try{await api(`/erp/orders/${encodeURIComponent(o._id||o.id)}/cancelar`,{method:'POST',body:JSON.stringify({reason})});toast('Registro cancelado.');load()}catch(e){toast(e.message)}}async function reverse(o){const reason=prompt('Informe o motivo do estorno:','Estorno solicitado');if(!reason)return;try{await api(`/erp/orders/${encodeURIComponent(o._id||o.id)}/estornar`,{method:'POST',body:JSON.stringify({reason})});toast('Venda estornada e estoque restaurado.');load()}catch(e){toast(e.message)}}
$('tbody').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b)return detail(rows[Number(b.dataset.view)]);b=e.target.closest('[data-bill]');if(b)return bill(rows[Number(b.dataset.bill)]);b=e.target.closest('[data-cancel]');if(b)return cancelOrder(rows[Number(b.dataset.cancel)]);b=e.target.closest('[data-reverse]');if(b)return reverse(rows[Number(b.dataset.reverse)])});$('close').onclick=()=>$('modal').classList.add('hidden');$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')});$('refresh').onclick=()=>{page=1;load()};$('status').onchange=()=>{page=1;load()};$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{page=1;load()},300)};$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{if(page<pages){page++;load()}};if(!token()){$('auth').classList.remove('hidden');$('app').style.display='none'}else load();
</script></body></html>
