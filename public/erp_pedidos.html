<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vendas | Ariana ERP</title><style>
:root{--blue:#0646a5;--bg:#f4f6f9;--card:#fff;--line:#dce3ec;--text:#172033;--muted:#6c788c;--green:#11845b;--red:#c83f49;--amber:#b97000;--shadow:0 8px 24px rgba(23,32,51,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}button,input,select,a{font:inherit}.top{min-height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 20px;position:sticky;top:0;z-index:20}.top h1{margin:0;font-size:20px}.top small{color:var(--muted)}.top a{text-decoration:none}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.wrap{max-width:1450px;margin:auto;padding:18px}.tools{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;gap:9px;flex-wrap:wrap;box-shadow:var(--shadow);margin-bottom:13px}.tools input{flex:1;min-width:260px}.tools input,.tools select{border:1px solid #cfd8e5;border-radius:9px;padding:10px}.btn{border:0;border-radius:9px;padding:9px 11px;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.blue{background:var(--blue);color:#fff}.outline{background:#fff;border:1px solid #bdc9d9;color:var(--blue)}.danger{background:#fff0f1;color:var(--red)}.green{background:#eaf8f2;color:var(--green)}.tablebox{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:1050px}th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#778296;text-align:left;background:#fafbfd;padding:11px 12px;border-bottom:1px solid var(--line)}td{padding:12px;border-bottom:1px solid #edf0f5;vertical-align:middle}.code{font-weight:950;color:var(--blue);text-decoration:none}.muted{color:var(--muted);font-size:12px}.status{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900;background:#edf2f8;color:#536075}.status.faturado{background:#eaf8f2;color:var(--green)}.status.cancelado,.status.estornado{background:#fff0f1;color:var(--red)}.status.orcamento{background:#fff6df;color:var(--amber)}.icon-link{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;background:#eef5ff;color:var(--blue);text-decoration:none;font-size:17px}.icon-link.ok{background:#eaf8f2;color:var(--green)}.row-actions{display:flex;gap:5px;flex-wrap:wrap}.row-actions button,.row-actions a{border:0;border-radius:7px;padding:7px 8px;font-size:11px;font-weight:850;cursor:pointer;text-decoration:none}.empty{text-align:center;color:var(--muted);padding:35px}.pager{display:flex;justify-content:space-between;align-items:center;padding:13px;background:#fff}.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 15px;border-radius:10px;z-index:99}.toast.hidden{display:none}.auth{max-width:550px;margin:70px auto;background:#fff;padding:24px;border:1px solid var(--line);border-radius:14px;text-align:center}.auth.hidden{display:none}@media(max-width:700px){.wrap{padding:9px}.tools{display:grid;grid-template-columns:1fr}.tools input{min-width:0}.top{align-items:flex-start}.top small{display:none}}
</style></head><body>
<header class="top"><div><h1>Vendas</h1><small>Ariana ERP • venda, revisão fiscal e financeiro no mesmo fluxo</small></div><div class="top-actions"><a class="btn blue" href="erp_nova_venda.html">＋ Adicionar</a><a class="btn outline" href="erp_ariana.html">← Central ERP</a></div></header>
<div class="auth hidden" id="auth"><h2>Login necessário</h2><p>Entre no Ariana ERP para acessar as vendas.</p><a href="erp_login.html?return=erp_pedidos.html">Abrir login</a></div>
<main class="wrap" id="app"><div class="tools"><input id="search" placeholder="Busca rápida: cliente, CPF, telefone, código, produto ou SKU"><select id="status"><option value="all">Todos os status</option><option value="orcamento">Orçamento</option><option value="pedido">Pedido</option><option value="venda">Venda</option><option value="faturado">Faturado</option><option value="estornado">Estornado</option><option value="cancelado">Cancelado</option></select><button class="btn blue" id="refresh">Atualizar</button></div>
<div class="tablebox"><table><thead><tr><th>Código</th><th>Cliente</th><th>Data</th><th>Valor</th><th>Status da negociação</th><th>Nota Fiscal</th><th>Financeiro</th><th>Ações</th></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty">Carregando…</div><div class="pager"><button class="btn outline" id="prev">← Anterior</button><span id="pageinfo" class="muted"></span><button class="btn outline" id="next">Próxima →</button></div></div></main><div class="toast hidden" id="toast"></div>
<script>
const API_LOCAL='http://localhost:3000/api',API_RENDER='https://ariana-backend.onrender.com/api',IS_LOCAL=location.hostname==='localhost'||location.hostname==='127.0.0.1',API=(localStorage.getItem('API_BASE')||(IS_LOCAL?API_LOCAL:API_RENDER)).replace(/\/$/,'');const $=id=>document.getElementById(id);let page=1,pages=1,rows=[],timer=null;function token(){const t=localStorage.getItem('admin_token')||localStorage.getItem('adminToken')||localStorage.getItem('auth_token')||localStorage.getItem('token')||'';if(t)return t;try{return JSON.parse(localStorage.getItem('banner_admin_session')||'null')?.token||''}catch{return''}}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(m){$('toast').textContent=m;$('toast').classList.remove('hidden');clearTimeout(window.__t);window.__t=setTimeout(()=>$('toast').classList.add('hidden'),3000)}async function api(path,opt={}){const t=token(),r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{}),...(opt.headers||{})},cache:'no-store'});let d={};try{d=await r.json()}catch{}if(r.status===401){$('auth').classList.remove('hidden');$('app').style.display='none'}if(!r.ok)throw new Error(d.error||`Erro HTTP ${r.status}`);return d}function code(o){return o?.televendas?.erp?.code||String(o?._id||o?.id||'').slice(-8).toUpperCase()}function fmtDate(v){return v?new Date(v).toLocaleDateString('pt-BR'):'—'}function fiscalOk(o){const s=String(o?.fiscal?.status||o?.nfe?.status||o?.notaFiscal?.status||o?.televendas?.erp?.fiscalStatus||'').toLowerCase();return /autor|approved|emitted|gerad/.test(s)}function financeOk(o){return['generated','partial','settled'].includes(o?.televendas?.erp?.financialStatus)}function render(){const body=$('tbody');body.innerHTML=rows.map((o,i)=>{const status=o.status||'',id=encodeURIComponent(o._id||o.id||''),saleUrl=`erp_venda_detalhe.html?id=${id}`,reviewUrl=`erp_preparar_nfe.html?id=${id}`;let actions=`<a class="green" href="${saleUrl}">Abrir ficha</a>`;if(['orcamento','pedido','venda'].includes(status))actions+=`<a class="green" href="${reviewUrl}">Revisar NF-e</a><button class="danger" data-cancel="${i}">Cancelar</button>`;if(status==='faturado')actions+=`<button class="danger" data-reverse="${i}">Estornar</button>`;return `<tr><td><a class="code" href="${saleUrl}">${esc(code(o))}</a></td><td><b>${esc(o.customerName||'Consumidor')}</b><div class="muted">${esc(o.customerCpf||o.customerPhone||'')}</div></td><td>${fmtDate(o.televendas?.erp?.saleDate||o.createdAt)}</td><td><b>${money(o.total)}</b></td><td><span class="status ${esc(status)}">${esc(o.statusLabel||status)}</span></td><td><a class="icon-link ${fiscalOk(o)?'ok':''}" href="erp_fiscal.html" title="Fiscal / NF-e">▧</a></td><td><a class="icon-link ${financeOk(o)?'ok':''}" href="${saleUrl}&tab=financeiro" title="Financeiro">$</a></td><td><div class="row-actions">${actions}</div></td></tr>`}).join('');$('empty').style.display=rows.length?'none':'block';$('empty').textContent=rows.length?'':'Nenhuma venda encontrada.';$('pageinfo').textContent=`Página ${page} de ${pages}`;$('prev').disabled=page<=1;$('next').disabled=page>=pages}async function load(){try{const q=$('search').value.trim(),s=$('status').value,d=await api(`/erp/orders?page=${page}&limit=30&status=${encodeURIComponent(s)}&q=${encodeURIComponent(q)}`);rows=d.orders||[];pages=Math.max(1,d.pagination?.pages||1);render()}catch(e){toast(e.message);$('empty').textContent=e.message}}async function cancelOrder(o){const reason=prompt('Motivo do cancelamento:','Cancelado pelo operador');if(reason===null)return;try{await api(`/erp/orders/${encodeURIComponent(o._id||o.id)}/cancelar`,{method:'POST',body:JSON.stringify({reason})});toast('Registro cancelado.');load()}catch(e){toast(e.message)}}async function reverse(o){const reason=prompt('Informe o motivo do estorno:','Estorno solicitado');if(!reason)return;try{await api(`/erp/orders/${encodeURIComponent(o._id||o.id)}/estornar`,{method:'POST',body:JSON.stringify({reason})});toast('Venda estornada e estoque restaurado.');load()}catch(e){toast(e.message)}}$('tbody').addEventListener('click',e=>{let b=e.target.closest('[data-cancel]');if(b)return cancelOrder(rows[Number(b.dataset.cancel)]);b=e.target.closest('[data-reverse]');if(b)return reverse(rows[Number(b.dataset.reverse)])});$('refresh').onclick=()=>{page=1;load()};$('status').onchange=()=>{page=1;load()};$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{page=1;load()},300)};$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{if(page<pages){page++;load()}};const qs=new URLSearchParams(location.search),requested=qs.get('status');if(requested&&[...$('status').options].some(o=>o.value===requested))$('status').value=requested;if(!token()){$('auth').classList.remove('hidden');$('app').style.display='none'}else load();
</script></body></html>
