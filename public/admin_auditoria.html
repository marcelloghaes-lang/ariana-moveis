<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Auditoria de acessos | Ariana Móveis</title>
  <link rel="stylesheet" href="css/tailwind.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="js/api-config.js"></script>
  <style>
    :root{--blue:#0047ab;--dark:#062b63}body{font-family:Inter,Arial,sans-serif;background:#f3f4f6;color:#111827}.brand{background:linear-gradient(135deg,var(--blue),var(--dark))}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 8px 24px rgba(15,23,42,.06)}.btn{border-radius:12px;padding:.72rem 1rem;font-weight:800}.field{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:.72rem .85rem;background:#fff}.badge{display:inline-flex;border-radius:999px;padding:.25rem .65rem;font-size:.75rem;font-weight:800}.toast{position:fixed;right:18px;top:18px;z-index:99;padding:14px 18px;border-radius:14px;color:#fff;font-weight:700}
  </style>
</head>
<body>
<header class="brand text-white shadow-lg"><div class="max-w-7xl mx-auto px-4 py-5 flex flex-wrap items-center justify-between gap-3"><div><div class="text-2xl font-black italic">ARIANA <span class="text-blue-200 text-base">MÓVEIS</span></div><div class="text-blue-100 text-sm">Auditoria de usuários e permissões</div></div><div class="flex gap-2"><a href="admin_usuarios.html" class="btn bg-white text-blue-800"><i class="fas fa-users-gear mr-2"></i>Usuários</a><a href="admin_painel.html" class="btn bg-yellow-400 text-blue-950"><i class="fas fa-arrow-left mr-2"></i>Painel</a></div></div></header>
<main class="max-w-7xl mx-auto p-4 md:p-6 space-y-5">
<section class="card p-5"><div class="flex flex-col md:flex-row gap-3 md:items-end"><label class="text-sm font-bold flex-1">Usuário ou administrador<input id="search" class="field mt-1" placeholder="Nome ou e-mail"></label><label class="text-sm font-bold md:w-64">Ação<select id="action" class="field mt-1"><option value="">Todas</option><option value="user_created">Usuário criado</option><option value="user_updated">Usuário atualizado</option><option value="user_activated">Usuário ativado</option><option value="user_blocked">Usuário bloqueado</option><option value="password_reset">Senha redefinida</option><option value="user_deleted">Usuário excluído</option></select></label><button id="filter" class="btn bg-blue-700 text-white"><i class="fas fa-filter mr-2"></i>Filtrar</button><button id="refresh" class="btn bg-white border"><i class="fas fa-rotate"></i></button></div></section>
<section class="card p-4 md:p-5"><div class="flex justify-between items-center mb-4"><div><h1 class="text-xl font-black">Histórico administrativo</h1><p class="text-sm text-gray-500">Registro de criação, alteração, bloqueio, senha e exclusão de usuários.</p></div><span id="count" class="badge bg-blue-100 text-blue-700">0 registros</span></div><div id="loading" class="py-12 text-center text-gray-500"><i class="fas fa-circle-notch fa-spin mr-2"></i>Carregando auditoria...</div><div id="empty" class="hidden py-12 text-center text-gray-500">Nenhum registro encontrado.</div><div id="logs" class="hidden space-y-3"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);function getApiBase(){const c=String(window.API_BASE_URL||window.__API_BASE_URL__||'').replace(/\/+$/,'');if(c)return c.endsWith('/api')?c:c+'/api';return location.hostname==='localhost'||location.hostname==='127.0.0.1'?'http://localhost:3000/api':'/api'}const API=getApiBase();function token(){for(const k of ['adminToken','admin_token','token','authToken']){const v=localStorage.getItem(k)||sessionStorage.getItem(k);if(v)return v}return ''}function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function fmt(v){return v?new Date(v).toLocaleString('pt-BR'):'—'}function label(a){return({user_created:'Usuário criado',user_updated:'Usuário atualizado',user_activated:'Usuário ativado',user_blocked:'Usuário bloqueado',password_reset:'Senha redefinida',user_deleted:'Usuário excluído'})[a]||a}function badge(a){return a==='user_deleted'||a==='user_blocked'?'bg-red-100 text-red-700':a==='user_created'||a==='user_activated'?'bg-green-100 text-green-700':'bg-blue-100 text-blue-700'}
async function load(){try{$('loading').classList.remove('hidden');$('logs').classList.add('hidden');$('empty').classList.add('hidden');const q=new URLSearchParams({limit:'300'});if($('search').value.trim())q.set('user',$('search').value.trim());if($('action').value)q.set('action',$('action').value);const r=await fetch(API+'/admin/users/audit?'+q,{headers:{Authorization:'Bearer '+token()}});const d=await r.json().catch(()=>({}));if(r.status===401){location.href='admin_painel.html';return}if(!r.ok)throw new Error(d.error||'Falha ao carregar auditoria.');const logs=Array.isArray(d.logs)?d.logs:(Array.isArray(d.items)?d.items:(Array.isArray(d.data)?d.data:[]));$('count').textContent=logs.length+' registros';$('loading').classList.add('hidden');$('empty').classList.toggle('hidden',logs.length>0);$('logs').classList.toggle('hidden',logs.length===0);$('logs').innerHTML=logs.map(x=>`<article class="border rounded-2xl p-4 bg-gray-50"><div class="flex flex-wrap justify-between gap-2"><div><span class="badge ${badge(x.action)}">${esc(label(x.action))}</span><div class="font-black mt-2">${esc(x.summary||'Alteração administrativa')}</div><div class="text-sm text-gray-500 mt-1">Alvo: ${esc(x.targetUserName||'—')} · ${esc(x.targetUserEmail||'—')}</div></div><div class="text-right text-sm"><div class="font-bold">${fmt(x.createdAt)}</div><div class="text-gray-500">Por: ${esc(x.actorEmail||'admin')}</div></div></div>${(x.addedPermissions||[]).length?`<div class="mt-3 text-sm"><b class="text-green-700">Adicionadas:</b> ${esc(x.addedPermissions.join(', '))}</div>`:''}${(x.removedPermissions||[]).length?`<div class="mt-1 text-sm"><b class="text-red-700">Removidas:</b> ${esc(x.removedPermissions.join(', '))}</div>`:''}</article>`).join('')}catch(e){$('loading').classList.remove('hidden');$('logs').classList.add('hidden');$('empty').classList.add('hidden');$('loading').innerHTML='<i class="fas fa-triangle-exclamation mr-2 text-red-600"></i>'+esc(e?.message||'Falha ao carregar auditoria.')}}
$('filter').onclick=load;$('refresh').onclick=load;$('search').addEventListener('keydown',e=>{if(e.key==='Enter')load()});load();
</script>
</body></html>
