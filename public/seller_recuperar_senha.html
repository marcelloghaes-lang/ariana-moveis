<body>
  <main class="card">
    <h1><span class="am-logo-wordmark" style="--am-logo-ariana:#2E6DA4" aria-label="Ariana Móveis"><span class="am-logo-ariana">ARIANA</span><span class="am-logo-moveis">MÓVEIS</span></span></h1>
    <h2>Recuperar senha do Seller</h2>
    <p>Informe o e-mail cadastrado no painel do vendedor. Se o e-mail existir, enviaremos um link de redefinição.</p>

    <form id="recoverForm">
      <label for="email">Seu e-mail cadastrado</label>
      <input id="email" type="email" required placeholder="seu@email.com" autocomplete="email">
      <button id="btnSubmit" type="submit">Enviar link de recuperação</button>
      <div id="message" class="msg"></div>
    </form>

    <div class="links">
      <a href="seller_login.html">Voltar ao login</a>
      <a href="seller_cadastro.html">Criar solicitação</a>
    </div>
  </main>

<script>
(function(){
  const API_BASE = "https://ariana-backend.onrender.com/api";
  const form = document.getElementById("recoverForm");
  const email = document.getElementById("email");
  const btn = document.getElementById("btnSubmit");
  const msg = document.getElementById("message");

  function showMessage(text, ok){
    msg.textContent = text;
    msg.className = "msg " + (ok ? "ok" : "err");
  }

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = "Enviando...";

    try {
      const res = await fetch(API_BASE + "/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ email: email.value.trim() })
      });

      const data = await res.json().catch(function(){ return {}; });

      if (!res.ok) {
        throw new Error(data.error || data.message || "Erro ao solicitar recuperação de senha.");
      }

      showMessage("Se este e-mail estiver cadastrado, o link de recuperação será enviado.", true);
    } catch (err) {
      showMessage(err.message || "Servidor indisponível no momento.", false);
    } finally {
      btn.disabled = false;
      btn.textContent = "Enviar link de recuperação";
    }
  });
})();
</script>


<script id="ariana-seller-professional-ui-js">
(function(){
  try{
    var page=(location.pathname.split('/').pop()||'').toLowerCase();
    document.querySelectorAll('aside a, .side .nav button').forEach(function(el){
      var href=(el.getAttribute('href')||'').toLowerCase();
      if(href && href.indexOf(page)>=0){el.classList.add('active');}
    });
    document.querySelectorAll('aside#sidebar .px-4:first-child span').forEach(function(el){
      if(/ariana/i.test(el.textContent||'')) el.textContent='ARIANA MÓVEIS';
    });
  }catch(e){}
})();
</script>
