<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatórios | Ariana ERP</title><style>:root{--b:#0646a5;--bg:#f4f6f9;--line:#dce3ec;--text:#172033;--muted:#69758a;--green:#087a52}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Inter,Segoe UI,Arial,sans-serif;color:var(--text)}header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}header a{color:var(--b);font-weight:900;text-decoration:none}.wrap{max-width:1450px;margin:auto;padding:18px}.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px}.filters input{border:1px solid #cfd8e5;border-radius:9px;padding:10px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--b);color:#fff;font-weight:900;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:13px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.card small{color:var(--muted);font-weight:800}.card b{display:block;font-size:22px;margin-top:5px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer}.tabs button.active{background:var(--b);color:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}table{width:100%;border-collapse:collapse}th{font-size:10px;text-transform:uppercase;color:#778296;text-align:left;padding:9px;border-bottom:1px solid var(--line)}td{padding:10px 9px;border-bottom:1px solid #edf0f5}.src{font-size:10px;background:#eef4ff;color:var(--b);padding:3px 7px;border-radius:999px}.empty{text-align:center;color:var(--muted);padding:25px}@media(max-width:900px){.cards,.grid2{grid-template-columns:1fr 1fr}}@media(max-width:650px){.cards,.grid2,.filters{grid-template-columns:1fr}.wrap{padding:10px}}</style></head><body><header><div><b>Relatórios do Ariana ERP</b><div style="font-size:12px;color:#69758a">Histórico migrado + vendas novas</div></div><div><a href="erp_financeiro_completo.html">Financeiro</a> &nbsp; <a href="erp_ariana.html">← Central ERP</a></div></header><main class="wrap"><div class="filters"><input id="from" type="date"><input id="to" type="date"><button class="btn" id="go">Gerar relatórios</button></div><div class="cards"><div class="card"><small>Vendas</small><b id="sales">—</b></div><div class="card"><small>Faturamento</small><b id="total">—</b></div><div class="card"><small>Ticket médio</small><b id="avg">—</b></div><div class="card"><small>Itens vendidos</small><b id="items">—</b></div></div><section class="panel"><div class="tabs" id="tabs"><button class="active" data-tab="salesList">Vendas</button><button data-tab="clients">Ranking clientes</button><button data-tab="abc">Curva ABC</button><button data-tab="products">Produtos</button><button data-tab="sellers">Vendedores</button><button data-tab="payments">Pagamentos</button></div><div id="content"></div></section><div class="grid2" style="margin-top:12px"><section class="panel"><h3>Origem das vendas</h3><div id="sources"></div></section><section class="panel"><h3>Top 10 clientes</h3><div id="top"></div></section></div></main><script>const API=location.hostname==='localhost'?'http://localhost:3000/api':'https://ariana-backend.onrender.com/api';const $=id=>document.getElementById(id);let data={},tab='salesList';function token(){const t=localStorage.getItem('admin_token')||localStorage.getItem('auth_token')||localStorage.getItem('token')||'';if(t)return t;try{return JSON.parse(localStorage.getItem('banner_admin_session')||'null')?.token||''}catch{return''}}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function date(v){return v?new Date(v).toLocaleDateString('pt-BR'):'—'}async function load(){const p=new URLSearchParams();if($('from').value)p.set('from',$('from').value);if($('to').value)p.set('to',$('to').value);$('content').innerHTML='<div class="empty">Gerando…</div>';const r=await fetch(API+'/erp/relatorios/vendas-completo?'+p,{headers:{Authorization:'Bearer '+token()},cache:'no-store'});data=await r.json();if(!r.ok){$('content').innerHTML=`<div class="empty">${esc(data.error||'Erro')}</div>`;return}const s=data.summary||{};$('sales').textContent=Number(s.sales||0).toLocaleString('pt-BR');$('total').textContent=money(s.total);$('avg').textContent=money(s.averageTicket);$('items').textContent=Number(s.items||0).toLocaleString('pt-BR');$('sources').innerHTML=`<p>Histórico migrado: <b>${s.historical||0}</b></p><p>Vendas novas Ariana: <b>${s.current||0}</b></p>`;$('top').innerHTML=(data.customerRanking||[]).slice(0,10).map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #edf0f5"><span>${i+1}. ${esc(x.name)}</span><b>${money(x.value)}</b></div>`).join('');render()}function table(headers,rows){return `<div style="overflow:auto"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}function render(){if(tab==='salesList')$('content').innerHTML=table(['Data','Venda','Cliente','Vendedor','Pagamento','Total','Origem'],(data.sales||[]).map(x=>`<tr><td>${date(x.date)}</td><td>${esc(x.code||'—')}</td><td><b>${esc(x.customerName)}</b></td><td>${esc(x.sellerName||'—')}</td><td>${esc(x.paymentMethod||'—')}</td><td><b>${money(x.total)}</b></td><td><span class="src">${x.source==='historico'?'Histórico':'Ariana'}</span></td></tr>`));else if(tab==='clients')$('content').innerHTML=table(['Cliente','Vendas','Faturamento'],(data.customerRanking||[]).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.orders}</td><td>${money(x.value)}</td></tr>`));else if(tab==='abc')$('content').innerHTML=table(['Cliente','Vendas','Valor','Participação','Curva'],(data.customerABC||[]).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.orders}</td><td>${money(x.value)}</td><td>${Number(x.share||0).toFixed(2)}%</td><td><b>${x.curve}</b></td></tr>`));else if(tab==='products')$('content').innerHTML=table(['Produto','Quantidade','Valor'],(data.productRanking||[]).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${Number(x.qty||0).toLocaleString('pt-BR')}</td><td>${money(x.value)}</td></tr>`));else if(tab==='sellers')$('content').innerHTML=table(['Vendedor','Vendas','Valor'],(data.sellerRanking||[]).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.orders}</td><td>${money(x.value)}</td></tr>`));else $('content').innerHTML=table(['Forma de pagamento','Valor'],Object.entries(data.paymentMethods||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td>${money(v)}</td></tr>`))}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});$('go').onclick=load;const now=new Date(),start=new Date(now.getFullYear(),0,1);$('from').value=start.toISOString().slice(0,10);$('to').value=now.toISOString().slice(0,10);load();</script></body></html>
