<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swagger | Ariana Enterprise</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body{margin:0;background:#f3f7fb;font-family:Inter,Arial,sans-serif}.top{background:linear-gradient(135deg,#0047AB,#0ea5e9);color:#fff;padding:24px 34px;display:flex;justify-content:space-between;gap:14px;align-items:center}.top h1{margin:0;font-size:30px}.top p{margin:5px 0 0;opacity:.95}.top a{background:#fff;color:#0047AB;text-decoration:none;font-weight:900;border-radius:12px;padding:12px 15px;display:inline-block;margin-left:8px}#swagger-ui{max-width:1280px;margin:0 auto;padding:22px}.swagger-ui .topbar{display:none}@media(max-width:800px){.top{display:block}.top a{margin:10px 6px 0 0}}
  </style>

<style id="enterprise-mobile-suite">
html,body{width:100%;max-width:100%;overflow-x:hidden}body{min-width:0}
main,.main,.app,.wrap,.hero,.top,.layout,.hero-grid,.grid,.grid2,.grid3,.row,.steps,.stats,.cards,.card,.tester,.resource,.contact{min-width:0;max-width:100%}
img,svg,video,canvas,iframe{max-width:100%;height:auto}
pre,.pre,.code,.response,.sample-code,.api-box,textarea{max-width:100%;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
p,li,.muted,.endpoint-line,.code{overflow-wrap:anywhere}.btn{max-width:100%;white-space:normal;text-align:center}.table{max-width:100%}
@media(max-width:900px){main,.main,.wrap{max-width:100%!important}.hero,.card,.section{max-width:100%}.grid,.grid2,.grid3,.row,.steps,.stats,.cards,.tester,.hero-grid{grid-template-columns:minmax(0,1fr)!important}.table{display:block;width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.table th,.table td{white-space:nowrap}.filters{display:grid!important;grid-template-columns:minmax(0,1fr)!important;width:100%}.filters input,.filters select,.filters button,.filters .input,.filters .select{width:100%!important;min-width:0}.actions,.btnrow,.quick-actions{width:100%;display:flex;flex-wrap:wrap}.actions .btn,.btnrow .btn,.quick-actions .btn{flex:1 1 180px}.modal{padding:10px!important}.modal-card{width:100%!important;max-width:100%!important;max-height:92vh!important;padding:16px!important;border-radius:18px!important}.modal-head{align-items:flex-start!important;flex-wrap:wrap}.toast{left:12px!important;right:12px!important;bottom:12px!important;max-width:none!important}}
@media(max-width:520px){.actions .btn,.btnrow .btn,.quick-actions .btn{width:100%;flex:1 1 100%}.card{border-radius:18px}}
</style>
<style id="enterprise-mobile-page-swagger">
html,body{width:100%;max-width:100%;overflow-x:hidden}#swagger-ui{min-width:0;max-width:100%}
@media(max-width:800px){.top{padding:18px 12px!important;display:block!important}.top h1{font-size:25px!important}.top a{display:block!important;width:100%!important;margin:8px 0 0!important;text-align:center}#swagger-ui{padding:8px!important}.swagger-ui .wrapper{padding:0 6px!important;max-width:100%!important}.swagger-ui .info{margin:20px 0!important}.swagger-ui .info .title{font-size:26px!important;overflow-wrap:anywhere}.swagger-ui .scheme-container{padding:14px!important}.swagger-ui .opblock{margin:0 0 12px!important}.swagger-ui .opblock .opblock-summary{align-items:flex-start!important;flex-wrap:wrap!important;padding:8px!important}.swagger-ui .opblock-summary-method{min-width:70px!important}.swagger-ui .opblock-summary-path,.swagger-ui .opblock-summary-path__deprecated{max-width:100%!important;word-break:break-word!important;overflow-wrap:anywhere!important;font-size:13px!important}.swagger-ui .opblock-summary-description{width:100%!important;padding-left:0!important;margin-top:6px!important}.swagger-ui table{display:block!important;width:100%!important;overflow-x:auto!important}.swagger-ui .responses-inner,.swagger-ui .opblock-body{padding:10px!important}.swagger-ui .model-box,.swagger-ui .highlight-code,.swagger-ui pre{max-width:100%!important;overflow-x:auto!important}.swagger-ui .response-col_links{display:none!important}}
</style>
</head>
<body>
  <div class="top"><div><h1>Ariana Enterprise API</h1><p>Swagger/OpenAPI automático para fabricantes, distribuidores e ERPs.</p></div><div><a href="https://ariana-backend.onrender.com/api/enterprise/openapi.json" target="_blank">Baixar OpenAPI JSON</a><a href="/portal_fabricante.html">Portal</a></div></div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: 'https://ariana-backend.onrender.com/api/enterprise/openapi.json',
      dom_id: '#swagger-ui',
      deepLinking: true,
      persistAuthorization: true,
      displayRequestDuration: true,
      tryItOutEnabled: true
    });
  </script>
</body>
</html>
