<script>
const IS_LOCAL_HOST = window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost";
const API_BASE = IS_LOCAL_HOST ? "http://localhost:3000/api" : "https://ariana-backend.onrender.com/api";
const byId = (id) => document.getElementById(id);
const $ = byId;

function getSellerToken() {
  return localStorage.getItem("seller_token") || "";
}
function getSellerProfile() {
  try { return JSON.parse(localStorage.getItem("seller_profile") || "{}") || {}; } catch(_) { return {}; }
}
function clearSellerSession() {
  localStorage.removeItem("seller_token");
  localStorage.removeItem("seller_profile");
  localStorage.removeItem("partner_request_id");
}
function authHeaders(extra = {}) {
  const token = getSellerToken();
  return token ? { ...extra, Authorization: `Bearer ${token}` } : { ...extra };
}
function ensureSellerSession() {
  const token = getSellerToken();
  if (!token) {
    window.location.href = "seller_login.html";
    return false;
  }
  return true;
}
function applySellerHeaderName() {
  const profile = getSellerProfile();
  const el = document.getElementById("user-display-name");
  if (el) el.textContent = `Bem-vindo, ${profile.factoryName || profile.name || 'Seller'}!`;
}
</script>

<script>

async function carregarAtendimentos() {
    if (!ensureSellerSession()) return;
    applySellerHeaderName();
    const container = document.getElementById('atendimentos-container');
    try {
        const res = await fetch(`${API_BASE}/seller/support`, { headers: authHeaders() });
        if (res.status === 401 || res.status === 403) {
            clearSellerSession();
            window.location.href = 'seller_login.html';
            return;
        }
        const dados = await res.json();
        if (!res.ok) throw new Error(dados?.message || `Erro ${res.status}`);

        if (!dados.length) {
            container.innerHTML = '<div class="text-center py-10 text-gray-400 font-medium bg-white rounded-2xl border border-dashed border-gray-300">Nenhum chamado aberto no momento.</div>';
            return;
        }

        container.innerHTML = '';
        let novos = 0;

        dados.forEach(d => {
            if(d.status === 'Novo') novos++;
            
            const card = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between gap-4 animate-fade">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-xs font-bold text-gray-400 italic">${new Date(d.createdAt || d.data).toLocaleString('pt-BR')}</span>
                            <span class="text-xs font-bold px-2 py-1 rounded ${d.status === 'Novo' ? 'status-novo' : 'status-respondido'}">${d.status}</span>
                        </div>
                        <h3 class="font-bold text-gray-800">${d.nome} <span class="text-gray-400 font-normal text-sm">(${d.email})</span></h3>
                        <p class="text-sm text-gray-500 mt-1"><strong>Pedido:</strong> ${d.pedido || 'Não informado'}</p>
                        <div class="mt-3 p-3 bg-gray-50 rounded-lg text-gray-700 text-sm border-l-4 border-primary-blue italic">"${d.mensagem}"</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <a href="mailto:${d.email}?subject=Resposta Ariana Móveis - Pedido ${d.pedido || ''}" 
                           onclick="marcarComoLido('${d._id}')"
                           class="bg-primary-blue text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-dark-bg transition-all">
                            <i class="fas fa-reply mr-2"></i> Responder
                        </a>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', card);
        });

        document.getElementById('total-contatos').textContent = dados.length;
        document.getElementById('total-novos').textContent = novos;

    } catch (e) {
        container.innerHTML = '<div class="text-center py-10 text-red-500 font-bold">Erro ao carregar atendimentos do Render.</div>';
    }
}

async function marcarComoLido(id) {
    try {
        await fetch(`${API_BASE}/seller/support/${id}/read`, { method: 'PATCH', headers: authHeaders() });
        carregarAtendimentos();
    } catch (e) { console.error("Erro ao atualizar status", e); }
}

window.onload = carregarAtendimentos;
document.getElementById('btn-sair').onclick = () => { clearSellerSession(); window.location.href="seller_login.html"; };
</script>



<script id="ariana-seller-professional-ui-js">
(function(){

    var page=(location.pathname.split('/').pop()||'').toLowerCase();
    document.querySelectorAll('aside a, .side .nav button').forEach(function(el){
      var href=(el.getAttribute('href')||'').toLowerCase();

    document.querySelectorAll('aside#sidebar .px-4:first-child span').forEach(function(el){
      if(/ariana/i.test(el.textContent||'')) el.textContent='ARIANA MÓVEIS';
    });
  }catch(e){}
})();
</script>
