name: ERP Agreement Charges Safe Hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/erp-agreement-charges-safe-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply safe patch
        run: python3 .github/scripts/patch_erp_agreement_charges_safe.py

      - name: Validate HTML markers
        run: |
          grep -q 'id="ag-apply-charges"' public/erp_financeiro_completo.html
          grep -q 'id="ag-fine"' public/erp_financeiro_completo.html
          grep -q 'id="ag-interest"' public/erp_financeiro_completo.html
          grep -q 'id="ag-updated"' public/erp_financeiro_completo.html
          grep -q 'applyAgreementChargeChoice' public/erp_financeiro_completo.html
          git diff --check

      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('public/erp_financeiro_completo.html').read_text(encoding='utf-8')
          start=html.find('<script>\nconst API_LOCAL=')
          end=html.rfind('\n</script>\n</body>')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('main script boundaries not found')
          js=html[start+len('<script>\n'):end]
          Path('/tmp/erp_financeiro_completo.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/erp_financeiro_completo.js

      - name: Commit verified hotfix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/erp-agreement-charges-safe-hotfix.yml
          rm .github/scripts/patch_erp_agreement_charges_safe.py
          git add public/erp_financeiro_completo.html .github/workflows/erp-agreement-charges-safe-hotfix.yml .github/scripts/patch_erp_agreement_charges_safe.py
          git commit -m "fix(erp): adicionar encargos ao acordo sem quebrar financeiro"
          git push origin HEAD:main
