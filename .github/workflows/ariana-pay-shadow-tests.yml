name: Ariana Pay Shadow Tests

on:
  push:
    branches:
      - feature/ariana-pay-phase1
    paths:
      - 'functions/arianaPaySandboxServer.js'
      - 'functions/services/arianaPay/**'
      - 'functions/models/arianaPayModels.js'
      - 'functions/routes/arianaPayShadowRoutes.js'
      - 'functions/tests/ariana-pay-*.test.mjs'
      - 'public/admin_ariana_pay_shadow.html'
      - 'public/seller_ariana_pay.html'
      - 'docs/ariana-pay/**'
      - '.github/workflows/ariana-pay-shadow-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax checks for Ariana Pay isolated code
        run: |
          node --check arianaPaySandboxServer.js
          node --check routes/arianaPayShadowRoutes.js

      - name: Ariana Pay isolated tests
        run: node --test tests/ariana-pay-*.test.mjs
