name: Ariana Pay Shadow Tests

on:
  push:
    branches:
      - feature/ariana-pay-phase1
    paths:
      - 'functions/services/arianaPay/**'
      - 'functions/models/arianaPayModels.js'
      - 'functions/routes/arianaPayShadowRoutes.js'
      - 'functions/routes/orderStatusRoutes.js'
      - 'functions/routes/legacyRuntimeRoutes.js'
      - 'functions/tests/ariana-pay-*.test.mjs'
      - 'functions/package.json'
      - '.github/workflows/ariana-pay-shadow-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax checks for wired routes
        run: |
          node --check routes/paymentRoutes.js
          node --check routes/arianaPayShadowRoutes.js
          node --check routes/sellerCoreRoutes.js
          node --check routes/orderStatusRoutes.js
          node --check routes/legacyRuntimeRoutes.js

      - name: Ariana Pay isolated tests
        run: node --test tests/ariana-pay-*.test.mjs
