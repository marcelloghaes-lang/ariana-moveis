name: Ariana Storefront Live Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate backend entrypoint
        run: node --check functions/server.js
      - name: Validate ERP finance page exists
        run: test -s public/erp_financeiro_completo.html
