name: Ariana Storefront Live Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storefront-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://arianamoveis.com.br
      BACKEND: https://ariana-backend.onrender.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply client receivables report patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/erp_financeiro_completo.html')
          s = p.read_text()
          if 'data-client-report=' in s and 'function clientReportFor(key)' in s:
              print('client report already applied')
              raise SystemExit(0)

          old = '<div class="client-balance"><small>Saldo encontrado</small><b>${money(clientBalance)}</b></div>'
          new = '<div class="client-balance"><small>Saldo encontrado</small><b>${money(clientBalance)}</b><button class="btn primary" data-client-report="${esc(c.key)}" style="margin-top:8px">Gerar relatório</button></div>'
          if old not in s:
              raise SystemExit('client balance target not found')
          s = s.replace(old, new, 1)

          old = '<div class="toast" id="toast"></div>'
          new = '''<div class="modalback" id="client-report-modal"><div class="modal" style="max-width:980px"><div class="modalhead"><div><h3>Relatório do contas a receber</h3><div class="sub" id="client-report-sub">Compras em aberto do cliente, separadas por compra e atualizadas com encargos somente nas parcelas vencidas.</div></div><button class="x" data-close="client-report-modal">×</button></div><div class="notice"><b>Regra financeira:</b> multa de 2% ao mês + juros de 1% ao mês, proporcionais aos dias de atraso. Parcelas ainda não vencidas entram no saldo principal, sem multa e sem juros.</div><pre id="client-report-text" style="margin:14px 0 0;white-space:pre-wrap;font:15px/1.55 Arial,sans-serif;border:1px dashed #b8c8dc;border-radius:10px;padding:18px;background:#fff;min-height:260px"></pre><div class="modalfoot"><button class="btn" data-close="client-report-modal">Fechar</button><button class="btn" id="client-report-copy">Copiar para Word / Google Docs</button><button class="btn primary" id="client-report-print">Imprimir / Salvar PDF</button></div></div></div>\n<div class="toast" id="toast"></div>'''
          if old not in s:
              raise SystemExit('toast target not found')
          s = s.replace(old, new, 1)

          marker = 'function selectedRows(){'
          insert = r'''function reportPad(v,n){v=String(v??'');return v.length>=n?v:v+' '.repeat(n-v.length)}
function clientReportFor(key){
 const c=collectionGroups().find(x=>x.key===key);if(!c)return null;
 const now=today(),lines=[],purchaseBlocks=[];let totalPrincipal=0,totalFine=0,totalInterest=0,totalUpdated=0,totalOpen=0,totalOverdue=0;
 for(const p of c.purchases){
  const openRows=p.rows.filter(r=>['pendente','parcial'].includes(r.status)&&Number(r.remaining||0)>0.009).sort((a,b)=>new Date(a.dueAt||0)-new Date(b.dueAt||0));
  if(!openRows.length)continue;
  let principal=0,fine=0,interest=0,updated=0,overdueCount=0;
  const body=[];
  body.push(reportPad('Parcela',12)+reportPad('Vencimento',14)+reportPad('Principal',16)+reportPad('Multa',14)+reportPad('Juros',14)+reportPad('Atualizado',17)+'Situação');
  for(const r of openRows){
   const pval=Math.max(0,Number(r.remaining||0)),calc=calculateLateCharges(r,pval,now,false),isOver=calc.days>0;
   principal+=pval;fine+=Number(calc.fine||0);interest+=Number(calc.interest||0);updated+=Number(calc.total||pval);if(isOver)overdueCount++;
   body.push(reportPad((r.number||0)+'/'+(r.installments||0),12)+reportPad(date(r.dueAt),14)+reportPad(money(pval),16)+reportPad(money(calc.fine||0),14)+reportPad(money(calc.interest||0),14)+reportPad(money(calc.total||pval),17)+(isOver?'VENCIDA':'EM ABERTO'));
  }
  totalPrincipal+=principal;totalFine+=fine;totalInterest+=interest;totalUpdated+=updated;totalOpen+=openRows.length;totalOverdue+=overdueCount;
  purchaseBlocks.push(['COMPRA '+(purchaseBlocks.length+1)+' — '+(p.ref||'Compra'),body.join('\n'),'Subtotal principal: '+money(principal),'Multa: '+money(fine),'Juros: '+money(interest),'Subtotal atualizado: '+money(updated)].join('\n'));
 }
 if(!purchaseBlocks.length)return{client:c,text:''};
 lines.push('ARIANA MÓVEIS');
 lines.push('RELATÓRIO DE CONTAS A RECEBER');
 lines.push('');
 lines.push('Cliente: '+c.name);
 if(c.cpf)lines.push('CPF/CNPJ: '+c.cpf);
 if(c.phone)lines.push('Telefone: '+c.phone);
 lines.push('Atualizado em: '+new Date().toLocaleString('pt-BR'));
 lines.push('Regra: multa de 2% ao mês + juros de 1% ao mês, proporcionais aos dias de atraso, somente nas parcelas vencidas.');
 lines.push('');
 lines.push(purchaseBlocks.join('\n\n------------------------------------------------------------\n\n'));
 lines.push('');lines.push('============================================================');
 lines.push('RESUMO GERAL');
 lines.push('Parcelas em aberto: '+totalOpen);
 lines.push('Parcelas vencidas: '+totalOverdue);
 lines.push('Principal em aberto: '+money(totalPrincipal));
 lines.push('Multa sobre parcelas vencidas: '+money(totalFine));
 lines.push('Juros sobre parcelas vencidas: '+money(totalInterest));
 lines.push('TOTAL ATUALIZADO: '+money(totalUpdated));
 return{client:c,text:lines.join('\n')};
}
function openClientReport(key){const r=clientReportFor(key);if(!r)return toast('Cliente não encontrado.');if(!r.text)return toast('Este cliente não possui parcelas vencidas ou em aberto.');$('client-report-sub').textContent=r.client.name+' • somente parcelas com saldo em aberto';$('client-report-text').textContent=r.text;openModal('client-report-modal')}
async function copyClientReport(){const text=$('client-report-text').textContent||'';if(!text)return;try{await navigator.clipboard.writeText(text);toast('Relatório copiado. Cole diretamente no Word ou Google Docs.')}catch{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('Relatório copiado.')}}
function printClientReport(){const text=$('client-report-text').textContent||'';if(!text)return;const w=window.open('','_blank','width=900,height=900');w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Relatório de contas a receber</title><style>body{font:15px/1.5 Arial;margin:34px;color:#172033}pre{white-space:pre-wrap;font:15px/1.5 Arial}.head{border-bottom:3px solid #0646a5;margin-bottom:18px;padding-bottom:10px}h1{font-size:20px;color:#0646a5;margin:0}</style></head><body><div class="head"><h1>ARIANA MÓVEIS</h1><div>Relatório de contas a receber</div></div><pre>'+esc(text)+'</pre><script>window.onload=()=>window.print()<\\/script></body></html>');w.document.close()}
'''
          if marker not in s:
              raise SystemExit('selectedRows marker not found')
          s = s.replace(marker, insert + marker, 1)

          old = "$('col-body').onclick=e=>{const chk=e.target.closest('.col-check');"
          new = "$('col-body').onclick=e=>{const rp=e.target.closest('[data-client-report]');if(rp){openClientReport(rp.dataset.clientReport);return}const chk=e.target.closest('.col-check');"
          if old not in s:
              raise SystemExit('col-body handler target not found')
          s = s.replace(old, new, 1)

          old = "$('pay-body').onclick=e=>{const b=e.target.closest('[data-receipt]');if(b)printReceipt(payments[Number(b.dataset.receipt)])};"
          new = old + "$('client-report-copy').onclick=copyClientReport;$('client-report-print').onclick=printClientReport;"
          if old not in s:
              raise SystemExit('pay-body handler target not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          if ! git diff --quiet -- public/erp_financeiro_completo.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/erp_financeiro_completo.html
            git commit -m "feat(erp): gerar relatorio consolidado por cliente"
            git push
          fi

      - name: Check backend entrypoint guards
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/server.js
          grep -q 'function getClientIp' functions/server.js
          grep -q 'ip: getClientIp(req)' functions/server.js

      - name: Check public storefront pages
        shell: bash
        run: |
          set -euo pipefail

          check_page() {
            local path="$1"
            local marker="$2"
            local file
            file="/tmp/page-$(echo "$path" | tr '/?=&' '----').html"
            local code
            code=$(curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 35 -sS -L -o "$file" -w '%{http_code}' "$SITE$path")
            echo "$path -> $code"
            [[ "$code" =~ ^2[0-9][0-9]$ ]]
            test -s "$file"
            test "$(wc -c < "$file")" -gt 200
            grep -Fqi "$marker" "$file"
          }

          check_page "/" "Ariana"
          check_page "/todos_produtos.html" "Catálogo Completo"
          check_page "/produto.html" "Descrição Completa"
          check_page "/carrinho.html" "Meu carrinho"
          check_page "/checkout.html" "Checkout"
          check_page "/pagamento.html" "Pagamento"
          check_page "/login_cadastro.html" "Ariana"
          check_page "/ofertas.html" "Ariana"
          check_page "/busca.html" "Ariana"
          check_page "/categoria.html" "Ariana"

      - name: Check critical storefront assets
        shell: bash
        run: |
          set -euo pipefail

          for asset in \
            /js/api-config.js \
            /marketplace-core.js \
            /marketplace-core_global_payments.js \
            /product-card.js \
            /checkout-ariana.css; do
            file="/tmp/asset-$(basename "$asset")"
            code=$(curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 35 -sS -L -o "$file" -w '%{http_code}' "$SITE$asset")
            echo "$asset -> $code"
            [[ "$code" =~ ^2[0-9][0-9]$ ]]
            test -s "$file"
          done

          grep -Fq 'https://ariana-backend.onrender.com' /tmp/asset-api-config.js

      - name: Check backend health and storefront catalog
        shell: bash
        run: |
          set -euo pipefail

          root_code=$(curl --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 35 -sS -L -o /tmp/backend-root.json -w '%{http_code}' "$BACKEND/")
          echo "/ -> $root_code"
          [[ "$root_code" =~ ^2[0-9][0-9]$ ]]
          grep -q '"ok":true' /tmp/backend-root.json

          catalog_ok=0
          for endpoint in /api/products /api/home/index-data; do
            file="/tmp/catalog-$(echo "$endpoint" | tr '/' '-').json"
            code=$(curl --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 35 -sS -L -o "$file" -w '%{http_code}' "$BACKEND$endpoint" || true)
            echo "$endpoint -> $code"
            if [[ "$code" =~ ^2[0-9][0-9]$ ]] && test -s "$file"; then
              if node - "$file" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          let data;
          try { data = JSON.parse(fs.readFileSync(file, 'utf8')); }
          catch { process.exit(1); }
          const arrays = [];
          if (Array.isArray(data)) arrays.push(data);
          if (data && typeof data === 'object') {
            for (const key of ['products','items','results','docs','data']) {
              if (Array.isArray(data[key])) arrays.push(data[key]);
              else if (data[key] && typeof data[key] === 'object') {
                for (const nested of ['products','items','results','docs','data']) {
                  if (Array.isArray(data[key][nested])) arrays.push(data[key][nested]);
                }
              }
            }
          }
          process.exit(arrays.some(arr => arr.length > 0) ? 0 : 1);
          NODE
              then
                catalog_ok=1
                break
              fi
            fi
          done

          test "$catalog_ok" -eq 1

      - name: Check storefront CORS to backend
        shell: bash
        run: |
          set -euo pipefail

          headers=$(curl --retry 2 --retry-all-errors --connect-timeout 15 --max-time 35 -sS -D - -o /dev/null -X OPTIONS \
            -H 'Origin: https://arianamoveis.com.br' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: content-type' \
            "$BACKEND/api/products" | tr -d '\r')

          echo "$headers"
          echo "$headers" | grep -qi '^access-control-allow-origin: https://arianamoveis.com.br$'

      - name: Summary
        run: echo 'Ariana storefront live smoke checks passed.'
