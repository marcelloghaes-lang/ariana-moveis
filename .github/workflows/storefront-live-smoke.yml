name: Ariana Storefront Live Smoke

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-finance-report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ajustar relatório por cliente
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('public/erp_financeiro_completo.html')
          s=p.read_text()
          old='<div class="notice"><b>Regra financeira:</b> multa de 2% ao mês + juros de 1% ao mês, proporcionais aos dias de atraso. Parcelas ainda não vencidas entram no saldo principal, sem multa e sem juros.</div><pre id="client-report-text" style="margin:14px 0 0;white-space:pre-wrap;font:15px/1.55 Arial,sans-serif;border:1px dashed #b8c8dc;border-radius:10px;padding:18px;background:#fff;min-height:260px"></pre>'
          new='<div id="client-report-text" style="margin:14px 0 0;border:1px solid #d8e2ef;border-radius:10px;padding:18px;background:#fff;min-height:260px;overflow:auto"></div>'
          s=s.replace(old,new)
          block=base64.b64decode('').decode()
          start=s.index('function reportPad(v,n)')
          end=s.index('function selectedRows()',start)
          s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/erp_financeiro_completo.html
          git commit -m "fix(erp): alinhar relatório financeiro e ocultar regra" || exit 0
          git push
