name: Ariana Storefront Live Smoke

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: storefront-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-finance-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply client receivables report patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch_client_report.py
          python3 /tmp/patch_client_report.py
          if ! git diff --quiet -- public/erp_financeiro_completo.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/erp_financeiro_completo.html
            git commit -m 'feat(erp): gerar relatorio consolidado por cliente'
            git push
          fi
