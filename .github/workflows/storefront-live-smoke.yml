name: Ariana Storefront Live Smoke

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge visible client rows with full report query
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/erp_financeiro_completo.html')
          s = p.read_text(encoding='utf-8')
          old = "let sourceRows=collections;\n try{const q=base.cpf||base.name,p=new URLSearchParams({direction:'receivable',q});const d=await api('/erp/financeiro/completo?'+p);const all=prepareCollections(d.entries||[]).filter(r=>customerKey(r)===key);if(all.length)sourceRows=all}catch{}"
          new = "const localRows=collections.filter(r=>customerKey(r)===key);\n let sourceRows=localRows.length?localRows:collections;\n try{const q=base.cpf||base.name,p=new URLSearchParams({direction:'receivable',q});const d=await api('/erp/financeiro/completo?'+p);const all=prepareCollections(d.entries||[]).filter(r=>customerKey(r)===key);if(all.length){const merged=new Map();for(const r of [...localRows,...all])merged.set(collectionKey(r),r);sourceRows=[...merged.values()]}}catch{}"
          if old not in s:
              raise SystemExit('report sourceRows pattern not found')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
      - name: Verify
        run: |
          grep -F "const localRows=collections.filter(r=>customerKey(r)===key)" public/erp_financeiro_completo.html
          grep -F "for(const r of [...localRows,...all])" public/erp_financeiro_completo.html
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/erp_financeiro_completo.html
          git commit -m "fix(erp): incluir compras visiveis ausentes no relatorio" || exit 0
          git push
