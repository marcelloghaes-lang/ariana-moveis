name: Ariana Enterprise Auth Hardening CI

on:
  push:
    branches: [main]
    paths:
      - 'functions/routes/enterprise/**'
      - 'functions/routes/enterpriseRoutes.js'
      - 'functions/routes/legacyRoutes.js'
      - '.github/workflows/enterprise-auth-hardening-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'functions/routes/enterprise/**'
      - 'functions/routes/enterpriseRoutes.js'
      - 'functions/routes/legacyRoutes.js'
      - '.github/workflows/enterprise-auth-hardening-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/routes/legacyRoutes.js
          node --check functions/routes/enterpriseRoutes.js
          find functions/routes/enterprise -type f -name '*.js' ! -name '*.BACKUP*' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Check undefined identifiers in Enterprise modules
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eslint@8.57.1             functions/routes/enterprise/*.js             functions/routes/enterprise/shared/*.js             functions/routes/enterpriseRoutes.js             --no-eslintrc             --env node,es2022             --parser-options '{"sourceType":"module","ecmaVersion":2022}'             --rule 'no-undef:error'

      - name: Reject duplicate Enterprise routes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'fs';
          import path from 'path';

          const dir = 'functions/routes/enterprise';
          const files = fs.readdirSync(dir)
            .filter((name) => name.endsWith('.js') && !name.includes('.BACKUP'))
            .map((name) => path.join(dir, name));

          const routes = new Map();
          const routeRe = /\b(?:app|router)\.(get|post|put|patch|delete)\(\s*(['"`])([^'"`\n]+?)\2/gi;

          for (const file of files) {
            let source = fs.readFileSync(file, 'utf8')
              .replace(/\/\*[\s\S]*?\*\//g, '')
              .replace(/^\s*\/\/.*$/gm, '');

            for (const match of source.matchAll(routeRe)) {
              const key = `${match[1].toUpperCase()} ${match[3]}`;
              const list = routes.get(key) || [];
              list.push(file);
              routes.set(key, list);
            }
          }

          const duplicates = [...routes.entries()].filter(([, files]) => files.length > 1);
          if (duplicates.length) {
            for (const [route, files] of duplicates) {
              console.error(`Duplicate route: ${route} -> ${files.join(', ')}`);
            }
            process.exit(1);
          }
          console.log('No duplicate active Enterprise routes.');
          NODE

      - name: Verify hardening guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'enterpriseBearerLooksLikeJwt' functions/routes/enterprise/shared/auth.js
          grep -q 'rateIdentity' functions/routes/enterprise/shared/auth.js
          grep -q 'return enterpriseCompatAuth(req, res, next)' functions/routes/enterprise/shared/order.js
          grep -q 'enterpriseOAuthSignAccessToken(partner, picked.environment, scopes, clientId)' functions/routes/enterprise/partnerAuthRoutes.js
          grep -q 'decoded.clientId && oauthCredential' functions/routes/enterprise/shared/partner.js
          grep -q 'findOne({ orderId, environment })' functions/routes/enterprise/shared/billing.js
          grep -q 'EnterpriseBillingRecord.findOne({ orderId: id, environment })' functions/routes/enterprise/invoiceRoutes.js
          grep -q 'recoveredAfterRestart: true' functions/routes/enterprise/enterpriseOrderRoutes.js
          grep -q "sourceOrderSchema.clone()" functions/routes/legacyRoutes.js
          grep -q "enterprise_sandbox_orders" functions/routes/legacyRoutes.js
          grep -q "2026.09.10-enterprise-hardening.1" functions/routes/enterprise/versionRoutes.js

      - name: Verify no production collection substitution
        shell: bash
        run: |
          set -euo pipefail
          grep -q "mongoose.model('EnterpriseSandboxProduct'.*'enterprise_sandbox_products'" functions/routes/legacyRoutes.js
          grep -q "mongoose.model('EnterpriseSandboxOrder'.*'enterprise_sandbox_orders'" functions/routes/legacyRoutes.js
          echo 'Enterprise hardening static checks passed.'
