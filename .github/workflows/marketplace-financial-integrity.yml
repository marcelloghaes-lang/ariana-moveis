name: Marketplace Financial Integrity

on:
  push:
    branches:
      - main
    paths:
      - 'functions/routes/currentPaymentGuardRoutes.js'
      - 'functions/services/marketplacePricingService.js'
      - 'functions/services/marketplaceHistoricalFinancialAuditService.js'
      - 'functions/tests/order-financial-integrity-guard.test.mjs'
      - '.github/workflows/marketplace-financial-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax checks
        run: |
          node --check routes/currentPaymentGuardRoutes.js
          node --check services/marketplacePricingService.js
          node --check services/marketplaceHistoricalFinancialAuditService.js

      - name: Financial integrity regression tests
        run: node --test tests/order-financial-integrity-guard.test.mjs
