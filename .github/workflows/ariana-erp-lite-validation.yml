name: Ariana ERP Lite Validation

on:
  pull_request:
    paths:
      - 'functions/services/erp/**'
      - 'functions/routes/erp/**'
      - 'functions/routes/televendas/televendasRoutes.js'
      - 'functions/routes/adminSigeCrediarioBotRoutes.js'
      - 'functions/routes/televendas/index.js'
      - 'functions/server.js'
      - 'public/erp_*.html'
      - 'public/financeiro_recibos.html'
      - '.github/workflows/ariana-erp-lite-validation.yml'
  push:
    branches:
      - main
      - erp-ariana-lite
      - erp-ariana-lite-gestao
      - erp-ariana-caixa-v2
      - erp-sige-import-dryrun
      - erp-sige-import-masterdata
      - erp-native-ui-cleanup
      - erp-sige-history-parity-finance
      - erp-finance-reports-parity
      - erp-sige-fiscal-history
    paths:
      - 'functions/services/erp/**'
      - 'functions/routes/erp/**'
      - 'functions/routes/televendas/televendasRoutes.js'
      - 'functions/routes/televendas/index.js'
      - 'functions/server.js'
      - 'public/erp_*.html'
      - 'public/financeiro_recibos.html'
      - '.github/workflows/ariana-erp-lite-validation.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check backend JavaScript syntax
        shell: bash
        run: |
          node --check functions/server.js
          node --check functions/routes/adminSigeCrediarioBotRoutes.js
          find functions/services/erp functions/routes/erp functions/routes/televendas \
            -type f -name '*.js' -print0 \
            | sort -z \
            | xargs -0 -n1 node --check
      - name: Validate finance-before-NFe rules
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { buildReceivables } from './functions/services/erp/erpService.js';

          const crediario = buildReceivables(2256, {
            method: 'crediario',
            installments: 12,
            firstDueDate: '2026-10-24'
          });
          assert.equal(crediario.length, 12);
          assert.equal(crediario[0].value, 188);
          assert.equal(crediario[0].status, 'pendente');

          const pix = buildReceivables(799, { method: 'pix', installments: 1 });
          assert.equal(pix.length, 1);
          assert.equal(pix[0].status, 'pendente');

          const paid = buildReceivables(799, { method: 'pix', installments: 1, status: 'approved' });
          assert.equal(paid[0].status, 'recebido');
          NODE
      - name: Validate sales report deduplication
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { dedupeCurrentOrders, orderSaleDate } from './functions/services/erp/erpSalesReportUtils.js';

          const base={
            customerName:'Cliente Teste',
            customerCpf:'12345678909',
            total:1000,
            payment:{method:'crediario'},
            items:[{productId:'p1',name:'Produto',qty:1,totalPrice:1000}],
            createdAt:new Date('2026-09-14T12:00:00Z'),
            updatedAt:new Date('2026-09-24T18:00:00Z'),
            televendas:{erp:{sellerName:'Marcelo'}}
          };
          const pedido={...base,_id:'1',status:'pedido'};
          const faturado={...base,_id:'2',status:'faturado'};
          const reconciled=dedupeCurrentOrders([pedido,faturado]);
          assert.equal(reconciled.orders.length,1);
          assert.equal(reconciled.orders[0].status,'faturado');
          assert.equal(reconciled.suppressed,1);
          assert.equal(orderSaleDate(pedido).toISOString(),'2026-09-14T12:00:00.000Z');

          const vendaA={...base,_id:'3',status:'faturado'};
          const vendaB={...base,_id:'4',status:'faturado'};
          const legitimate=dedupeCurrentOrders([vendaA,vendaB]);
          assert.equal(legitimate.orders.length,2);
          assert.equal(legitimate.suppressed,0);
          NODE

      - name: Validate automatic receipt contact contract
        shell: bash
        run: |
          grep -Fq "ERP_([a-f0-9]{24})" functions/services/erp/erpFinanceCustomerContactService.js
          grep -Fq "LEDGER_([a-f0-9]{24})" functions/services/erp/erpFinanceCustomerContactService.js
          grep -Fq "afterSaleReceive" functions/services/erp/erpPaymentReceiptService.js
          grep -Fq "afterLedgerReceive" functions/services/erp/erpPaymentReceiptService.js
          grep -Fq "sendCrediarioReceiptWhatsapp" functions/services/erp/erpPaymentReceiptService.js
          grep -Fq "ariana-erp-baixa|" functions/services/erp/erpPaymentReceiptService.js
          grep -Fq "migration.sourceSaleId" functions/services/erp/erpPaymentReceiptService.js
          grep -Fq "ErpSigeHistoricalSale" functions/services/erp/erpPaymentReceiptService.js
          grep -Fq "historicalInstallmentLabel" functions/services/erp/erpPaymentReceiptService.js
          grep -Fq "historicalInstallmentLabel" functions/services/erp/erpPaymentReceiptUtils.js
          grep -Fq "historicalInstallmentNumber" functions/services/erp/erpLedgerService.js
          grep -Fq "historicalInstallments" functions/services/erp/erpLedgerService.js
          grep -Fq "hasOriginal" public/erp_financeiro_completo.html
          grep -Fq "receiptDelivery" functions/services/erp/erpFinanceService.js
          grep -Fq "receiptDelivery" functions/services/erp/erpLedgerService.js
          grep -Fq "return finance.receive" functions/services/erp/erpSigeSaleParityService.js
          grep -Fq "RECEIVABLE_PAYMENT_IMMUTABLE" functions/services/erp/erpSigeSaleParityService.js
          grep -Fq "cliente_sem_whatsapp" functions/routes/adminSigeCrediarioBotRoutes.js
          grep -Fq "requiresPhone" functions/routes/adminSigeCrediarioBotRoutes.js
          grep -Fq "receiptPhoneOverlay" public/financeiro_recibos.html
          grep -Fq "receipt-phone-modal" public/erp_financeiro_completo.html
          grep -Fq "receipt-phone-modal" public/erp_financeiro.html
          grep -Fq "receipt-phone-modal" public/erp_venda_detalhe.html
          grep -Fq "Salvar telefone e enviar comprovante" public/erp_financeiro_completo.html
          grep -Fq "Salvar telefone e enviar comprovante" public/erp_financeiro.html
          grep -Fq "Salvar telefone e enviar comprovante" public/erp_venda_detalhe.html
          grep -Fq "✅ Pagamento registrado com sucesso" functions/server.js

      - name: Validate safe SIGE purchase enrichment
        shell: bash
        run: |
          grep -Fq "Pedidos/Pesquisar" functions/services/erp/erpSigeHistoricalPurchaseEnrichmentService.js
          grep -Fq "financeUntouched:true" functions/services/erp/erpSigeHistoricalPurchaseEnrichmentService.js
          grep -Fq "metadata.sigeLive" functions/services/erp/erpSigeHistoricalPurchaseEnrichmentService.js
          grep -Fq "ENRIQUECER_COMPRAS_SIGE" functions/routes/erp/erpSigeHistoryRoutes.js
          grep -Fq "purchase-history-detail" public/erp_financeiro_completo.html
          if grep -Eq "ErpFinancialEntry|ledger\.pay|Entry\.update|Entry\.bulkWrite" functions/services/erp/erpSigeHistoricalPurchaseEnrichmentService.js; then
            echo "A rotina de enriquecimento não pode escrever no financeiro do Ariana ERP."
            exit 1
          fi

      - name: Validate historical receipt product and installment
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {
            historicalSaleProduct,
            historicalInstallmentLabel
          } from './functions/services/erp/erpPaymentReceiptUtils.js';

          const sale={
            items:[
              {description:'Guarda Roupa Casal 6 Portas'},
              {description:'Guarda Roupa Casal 6 Portas'}
            ]
          };
          assert.equal(historicalSaleProduct(sale),'Guarda Roupa Casal 6 Portas');

          const rows=Array.from({length:12},(_,i)=>({
            _id:String(i+1),
            direction:'receivable',
            dueAt:new Date(2026,i,10)
          }));
          assert.equal(historicalInstallmentLabel('2',rows),'02/12');
          assert.equal(historicalInstallmentLabel('3',rows),'03/12');
          NODE

      - name: Validate ERP permission matrix
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { canAccess, resolveErpRequirement } from './functions/services/erp/erpAccessControl.js';

          const rule = (method, path) => resolveErpRequirement({ method, path });
          assert.deepEqual(rule('GET', '/erp/dashboard').any, ['dashboard:read']);
          assert.deepEqual(rule('POST', '/erp/orders').any, ['orders:update']);
          assert.deepEqual(rule('POST', '/erp/orders/abc/cancelar').any, ['orders:cancel']);
          assert.deepEqual(rule('POST', '/erp/financeiro/lancamentos/abc/quitar').any, ['payments:receive']);
          assert.deepEqual(rule('POST', '/erp/financeiro/comprovantes/abc/telefone-enviar').any, ['payments:receive']);
          assert.deepEqual(rule('GET', '/erp/migracao/sige/compras/status').any, ['finance:read','reports:read','orders:read']);
          assert.deepEqual(rule('GET', '/erp/migracao/sige/compras/123').any, ['finance:read','reports:read','orders:read']);
          assert.deepEqual(rule('POST', '/erp/migracao/sige/compras/sincronizar').any, ['settings:update']);
          assert.deepEqual(rule('GET', '/erp/finance-panel/clientes').any, ['customers:read','finance:read','payments:read']);
          assert.deepEqual(rule('GET', '/erp/finance-panel/lancamentos').any, ['finance:read','payments:read']);
          assert.deepEqual(rule('GET', '/erp/finance-panel/inadimplentes').any, ['finance:read','payments:read']);
          assert.deepEqual(rule('GET', '/erp/finance-panel/dashboard').any, ['finance:read','payments:read']);
          assert.deepEqual(rule('POST', '/erp/finance-panel/lancamentos/order123/2/pagamentos').any, ['payments:receive']);
          assert.deepEqual(rule('GET', '/erp/relatorios/inadimplentes').any, ['finance:read','payments:read','finance:reports','reports:read']);
          assert.deepEqual(rule('GET', '/erp/relatorios/inadimplentes/pdf').any, ['finance:read','payments:read','finance:reports','reports:read']);
          assert.deepEqual(rule('GET', '/erp/relatorios/inadimplentes/cobranca/entry123/preview').any, ['finance:read','payments:read']);
          assert.deepEqual(rule('POST', '/erp/relatorios/inadimplentes/cobranca/entry123/enviar').any, ['payments:receive','finance:read']);
          assert.equal(rule('POST', '/erp/migracao/sige/importar').mapped, false);
          assert.deepEqual(rule('GET', '/erp/comprovante/emitente').any, ['orders:read']);
          assert.deepEqual(rule('POST', '/erp/fiscal/nfe/preflight').any, ['fiscal:nfe:emit']);
          assert.deepEqual(rule('POST', '/erp/fiscal/nfe/devolucao/preflight').any, ['fiscal:nfe:emit']);
          assert.deepEqual(rule('POST', '/erp/fiscal/nfe/devolucao/emitir').any, ['fiscal:nfe:emit']);
          assert.equal(canAccess({admin:{role:'staff',permissions:['orders:read']}},['orders:read']), true);
          assert.equal(canAccess({admin:{role:'staff',permissions:['orders:read']}},['orders:update']), false);
          assert.equal(canAccess({admin:{role:'staff',permissions:['fiscal:nfe:emit']}},['fiscal:nfe:emit']), true);
          assert.equal(canAccess({admin:{role:'admin',permissions:[]}},['settings:update']), true);
          NODE
      - name: Extract and check ERP inline scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          out = Path('/tmp/erp-inline')
          out.mkdir(parents=True, exist_ok=True)
          files = sorted(Path('public').glob('erp_*.html'))
          finance = Path('public/financeiro_recibos.html')
          if finance.exists():
              files.append(finance)
          if not files:
              raise SystemExit('Nenhuma tela ERP/Financeiro encontrada.')
          generated = []
          for html in files:
              text = html.read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script\s*>', text, flags=re.I | re.S)
              for index, script in enumerate(scripts, 1):
                  target = out / f'{html.stem}-{index}.js'
                  target.write_text(script, encoding='utf-8')
                  generated.append(target)
          if not generated:
              raise SystemExit('Nenhum script inline ERP encontrado.')
          print('\n'.join(str(x) for x in generated))
          PY
          for file in /tmp/erp-inline/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
