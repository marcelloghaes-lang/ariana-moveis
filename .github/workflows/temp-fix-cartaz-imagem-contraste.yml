name: Correção segura de imagem e contraste dos cartazes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-fix-cartaz-imagem-contraste.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preservar imagem original e reforçar contraste
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('functions/poster-generator.js')
          text = path.read_text(encoding='utf-8')

          # 1) Contraste previsível por superfície. Azul dos layouts laterais é claro;
          # nesses casos preço/texto precisam ser azul-marinho, não amarelo lavado.
          adaptive = '''function professionalAdaptiveText(colorTheme = 'azul', layoutVariant = 'classic') {
            const key = String(colorTheme || 'azul').toLowerCase();
            const layout = String(layoutVariant || 'classic').toLowerCase();

            const naturallyLight = new Set(['celeste', 'champagne', 'salvia', 'areia', 'prata', 'lilas', 'amarelo']);
            const lateralLight = ['azul_lateral_exato', 'varejo'].includes(layout) && ['azul', 'celeste'].includes(key);
            const lightSurface = naturallyLight.has(key) || lateralLight;

            if (lightSurface) {
              return {
                primary: '#052B60',
                secondary: '#0B3F7E',
                accent: '#052B60',
                price: '#052B60',
                onDark: '#FFFFFF',
                decorative: '#FFF200'
              };
            }

            return {
              primary: '#FFFFFF',
              secondary: '#FFFFFF',
              accent: '#FFF200',
              price: '#FFF200',
              onDark: '#FFFFFF',
              decorative: '#FFF200'
            };
          }

          function professionalTextSize'''
          text, n = re.subn(
              r"function professionalAdaptiveText\(colorTheme = 'azul', layoutVariant = 'classic'\) \{.*?\n\}\n\nfunction professionalTextSize",
              adaptive,
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Falha ao localizar professionalAdaptiveText: {n}')

          # 2) Nunca usar transformação de IA do Cloudinary para recortar o produto.
          # Baixa a imagem original e o fallback local altera apenas alfa do fundo,
          # preservando 100% da geometria/RGB do produto.
          old_loader = '''  const intelligentCutoutUrl = options.removeLightBackground !== false ? cloudinaryBackgroundRemovalUrl(imageUrl) : '';
            let usedIntelligentCutout = false;
            let rawImage = null;
            if (intelligentCutoutUrl) {
              rawImage = await loadImageBuffer(intelligentCutoutUrl).catch(() => null);
              usedIntelligentCutout = Boolean(rawImage);
            }
            if (!rawImage) rawImage = await loadImageBuffer(imageUrl).catch(() => null);
            if (rawImage) {
              const cutout = usedIntelligentCutout
                ? rawImage
                : await removeEdgeConnectedLightBackground(rawImage, options.removeLightBackground !== false).catch(() => rawImage);'''
          new_loader = '''  // Usa sempre a imagem ORIGINAL como fonte. O recorte local conserva os pixels
            // do produto e só torna transparente o fundo conectado às bordas.
            const rawImage = await loadImageBuffer(imageUrl).catch(() => null);
            if (rawImage) {
              const cutout = await removeEdgeConnectedLightBackground(
                rawImage,
                options.removeLightBackground !== false
              ).catch(() => rawImage);'''
          if old_loader not in text:
              raise SystemExit('Falha ao localizar carregamento de recorte inteligente')
          text = text.replace(old_loader, new_loader, 1)

          # 3) Redimensionar por uma única escala proporcional (fit inside).
          # Não criar canvas forçado e não aplicar máscara arredondada no produto.
          resize_replacement = '''    const resizedProduct = await sharp(normalizedCutout)
              .rotate()
              .ensureAlpha()
              .resize({
                width: Math.max(1, Math.round(productMaxWidth)),
                height: Math.max(1, Math.round(productMaxHeight)),
                fit: 'inside',
                withoutEnlargement: false
              })
              .png()
              .toBuffer();
            // Mantém exatamente o recorte/proporção resultante; nenhuma máscara altera
            // cantos, antenas, telas, pés ou bordas do produto.
            const productPng = resizedProduct;
            const meta = await sharp(productPng).metadata();'''
          text, n = re.subn(
              r"    const resizedProduct = await sharp\(normalizedCutout\).*?    const meta = await sharp\(productPng\)\.metadata\(\);",
              resize_replacement,
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Falha ao localizar redimensionamento profissional: {n}')

          # Blindagem: esta correção não pode mexer no padrão de pagamento aprovado.
          required = [
              'À VISTA NO DINHEIRO OU PIX',
              'NO CARTÃO DE CRÉDITO',
              'VALOR PARCELADO: R$',
              'CREDIÁRIO PRÓPRIO'
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Padrão de pagamento ausente após patch: {item}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar código e regras protegidas
        shell: bash
        run: |
          node --check functions/poster-generator.js
          grep -q "fit: 'inside'" functions/poster-generator.js
          grep -q "const rawImage = await loadImageBuffer(imageUrl)" functions/poster-generator.js
          grep -q "lateralLight" functions/poster-generator.js
          grep -q "VALOR PARCELADO: R\$" functions/poster-generator.js

      - name: Gravar correção e remover workflow temporário
        shell: bash
        run: |
          git config user.name "Ariana Móveis Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/temp-fix-cartaz-imagem-contraste.yml
          git add functions/poster-generator.js
          git commit -m "fix: preserva proporção original e blinda contraste dos cartazes"
          git push origin HEAD:main
