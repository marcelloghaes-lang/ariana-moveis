name: gustavo-consultivo-candidate

on:
  push:
    branches:
      - feat/gustavo-recomendacao-consultiva-20260923
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check functions/scripts/loja-whatsapp-bot.js
      - name: Gustavo test suite
        run: node --test functions/tests/loja-whatsapp-bot.test.mjs
