name: Corrigir mascote lateral clean
on:
  push:
    paths:
      - '.github/workflows/temp-fix-clean-mascot.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar mascote exclusiva
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('functions/poster-generator.js')
          s = p.read_text(encoding='utf-8')

          anchor = "async function loadHeaderMascotBuffer(options = {}) {"
          helper = '''async function loadMascoteLateralCleanBuffer() {
            const encodedPath = path.resolve(__dirname, './assets/mascote-lateral-clean.base64.txt');
            try {
              if (fs.existsSync(encodedPath)) {
                const encoded = fs.readFileSync(encodedPath, 'utf8').trim();
                if (encoded) return Buffer.from(encoded, 'base64');
              }
            } catch (_error) {}
            return loadProfessionalMascotBuffer({});
          }

          '''
          if 'async function loadMascoteLateralCleanBuffer()' not in s:
            if anchor not in s:
              raise SystemExit('anchor helper not found')
            s = s.replace(anchor, helper + anchor, 1)

          old = "const cleanMascotBuffer = await loadProfessionalMascotBuffer(options).catch(() => null);"
          new = "const cleanMascotBuffer = await loadMascoteLateralCleanBuffer().catch(() => null);"
          if old in s:
            s = s.replace(old, new, 1)
          elif new not in s:
            raise SystemExit('clean mascot loader call not found')

          old_resize = ".resize(360, 760, { fit: 'contain', position: 'bottom', background: { r: 0, g: 0, b: 0, alpha: 0 } })"
          new_resize = ".resize(480, 760, { fit: 'contain', position: 'bottom', background: { r: 0, g: 0, b: 0, alpha: 0 }, withoutEnlargement: false })"
          if old_resize in s:
            s = s.replace(old_resize, new_resize, 1)
          elif new_resize not in s:
            raise SystemExit('clean mascot resize not found')

          old_pos = "composites.push({ input: cleanMascot, top: 350, left: 700 });"
          new_pos = "composites.push({ input: cleanMascot, top: 350, left: 580 });"
          if old_pos in s:
            s = s.replace(old_pos, new_pos, 1)
          elif new_pos not in s:
            raise SystemExit('clean mascot position not found')

          # Proteções: o ajuste deve ficar isolado ao layout novo.
          required = [
            "currentLayout === 'mascote_lateral_clean'",
            'loadMascoteLateralCleanBuffer()',
            'mascote-lateral-clean.base64.txt',
            'À VISTA NO DINHEIRO OU PIX',
            'NO CARTÃO DE CRÉDITO',
            'VALOR PARCELADO:',
            'CREDIÁRIO PRÓPRIO'
          ]
          for token in required:
            if token not in s:
              raise SystemExit(f'missing protected token: {token}')

          p.write_text(s, encoding='utf-8')
          PY
          node --check functions/poster-generator.js
          test -s functions/assets/mascote-lateral-clean.base64.txt
      - name: Limpar workflows temporários e publicar
        shell: bash
        run: |
          rm -f .github/workflows/temp-fix-clean-mascot.yml
          rm -f .github/workflows/temp-inspect-mascot.yml
          git config user.name 'Ariana Móveis Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nada para publicar.'
            exit 0
          fi
          git commit -m 'fix: usa mascote correta no layout lateral clean'
          git push origin HEAD:main
