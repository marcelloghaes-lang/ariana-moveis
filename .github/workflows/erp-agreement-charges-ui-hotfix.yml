name: ERP Agreement Charges UI Hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/erp-agreement-charges-ui-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply surgical patch
        run: python3 .github/scripts/patch_erp_agreement_charges.py

      - name: Verify patch
        run: |
          git diff --check
          grep -q 'id="ag-apply-charges"' public/erp_financeiro_completo.html
          grep -q 'id="ag-fine"' public/erp_financeiro_completo.html
          grep -q 'id="ag-interest"' public/erp_financeiro_completo.html
          grep -q 'refreshAgreementCharges' public/erp_financeiro_completo.html

      - name: Commit hotfix and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/erp-agreement-charges-ui-hotfix.yml
          rm .github/scripts/patch_erp_agreement_charges.py
          git add public/erp_financeiro_completo.html .github/workflows/erp-agreement-charges-ui-hotfix.yml .github/scripts/patch_erp_agreement_charges.py
          git commit -m "fix(erp): exibir encargos e opção sem juros no acordo"
          git push origin HEAD:main
