name: Smart label composition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-smart-label-composition.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/smart_label_patch.py

      - name: Validate
        run: |
          node --check functions/poster-generator.js
          grep -Fq 'function professionalTextComposition' functions/poster-generator.js
          grep -Fq 'options.compositionHints' functions/poster-generator.js
          grep -Fq 'VALOR PARCELADO: R$' functions/poster-generator.js
          grep -Fq "fit: 'inside'" functions/poster-generator.js

      - name: Commit
        run: |
          git config user.name "Ariana Móveis Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/temp-smart-label-composition.yml .github/scripts/smart_label_patch.py
          git add functions/poster-generator.js
          git commit -m "feat: posiciona e estiliza legendas de forma inteligente sem alterar o restante"
          git push origin HEAD:main
