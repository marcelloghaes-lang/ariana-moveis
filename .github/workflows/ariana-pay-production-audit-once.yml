name: Ariana Pay Production Audit Once

on:
  push:
    branches:
      - feature/ariana-pay-phase1
    paths:
      - '.github/workflows/ariana-pay-production-audit-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated Ariana Pay branch
        uses: actions/checkout@v4

      - name: Verify Shadow health and run read-only production audit
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL='https://ariana-pay-shadow.onrender.com'
          CODE="$(grep -o 'value=\"AR3DS-[0-9]*\"' functions/arianaPaySandboxServer.js | head -1 | sed -E 's/^value=\"|\"$//g')"
          test -n "$CODE"

          echo '--- SHADOW HEALTH ---'
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 8 --max-time 120 \
            "$BASE_URL/health" | tee /tmp/health.json
          echo

          echo '--- READ-ONLY AUDIT (UP TO 500 ORDERS) ---'
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 --max-time 180 \
            -H "x-ariana-pay-3ds-code: $CODE" \
            "$BASE_URL/api/sandbox/production-sample-audit?limit=500" | tee /tmp/audit.json
          echo

          node - <<'NODE'
          const fs=require('fs');
          const health=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          if(health.readyForRealMoney!==false) throw new Error('Shadow health unexpectedly reports readyForRealMoney != false');
          if(audit.writesEnabled!==false) throw new Error('Audit writesEnabled must remain false');
          if(audit.payoutsEnabled!==false) throw new Error('Audit payoutsEnabled must remain false');
          if(audit.checkoutChanged!==false) throw new Error('Audit checkoutChanged must remain false');
          console.log('AUDIT_SUMMARY='+JSON.stringify(audit.summary||{}));
          NODE
