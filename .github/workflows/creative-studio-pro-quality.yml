name: Creative Studio Pro Quality

on:
  pull_request:
    paths:
      - 'functions/creative-banner-pro-generator.js'
      - 'functions/routes/adminCoreRoutes.js'
      - 'functions/tests/creative-banner-pro-generator.test.mjs'
      - 'functions/tests/render-creative-banner-pro-snapshots.mjs'
      - 'public/js/creative_studio_pro.js'
      - 'public/creative_studio_pro.html'
      - '.github/workflows/creative-studio-pro-quality.yml'
  push:
    branches: [main]
    paths:
      - 'functions/creative-banner-pro-generator.js'
      - 'functions/routes/adminCoreRoutes.js'
      - 'functions/tests/creative-banner-pro-generator.test.mjs'
      - 'functions/tests/render-creative-banner-pro-snapshots.mjs'
      - 'public/js/creative_studio_pro.js'
      - 'public/creative_studio_pro.html'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install isolated renderer dependency
        run: npm install --no-save --package-lock=false sharp@0.34.5
      - name: Syntax
        run: |
          node --check creative-banner-pro-generator.js
          node --check routes/adminCoreRoutes.js
          node --check ../public/js/creative_studio_pro.js
      - name: Creative Studio Pro regressions
        run: node --test tests/creative-banner-pro-generator.test.mjs

      - name: Render visual snapshots
        run: node tests/render-creative-banner-pro-snapshots.mjs
      - name: Upload visual snapshots
        uses: actions/upload-artifact@v4
        with:
          name: creative-studio-pro-snapshots
          path: artifacts/creative-studio-pro/*.png
          if-no-files-found: error
