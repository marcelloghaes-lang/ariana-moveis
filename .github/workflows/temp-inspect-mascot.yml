name: Temp inspect mascot assets
on:
  push:
    paths:
      - '.github/workflows/temp-inspect-mascot.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: mascot-assets
          path: |
            public/assets/avatar-ariana.png
            public/assets/avatar-ariana2.png
            functions/assets/mascote.png
          if-no-files-found: error
