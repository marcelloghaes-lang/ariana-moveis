name: Temp debug mascot clean
on:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload existing mascot assets
        uses: actions/upload-artifact@v4
        with:
          name: existing-mascot-assets
          path: |
            functions/assets/mascote.png
            public/assets/avatar-ariana.png
            public/assets/avatar-ariana2.png
          retention-days: 1
